<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2E3B28">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>딜군 — PX에서 사면 좋은 것</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  color-scheme:light;
  --olive:#4E6144; --deep:#2E3B28; --deeper:#212A1C;
  --gold:#D2A55C; --gold-dk:#A67C3A; --gold-lt:#EBCF9B;
  --sand:#EDE1C7; --wash:#F5F2EA; --paper:#fff;
  --rule:#E6E0D3; --track:#EDE8DC;
  --ink:#1E231B; --dim:#6B6F63; --faint:#9A9C8D;
  --win:#2C7A4B; --win-bg:#E8F4EC; --win-soft:#A5D3B6;
  --same:#8A6A20; --same-bg:#FBF2DC;
  --lose:#B4432A; --lose-bg:#FBEEE8; --lose-soft:#EBBBA8;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,"Roboto Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --tabh:60px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--wash)}
body{
  font-family:var(--sans);background:var(--wash);color:var(--ink);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom));
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{display:block}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ═══ 머리 ═══════════════════════════════════════════════ */
.hero{position:relative;background:var(--deep);color:#fff;overflow:hidden;
      padding:calc(env(safe-area-inset-top) + 16px) 18px 46px}
.hero::after{content:"";position:absolute;right:-26px;top:6px;width:150px;height:150px;
             background:url(icon.svg) center/contain no-repeat;opacity:.09;pointer-events:none}
.hero h1{font-size:20px;font-weight:800;letter-spacing:-.5px;position:relative}
.hero p{font-size:12.5px;color:#A8B096;margin-top:2px;position:relative}
.hero-btn{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 16px);
          width:36px;height:36px;border-radius:11px;
          border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);
          display:grid;place-items:center;z-index:2}
.hero-btn svg{width:16px;height:16px;fill:#CFC9B8}

/* ═══ 겹쳐 올라오는 카드들 ═══════════════════════════════ */
.pull{margin-top:-34px;padding:0 14px;position:relative;z-index:3}

.tip{background:var(--paper);border-radius:14px;padding:13px 15px;
     box-shadow:0 2px 12px rgba(30,35,27,.07);display:flex;gap:11px;align-items:flex-start}
.tip .ic{font-size:17px;line-height:1.3;flex:0 0 auto}
.tip .tx{flex:1;min-width:0}
.tip .t1{font-size:13.5px;font-weight:700;line-height:1.45}
.tip .t2{font-size:11.5px;color:var(--faint);margin-top:3px}

.board{background:var(--paper);border-radius:14px;margin-top:10px;padding:14px 6px;
       box-shadow:0 2px 12px rgba(30,35,27,.06);display:flex}
.bcell{flex:1;text-align:center;position:relative}
.bcell + .bcell::before{content:"";position:absolute;left:0;top:14%;height:72%;
                        width:1px;background:var(--rule)}
.bcell .k{font-size:10.5px;color:var(--dim);font-weight:600}
.bcell .v{font-family:var(--mono);font-size:21px;font-weight:800;margin-top:3px;letter-spacing:-.5px}
.bcell.all .v{color:var(--ink)}
.bcell.w2 .v{color:var(--win)}
.bcell.w1 .v{color:var(--gold-dk)}
.bcell.ls .v{color:var(--lose)}

/* ═══ 구역 ═══════════════════════════════════════════════ */
.sec{display:flex;align-items:center;gap:7px;padding:22px 16px 11px}
.sec .em{font-size:15px}
.sec h2{font-size:16px;font-weight:800;letter-spacing:-.4px}
.sec .more{margin-left:auto;font-size:12px;font-weight:700;color:var(--dim);
           display:flex;align-items:center;gap:2px}
.sec .more svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.4}
.sec.alert h2{color:var(--lose)}

/* ═══ MUST BUY ═══════════════════════════════════════════ */
.mb{margin:0 14px;background:var(--win-bg);border:1px solid var(--win-soft);
    border-radius:15px;padding:15px;display:flex;gap:14px;align-items:center;width:auto}
.mb-img{width:66px;height:66px;border-radius:12px;background:var(--paper);flex:0 0 auto;
        display:grid;place-items:center;font-size:30px;overflow:hidden;border:1px solid #D6E7DC}
.mb-img img{width:100%;height:100%;object-fit:cover}
.mb-tx{flex:1;min-width:0;text-align:left}
.mb-badge{display:inline-block;background:var(--win);color:#fff;font-size:10px;font-weight:800;
          padding:3px 8px;border-radius:6px;letter-spacing:.3px;margin-bottom:6px}
.mb-name{font-size:15.5px;font-weight:800;letter-spacing:-.35px;line-height:1.3;
         display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mb-sub{font-size:11.5px;color:var(--dim);margin-top:2px}
.mb-rt{text-align:right;flex:0 0 auto}
.mb-pct{font-family:var(--mono);font-size:23px;font-weight:800;color:var(--win);letter-spacing:-.8px}
.mb-pct s{font-family:var(--sans);font-size:11px;font-weight:700;text-decoration:none;margin-left:1px}
.mb-price{font-family:var(--mono);font-size:15px;font-weight:800;margin-top:5px}
.mb-ref{font-size:10.5px;color:var(--faint);margin-top:1px;text-decoration:line-through}

/* ═══ 가로 스크롤 ═══════════════════════════════════════ */
.rail{display:flex;gap:9px;overflow-x:auto;padding:0 14px 4px;scrollbar-width:none;
      -webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.mini{flex:0 0 auto;width:132px;background:var(--paper);border:1px solid var(--rule);
      border-radius:13px;padding:9px;position:relative;text-align:left}
.mini-img{width:100%;height:78px;border-radius:9px;background:var(--wash);
          display:grid;place-items:center;font-size:30px;overflow:hidden;margin-bottom:8px}
.mini-img img{width:100%;height:100%;object-fit:cover}
.mini-tag{position:absolute;left:14px;top:14px;font-size:9.5px;font-weight:800;
          padding:3px 6px;border-radius:5px;color:#fff;letter-spacing:.2px;z-index:2}
.mini-tag.promo{background:var(--lose)}
.mini-tag.new{background:var(--win)}
.mini-name{font-size:12.5px;font-weight:700;line-height:1.35;height:34px;
           display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini-sub{font-size:10.5px;color:var(--faint);margin-top:2px}
.mini-pct{font-family:var(--mono);font-size:12.5px;font-weight:800;color:var(--lose);margin-top:6px}
.mini-pct.up{color:var(--win)}
.mini-price{font-family:var(--mono);font-size:14.5px;font-weight:800;margin-top:1px}
.mini-ref{font-size:10px;color:var(--faint);text-decoration:line-through;margin-top:1px}

/* ═══ 순위 목록 ═════════════════════════════════════════ */
.ranks{margin:0 14px;background:var(--paper);border:1px solid var(--rule);
       border-radius:14px;overflow:hidden}
.rrow{display:flex;align-items:center;gap:11px;padding:12px 13px;
      border-bottom:1px solid var(--rule);width:100%;text-align:left}
.rrow:last-child{border-bottom:none}
.rno{width:22px;height:22px;border-radius:7px;flex:0 0 auto;display:grid;place-items:center;
     font-family:var(--mono);font-size:11px;font-weight:800;background:var(--wash);color:var(--dim)}
.rno.top{background:var(--gold);color:#fff}
.rimg{width:38px;height:38px;border-radius:9px;background:var(--wash);flex:0 0 auto;
      display:grid;place-items:center;font-size:18px;overflow:hidden}
.rimg img{width:100%;height:100%;object-fit:cover}
.rtx{flex:1;min-width:0}
.rname{font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rsub{font-size:10.5px;color:var(--faint);margin-top:1px}
.rrt{text-align:right;flex:0 0 auto}
.rpct{font-family:var(--mono);font-size:12.5px;font-weight:800;color:var(--win)}
.rpct.bad{color:var(--lose)}
.rprice{font-family:var(--mono);font-size:13.5px;font-weight:800;margin-top:1px}

/* ═══ 후원 카드 ═════════════════════════════════════════ */
.support{margin:22px 14px 0;background:var(--deep);border-radius:15px;padding:17px;color:#fff}
.support .stamp{display:inline-block;font-size:10.5px;font-weight:800;color:var(--gold);
                border:1px solid var(--gold-dk);border-radius:6px;padding:4px 9px;margin-bottom:10px}
.support h3{font-size:14.5px;font-weight:800;letter-spacing:-.3px}
.support p{font-size:12.5px;color:#B9BCA9;line-height:1.6;margin-top:6px}

/* ═══ 검색 · 분류 ═══════════════════════════════════════ */
.bar{position:sticky;top:0;z-index:30;background:var(--wash);padding:12px 14px 0}
.bar.stuck{box-shadow:0 2px 10px rgba(30,35,27,.07)}
.sw{position:relative}
.search{width:100%;padding:12px 14px 12px 41px;border:1px solid var(--rule);
        border-radius:12px;font-size:14.5px;background:var(--paper);color:var(--ink)}
.search::placeholder{color:var(--faint)}
.search:focus{outline:none;border-color:var(--olive)}
.sw svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.38;pointer-events:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 15px;border-radius:99px;border:1px solid var(--rule);
      background:var(--paper);font-size:13px;font-weight:600;color:var(--dim);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}

/* ═══ 상세 카드 (순위·검색·저장 탭) ═════════════════════ */
.list{padding:0 14px;display:flex;flex-direction:column;gap:10px}
.card{position:relative;background:var(--paper);border:1px solid var(--rule);
      border-radius:15px;padding:14px}
.card.v-lose{border-color:var(--lose-soft);background:#FFFCFB}
.card.r1{border-color:var(--gold);box-shadow:0 3px 14px rgba(166,124,58,.13)}
.rk{position:absolute;top:-8px;left:13px;height:22px;min-width:22px;padding:0 7px;
    border-radius:99px;background:var(--olive);color:#fff;font-family:var(--mono);
    font-size:11.5px;font-weight:800;display:grid;place-items:center}
.card.r1 .rk,.card.r2 .rk,.card.r3 .rk{background:var(--gold-dk)}
.hd{display:flex;align-items:flex-start;gap:11px}
.thumb{flex:0 0 auto;width:44px;height:44px;border-radius:11px;background:var(--wash);
       display:grid;place-items:center;font-size:21px;overflow:hidden;border:1px solid var(--rule)}
.thumb img{width:100%;height:100%;object-fit:cover}
.ht{flex:1;min-width:0;padding-top:1px}
.name{font-size:15px;font-weight:800;letter-spacing:-.35px;line-height:1.3}
.sub{font-size:11.5px;color:var(--faint);margin-top:2px}
.vd{flex:0 0 auto;font-size:11px;font-weight:800;padding:5px 10px;border-radius:99px;white-space:nowrap}
.vd.win2{background:var(--win);color:#fff}
.vd.win{background:var(--win-bg);color:var(--win)}
.vd.same{background:var(--same-bg);color:var(--same)}
.vd.lose{background:var(--lose);color:#fff}
.vd.unknown{background:#F1EFE7;color:var(--faint)}
.bars{margin-top:13px;display:grid;grid-template-columns:32px 1fr auto;gap:8px 9px;align-items:center}
.bl{font-size:11px;font-weight:700;color:var(--dim)}
.bt{height:10px;border-radius:99px;background:var(--track);overflow:hidden;display:flex}
.bf{height:100%}
.f-px{background:var(--deep)} .f-ref{background:#C9C2B0}
.f-win{background:var(--win-soft)} .f-lose{background:var(--lose-soft)}
.bv{font-size:14.5px;font-weight:800;text-align:right;white-space:nowrap}
.bv.mut{font-weight:600;color:var(--faint);font-size:13.5px}
.bv .q{font-size:10.5px;font-weight:600;color:var(--faint);margin-left:2px}
.sum{display:flex;align-items:baseline;gap:8px;margin-top:12px;padding-top:11px;
     border-top:1px solid var(--rule)}
.gap{font-size:15px;font-weight:800;letter-spacing:-.3px}
.gap.win{color:var(--win)} .gap.lose{color:var(--lose)} .gap.same{color:var(--same)}
.unit{margin-left:auto;font-size:11px;color:var(--faint);white-space:nowrap}
.flag{margin-top:10px;font-size:12px;padding:8px 11px;border-radius:9px;
      background:var(--same-bg);color:var(--same);font-weight:600}
.foot{display:flex;align-items:center;gap:5px;margin-top:10px}
.tag{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;
     background:var(--wash);color:var(--dim)}
.tag.pick{background:#FAF0DC;color:var(--gold-dk)}
.fav{margin-left:auto;width:30px;height:30px;font-size:15px;opacity:.3;border-radius:8px;flex:0 0 auto}
.fav[aria-pressed="true"]{opacity:1}

/* ═══ 그 밖 ═════════════════════════════════════════════ */
.blank{padding:56px 26px;text-align:center;color:var(--dim);font-size:13.5px;line-height:1.7}
.blank b{display:block;color:var(--ink);font-size:16.5px;font-weight:800;margin-bottom:7px}
.retry{margin-top:16px;padding:10px 20px;border:1px solid var(--rule);border-radius:9px;
       background:var(--paper);font-size:13px;font-weight:700;color:var(--olive)}
.skel{height:74px;border-radius:14px;margin:0 14px 10px;
      background:linear-gradient(100deg,#EEEAE0 30%,#F8F5EE 45%,#EEEAE0 60%);
      background-size:300% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{from{background-position:200% 0}to{background-position:-100% 0}}
.pending{margin:16px 14px 0;padding:12px 14px;border-radius:11px;background:var(--paper);
         border:1px dashed var(--rule);font-size:12px;color:var(--faint);text-align:center}
.install{display:flex;align-items:center;gap:10px;background:var(--sand);border:1px solid #DDCFAF;
         border-radius:13px;padding:12px;margin:14px 14px 0;font-size:12.5px;
         font-weight:600;color:var(--deep)}
.install span{flex:1;line-height:1.4}
#insGo{background:var(--deep);color:#fff;padding:8px 14px;font-size:12.5px;border-radius:8px;
       font-weight:700;flex:0 0 auto}
#insX{color:var(--gold-dk);font-size:15px;padding:2px 4px;flex:0 0 auto}
.panel{padding:16px 14px 24px;display:flex;flex-direction:column;gap:12px}
.block{background:var(--paper);border:1px solid var(--rule);border-radius:15px;padding:17px}
.block h2{font-size:14.5px;font-weight:800;margin-bottom:9px;letter-spacing:-.3px}
.block p{font-size:13px;color:var(--dim);line-height:1.65}
.block p + p{margin-top:8px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--rule)}
.row:first-of-type{border-top:none;padding-top:2px}
.row .k{font-size:13px;font-weight:600}
.row .v{margin-left:auto;font-size:13px;color:var(--dim)}
.seg{display:flex;gap:5px;margin-left:auto}
.seg button{padding:6px 13px;border-radius:8px;border:1px solid var(--rule);
            background:var(--paper);font-size:12.5px;font-weight:700;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:#fff}
.end{height:10px}

/* ═══ 하단 탭 ═══════════════════════════════════════════ */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;
      grid-template-columns:repeat(5,1fr);background:var(--paper);
      border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
.tab{padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;
     font-size:10.5px;font-weight:700;color:var(--faint)}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;
         stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--olive)}

@media (min-width:620px){
  .hero,.pull,.sec,.list,.ranks,.mb,.rail,.panel,.support,.bar,.install,.pending{
    max-width:580px;margin-left:auto;margin-right:auto}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<header class="hero">
  <h1 id="heroTitle">딜군</h1>
  <p id="heroSub">PX에서 사면 좋은 것</p>
  <button class="hero-btn" id="share" aria-label="공유">
    <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.4 10.8l7.2-4.3M8.4 13.2l7.2 4.3" stroke="#CFC9B8" stroke-width="1.6"/></svg>
  </button>
</header>

<div class="bar" id="bar" hidden>
  <div class="sw">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
    </svg>
    <input class="search" id="q" placeholder="상품명 검색" autocomplete="off">
  </div>
  <div class="chips" id="chips"></div>
</div>

<main id="stage">
  <div class="pull"><div class="skel" style="height:58px;margin:0 0 10px"></div>
    <div class="skel" style="height:74px;margin:0"></div></div>
  <div style="height:20px"></div>
  <div class="skel"></div><div class="skel"></div>
</main>

<nav class="tabs" id="tabs" role="tablist">
  <button class="tab" role="tab" data-t="home" aria-selected="true">
    <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>홈
  </button>
  <button class="tab" role="tab" data-t="rank" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>순위
  </button>
  <button class="tab" role="tab" data-t="search" aria-selected="false">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>검색
  </button>
  <button class="tab" role="tab" data-t="saved" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 011 1v17l-7-4-7 4V4a1 1 0 011-1z"/></svg>저장
  </button>
  <button class="tab" role="tab" data-t="settings" aria-selected="false">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2L5.6 5.6"/></svg>설정
  </button>
</nav>

<script type="module">
/* ═══ 연결 : 키는 config.js 한 곳에만 ═══════════════════ */
const CFG = window.DILGUN || {};
const sb = (CFG.SUPABASE_URL && !CFG.SUPABASE_URL.includes("YOUR-PROJECT"))
  ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY) : null;

const $ = id => document.getElementById(id);
const won = n => (n ?? 0).toLocaleString("ko-KR");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TODAY = new Date().toISOString().slice(0, 10);
const days = d => d ? Math.floor((new Date(TODAY) - new Date(d)) / 864e5) : 999;

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};
let SAVED = new Set(store.get("dilgun.saved", []));
let THRESH = store.get("dilgun.thresh", 5);
let ITEMS = [], TAB = "home", cat = "전체", term = "";

/* ═══ 판정 ═══════════════════════════════════════════════ */
function judge(it){
  const q = Number(it.q), rq = Number(it.rq);
  const mart = it.mart == null ? null : Number(it.mart);
  const ref  = it.ref  == null ? null : Number(it.ref);
  const unit = q > 0 && rq > 0 && it.u && it.ru && it.u === it.ru;
  const a = unit ? mart / q : mart, b = unit ? ref / rq : ref;
  if(a == null || b == null || !b) return { v:"unknown", basis:null };
  const pct = ((a - b) / b) * 100;
  const v = pct <= -20 ? "win2" : pct <= -THRESH ? "win" : pct >= THRESH ? "lose" : "same";
  return { v, pct, a, b, basis: unit ? "unit" : "total" };
}
const LABEL = { win2:"확실히 이득", win:"이득", same:"비슷", lose:"주의", unknown:"판정 대기" };
const fmtU = n => n >= 100 ? won(Math.round(n)) : n >= 10 ? n.toFixed(1) : n.toFixed(2);
const isNew = it => it.added ? days(it.added) <= 30 : false;
const onPromo = it => !!(it.promo_ends && days(it.promo_ends) <= 0);
const volTxt = it => (it.q && it.u) ? `${it.q}${it.u}` : "";
const thumbOf = (it, cls) =>
  `<div class="${cls}">${it.img
    ? `<img src="${esc(it.img)}" alt="" loading="lazy" onerror="this.remove()">`
    : (it.emoji || "📦")}</div>`;

/* ═══ 불러오기 ═══════════════════════════════════════════ */
async function load(){
  if(!sb){
    $("stage").innerHTML = `<div class="blank"><b>설정이 아직 끝나지 않았습니다</b>
      config.js 파일에 Supabase 주소와 키를 넣어주세요.</div>`;
    return;
  }
  try{
    const { data, error } = await sb.from("products").select("*").eq("hidden", false).order("name");
    if(error) throw error;
    ITEMS = data || [];
    buildChips(); render();
  }catch(e){
    $("stage").innerHTML = `<div class="blank"><b>목록을 불러오지 못했습니다</b>
      ${esc(e.message || e)}<br>연결 상태를 확인해 주세요.
      <br><button class="retry" onclick="location.reload()">다시 시도</button></div>`;
  }
}

function buildChips(){
  const cats = ["전체", ...new Set(ITEMS.map(i => i.cat).filter(Boolean))];
  $("chips").innerHTML = cats.map(c =>
    `<button class="chip" data-c="${esc(c)}" aria-pressed="${c === cat}">${esc(c)}</button>`).join("");
  $("chips").querySelectorAll("[data-c]").forEach(b =>
    b.onclick = () => { cat = b.dataset.c; render(); });
}

/* ═══ 홈 ═════════════════════════════════════════════════ */
function home(){
  const scored = ITEMS.map(it => ({ it, j: judge(it) }));
  const known = scored.filter(s => s.j.v !== "unknown");
  const pend = scored.length - known.length;
  known.sort((x, y) => x.j.pct - y.j.pct);

  const w2 = known.filter(s => s.j.v === "win2");
  const w1 = known.filter(s => s.j.v === "win");
  const bad = known.filter(s => s.j.v === "lose" || s.j.v === "same");
  const wins = known.filter(s => s.j.pct < 0);

  /* 어떤 분류가 지금 제일 이득인지 계산해서 알려줍니다 */
  const byCat = {};
  wins.forEach(s => {
    const c = s.it.cat || "기타";
    (byCat[c] = byCat[c] || []).push(Math.abs(s.j.pct));
  });
  let best = null;
  Object.entries(byCat).forEach(([c, arr]) => {
    if(arr.length < 2) return;
    const avg = arr.reduce((a, b) => a + b, 0) / arr.length;
    if(!best || avg > best.avg) best = { c, avg, n: arr.length };
  });
  const newCnt = ITEMS.filter(isNew).length;
  const lastDate = ITEMS.map(i => i.ref_date).filter(Boolean).sort().pop();

  let h = `<div class="pull">
    <div class="tip">
      <span class="ic">💡</span>
      <span class="tx">
        <span class="t1">${best
          ? `이번엔 <b>${esc(best.c)}</b>이 특히 저렴합니다 · 평균 ${best.avg.toFixed(0)}% 저렴`
          : `시중가를 더 채우면 어떤 분류가 이득인지 알려드립니다`}</span>
        <span class="t2">${newCnt ? `신규 ${won(newCnt)}개 · ` : ""}${
          lastDate ? `시중가 확인 ${esc(lastDate)}` : "시중가 확인 전"}</span>
      </span>
    </div>

    <div class="board">
      <div class="bcell all"><div class="k">전체</div><div class="v">${won(ITEMS.length)}</div></div>
      <div class="bcell w2"><div class="k">확실히 이득</div><div class="v">${won(w2.length)}</div></div>
      <div class="bcell w1"><div class="k">이득</div><div class="v">${won(w1.length)}</div></div>
      <div class="bcell ls"><div class="k">주의</div><div class="v">${won(bad.length)}</div></div>
    </div>
  </div>`;

  if(!known.length){
    h += `<div class="blank"><b>아직 비교할 상품이 없습니다</b>
      관리자 화면에서 시중가를 넣으면 여기에 나타납니다.</div>`;
    $("stage").innerHTML = h; return;
  }

  /* 오늘의 MUST BUY */
  const top = known[0];
  if(top && top.j.pct < 0){
    h += `<div class="sec"><span class="em">🔥</span><h2>오늘의 MUST BUY</h2></div>
      <button class="mb" data-go="rank">
        ${thumbOf(top.it, "mb-img")}
        <span class="mb-tx">
          <span class="mb-badge">MUST BUY</span>
          <span class="mb-name">${esc(top.it.name)}</span>
          <span class="mb-sub">${esc(volTxt(top.it) || top.it.cat || "")}</span>
        </span>
        <span class="mb-rt">
          <span class="mb-pct">${Math.abs(top.j.pct).toFixed(0)}<s>% 저렴</s></span>
          <span class="mb-price">${won(top.it.mart)}원</span>
          <span class="mb-ref">${won(top.it.ref)}원</span>
        </span>
      </button>`;
  }

  const mini = (s, tag) => {
    const pct = Math.abs(s.j.pct).toFixed(0);
    const up = s.j.pct < 0;
    return `<button class="mini" data-go="rank">
      ${tag ? `<span class="mini-tag ${tag.k}">${tag.t}</span>` : ""}
      ${thumbOf(s.it, "mini-img")}
      <span class="mini-name">${esc(s.it.name)}</span>
      <span class="mini-sub">${esc(volTxt(s.it) || s.it.cat || "")}</span>
      <span class="mini-pct ${up ? "up" : ""}">${up ? "▼" : "▲"} ${pct}%</span>
      <span class="mini-price">${won(s.it.mart)}원</span>
      <span class="mini-ref">${won(s.it.ref)}원</span>
    </button>`;
  };

  const promoList = known.filter(s => onPromo(s.it)).slice(0, 10);
  if(promoList.length){
    h += `<div class="sec"><span class="em">🎉</span><h2>행사 상품</h2></div>
      <div class="rail">${promoList.map(s => mini(s, { k:"promo", t:"행사중" })).join("")}</div>`;
  }

  const newList = known.filter(s => isNew(s.it)).slice(0, 12);
  if(newList.length){
    h += `<div class="sec"><span class="em">🆕</span><h2>신규 상품</h2></div>
      <div class="rail">${newList.map(s => mini(s, { k:"new", t:"NEW" })).join("")}</div>`;
  }

  /* 이득 순위 — 목록형 */
  const rankTop = wins.slice(0, 6);
  if(rankTop.length){
    h += `<div class="sec"><span class="em">👑</span><h2>이득 순위</h2>
        <button class="more" data-go="rank">더보기
          <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div>
      <div class="ranks">${rankTop.map((s, i) => `
        <button class="rrow" data-go="rank">
          <span class="rno ${i < 3 ? "top" : ""}">${i + 1}</span>
          ${thumbOf(s.it, "rimg")}
          <span class="rtx">
            <span class="rname">${esc(s.it.name)}</span>
            <span class="rsub">${esc(volTxt(s.it) || s.it.cat || "")}</span>
          </span>
          <span class="rrt">
            <span class="rpct">${Math.abs(s.j.pct).toFixed(0)}% 저렴</span>
            <span class="rprice">${won(s.it.mart)}원</span>
          </span>
        </button>`).join("")}</div>`;
  }

  /* 주의 목록 — 예외가 진짜 정보입니다 */
  if(bad.length){
    h += `<div class="sec alert"><span class="em">⚠️</span><h2>시중과 비슷하거나 비쌉니다</h2>
        <button class="more" data-go="rank">더보기
          <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div>
      <div class="ranks">${bad.slice(0, 5).map(s => `
        <button class="rrow" data-go="rank">
          ${thumbOf(s.it, "rimg")}
          <span class="rtx">
            <span class="rname">${esc(s.it.name)}</span>
            <span class="rsub">${esc(volTxt(s.it) || s.it.cat || "")}</span>
          </span>
          <span class="rrt">
            <span class="rpct bad">${s.j.pct > 0 ? "+" : ""}${s.j.pct.toFixed(0)}%</span>
            <span class="rprice">${won(s.it.mart)}원</span>
          </span>
        </button>`).join("")}</div>`;
  }

  if(pend) h += `<div class="pending">시중가 확인 전 ${won(pend)}개는 판정에서 빠졌습니다</div>`;

  h += `<div class="support">
    <span class="stamp">협찬 없음 · 판정은 팔지 않습니다</span>
    <h3>돈 받고 순위를 바꾸지 않습니다</h3>
    <p>판정은 오직 단가 계산으로만 나옵니다. 수익이 생기면 그중 10%를
       군 관련 단체에 기부하고 영수증을 공개합니다.</p>
  </div><div class="end"></div>`;

  $("stage").innerHTML = h;
  $("stage").querySelectorAll("[data-go]").forEach(b =>
    b.onclick = () => switchTab(b.dataset.go));
}

/* ═══ 상세 카드 ═════════════════════════════════════════ */
function card(it, rank){
  const j = judge(it);
  const known = j.v !== "unknown";
  const qty = (n, u) => (n && u) ? `<span class="q">/${esc(n)}${esc(u)}</span>` : "";

  let bars;
  if(known){
    const max = Math.max(j.a, j.b);
    const pw = j.a / max * 100, rw = j.b / max * 100;
    const base = Math.min(pw, rw).toFixed(1);
    const cheap = j.a <= j.b;
    bars = `<div class="bl">PX</div>
      <div class="bt"><div class="bf f-px" style="width:${base}%"></div>
        ${!cheap ? `<div class="bf f-lose" style="width:${(pw - rw).toFixed(1)}%"></div>` : ""}</div>
      <div class="bv num">${won(it.mart)}원${qty(it.q, it.u)}</div>
      <div class="bl">시중</div>
      <div class="bt"><div class="bf f-ref" style="width:${base}%"></div>
        ${cheap ? `<div class="bf f-win" style="width:${(rw - pw).toFixed(1)}%"></div>` : ""}</div>
      <div class="bv num mut">${won(it.ref)}원${qty(it.rq, it.ru)}</div>`;
  } else {
    bars = `<div class="bl">PX</div>
      <div class="bt"><div class="bf f-px" style="width:100%"></div></div>
      <div class="bv num">${won(it.mart)}원${qty(it.q, it.u)}</div>`;
  }

  let sum;
  if(known){
    const diffQty = j.basis === "unit" && Number(it.q) !== Number(it.rq);
    const refAt = j.basis === "unit" ? j.b * Number(it.q) : Number(it.ref);
    const diff = Math.round(Math.abs(Number(it.mart) - refAt));
    const side = j.pct < 0 ? "저렴" : j.pct > 0 ? "비쌈" : "동일";
    const tone = j.v === "lose" ? "lose" : j.v === "same" ? "same" : "win";
    const u = j.basis === "unit" ? `${esc(it.u)}당 ${fmtU(j.a)} vs ${fmtU(j.b)}원`
                                 : "총액 기준 · 용량 미확인";
    sum = `<div class="sum">
      <span class="gap ${tone} num">${diffQty ? "같은 양이면 " : ""}${won(diff)}원 ${side}${j.pct ? ` · ${Math.abs(j.pct).toFixed(0)}%` : ""}</span>
      <span class="unit">${u}</span></div>`;
  } else {
    sum = `<div class="sum"><span class="unit" style="margin:0">시중가가 아직 없어 비교하지 못합니다</span></div>`;
  }

  const tags = [
    it.pick ? `<span class="tag pick">⭐ 추천</span>` : "",
    isNew(it) ? `<span class="tag">신상</span>` : "",
    it.ref_date ? `<span class="tag">${esc(it.ref_date)} 확인</span>` : ""
  ].filter(Boolean).join("");

  return `<article class="card v-${j.v}${rank ? " r" + rank : ""}">
    ${rank ? `<span class="rk">${rank}</span>` : ""}
    <div class="hd">
      ${thumbOf(it, "thumb")}
      <div class="ht"><div class="name">${esc(it.name)}</div>
        <div class="sub">${esc(it.cat) || "미분류"}</div></div>
      <span class="vd ${j.v}">${LABEL[j.v]}</span>
    </div>
    <div class="bars">${bars}</div>
    ${sum}
    ${onPromo(it) ? `<div class="flag">행사가로 등록된 상품입니다</div>` : ""}
    <div class="foot">${tags}
      <button class="fav" data-id="${esc(it.id)}" aria-pressed="${SAVED.has(it.id)}"
              aria-label="저장">${SAVED.has(it.id) ? "❤️" : "🤍"}</button>
    </div>
  </article>`;
}

function bind(){
  $("stage").querySelectorAll(".fav").forEach(b => b.onclick = () => {
    const id = b.dataset.id;
    if(SAVED.has(id)) SAVED.delete(id); else SAVED.add(id);
    store.set("dilgun.saved", [...SAVED]);
    b.setAttribute("aria-pressed", SAVED.has(id));
    b.textContent = SAVED.has(id) ? "❤️" : "🤍";
    if(TAB === "saved") render();
  });
}

/* ═══ 순위 · 검색 · 저장 ═══════════════════════════════ */
function listView(){
  let list = ITEMS
    .filter(it => cat === "전체" || it.cat === cat)
    .filter(it => !term || it.name.toLowerCase().includes(term));
  if(TAB === "saved") list = list.filter(it => SAVED.has(it.id));

  const scored = list.map(it => ({ it, j: judge(it) }));

  if(TAB === "rank"){
    const known = scored.filter(s => s.j.v !== "unknown");
    const pend = scored.length - known.length;
    known.sort((x, y) => x.j.pct - y.j.pct);
    if(!known.length){
      $("stage").innerHTML = `<div class="blank"><b>비교할 상품이 없습니다</b>다른 분류로 살펴보세요.</div>`;
      return;
    }
    let h = `<div class="sec"><span class="em">👑</span><h2>단가 이득 순위</h2></div>
      <div class="list">${known.map((s, i) => card(s.it, i + 1)).join("")}</div>`;
    if(pend) h += `<div class="pending">시중가 확인 전 ${won(pend)}개는 빠졌습니다</div>`;
    h += `<div class="end"></div>`;
    $("stage").innerHTML = h; bind(); return;
  }

  scored.sort((x, y) => x.it.name.localeCompare(y.it.name, "ko"));
  if(!scored.length){
    $("stage").innerHTML = `<div class="blank">${
      TAB === "saved" ? `<b>저장한 상품이 없습니다</b>카드의 하트를 누르면 여기 모입니다.`
      : term ? `<b>“${esc(term)}”에 맞는 상품이 없습니다</b>다른 이름으로 찾아보세요.`
             : `<b>상품을 검색해 보세요</b>이름 일부만 넣어도 찾아줍니다.`}</div>`;
    return;
  }
  $("stage").innerHTML = `<div class="sec"><h2>${TAB === "saved" ? "저장한 상품" : "검색 결과"}</h2>
    <span class="more">${won(scored.length)}개</span></div>
    <div class="list">${scored.map(s => card(s.it)).join("")}</div><div class="end"></div>`;
  bind();
}

/* ═══ 화면 전환 ═════════════════════════════════════════ */
const TITLE = {
  home:  ["딜군", "PX에서 사면 좋은 것"],
  rank:  ["이득 순위", "단가가 싼 순서입니다"],
  search:["검색", "찾는 상품이 있나요"],
  saved: ["저장한 상품", "하트를 누른 것들"],
  settings:["설정", "판정 기준과 자료 현황"],
};

function render(){
  const [t, s] = TITLE[TAB];
  $("heroTitle").textContent = t;
  $("heroSub").textContent = s;
  $("bar").hidden = !(TAB === "rank" || TAB === "search" || TAB === "saved");
  $("chips").parentElement.querySelectorAll("[data-c]").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.c === cat));
  $("tabs").querySelectorAll("[data-t]").forEach(b =>
    b.setAttribute("aria-selected", b.dataset.t === TAB));

  if(TAB === "home") return home();
  if(TAB === "settings") return settings();
  listView();
}

function switchTab(t){
  TAB = t; window.scrollTo({ top:0 }); render();
  if(t === "search") $("q").focus();
}

$("q").addEventListener("input", e => { term = e.target.value.trim().toLowerCase(); render(); });
$("tabs").querySelectorAll("[data-t]").forEach(b => b.onclick = () => switchTab(b.dataset.t));
addEventListener("scroll", () => $("bar").classList.toggle("stuck", scrollY > 8), { passive:true });

/* ═══ 공유 ═══════════════════════════════════════════════ */
function toast(m){
  let el = $("toast");
  if(!el){
    el = document.createElement("div"); el.id = "toast";
    el.style.cssText = "position:fixed;left:50%;bottom:-60px;transform:translateX(-50%);"
      + "background:#212A1C;color:#fff;padding:11px 20px;border-radius:99px;font-size:13px;"
      + "font-weight:600;transition:bottom .25s;z-index:60";
    document.body.appendChild(el);
  }
  el.textContent = m;
  requestAnimationFrame(() => el.style.bottom = "22px");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.style.bottom = "-60px", 1800);
}
$("share").onclick = async () => {
  const url = location.origin + location.pathname;
  if(navigator.share){
    try{ await navigator.share({ title:"딜군", text:"PX 가격, 진짜 싼지 확인해보세요", url }); }catch{}
  } else {
    try{ await navigator.clipboard.writeText(url); toast("링크를 복사했습니다"); }catch{ toast(url); }
  }
};

/* ═══ 홈 화면에 추가 ═══════════════════════════════════ */
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
let deferred = null;
function showInstall(txt, withBtn){
  const d = document.createElement("div");
  d.className = "install"; d.id = "install";
  d.innerHTML = `<span>${txt}</span>${withBtn ? `<button id="insGo">추가하기</button>` : ""}
                 <button id="insX" aria-label="닫기">✕</button>`;
  $("stage").parentElement.insertBefore(d, $("stage"));
  $("insX").onclick = () => { d.remove(); store.set("dilgun.insHide", true); };
  const go = $("insGo");
  if(go) go.onclick = async () => {
    if(!deferred) return;
    deferred.prompt(); await deferred.userChoice; deferred = null; d.remove();
  };
}
if(!standalone && !store.get("dilgun.insHide", false)){
  if(ios) showInstall("공유 버튼을 누르고 “홈 화면에 추가”를 선택하세요", false);
  else addEventListener("beforeinstallprompt", e => {
    e.preventDefault(); deferred = e;
    if(!$("install")) showInstall("홈 화면에 추가하면 앱처럼 바로 열립니다", true);
  });
}
addEventListener("appinstalled", () => $("install")?.remove());

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

load();
</script>
