<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F7F4EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>딜군</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --olive:#4E6144; --deep:#2E3B28; --band:#33422C;
  --gold:#D2A55C; --gold-dk:#A67C3A;
  --sand:#EDE1C7; --wash:#F7F4EC; --paper:#fff;
  --rule:#E2DCCF; --track:#EFEADF;
  --ink:#1F241C; --dim:#6E7166; --faint:#9C9E8F;

  --win:#2F7D4F;  --win-bg:#E7F3EA;  --win-soft:#BFDFC9;
  --same:#8A6A20; --same-bg:#FBF2DC;
  --lose:#B4432A; --lose-bg:#FBEEE8; --lose-soft:#EFC7B8;

  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,"Roboto Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;

  --tabh:58px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);background:var(--wash);color:var(--ink);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom));
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--olive);outline-offset:2px}

/* ─── 상단 : 검색 + 분류 ─────────────────────────── */
.top{position:sticky;top:0;z-index:30;background:var(--wash);padding:12px 14px 0}
.search-wrap{position:relative}
.search{
  width:100%;padding:12px 14px 12px 40px;border:1px solid var(--rule);
  border-radius:12px;font-size:14.5px;background:var(--paper);color:var(--ink);
}
.search::placeholder{color:var(--faint)}
.search:focus{outline:none;border-color:var(--olive)}
.search-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.4;pointer-events:none}

.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:7px 15px;border-radius:99px;border:1px solid var(--rule);
  background:var(--paper);font-size:13px;font-weight:600;color:var(--dim);white-space:nowrap;
}
.chip[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}

/* ─── 섹션 안내줄 ────────────────────────────────── */
.lede{padding:2px 16px 10px;font-size:12.5px;color:var(--dim)}
.lede b{color:var(--ink);font-weight:700}

/* ─── 판정 카드 ──────────────────────────────────── */
.list{padding:0 14px 18px;display:flex;flex-direction:column;gap:11px}

.card{
  position:relative;background:var(--paper);border:1px solid var(--rule);
  border-radius:14px;padding:14px 14px 12px 17px;overflow:hidden;
}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--faint)}
.card.v-win::before,.card.v-win2::before{background:var(--win)}
.card.v-same::before{background:var(--same)}
.card.v-lose::before{background:var(--lose)}

.hd{display:flex;align-items:flex-start;gap:11px}
.tile{
  flex:0 0 auto;width:44px;height:44px;border-radius:11px;background:var(--wash);
  display:grid;place-items:center;font-size:21px;line-height:1;
  position:relative;overflow:hidden;
}
.tile img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  background:var(--paper);
}
.hd-txt{flex:1;min-width:0;padding-top:1px}
.name{font-size:15.5px;font-weight:800;letter-spacing:-.3px;line-height:1.3}
.sub{font-size:12px;color:var(--faint);margin-top:2px}

.mark{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;
  font-size:11.5px;font-weight:800;padding:5px 9px;border-radius:8px;white-space:nowrap;
}
.m-win2,.m-win{background:var(--win-bg);color:var(--win)}
.m-same{background:var(--same-bg);color:var(--same)}
.m-lose{background:var(--lose-bg);color:var(--lose)}
.m-unknown{background:#F1EFE7;color:var(--faint)}

/* 막대 비교 — 이 화면의 핵심 */
.bars{margin-top:13px;display:grid;grid-template-columns:34px 1fr auto;gap:7px 9px;align-items:center}
.bar-lb{font-size:11.5px;font-weight:700;color:var(--dim)}
.bar-tr{height:9px;border-radius:99px;background:var(--track);overflow:hidden;display:flex}
.bar-fill{height:100%}
.f-px{background:var(--deep)}
.f-ref{background:#CFC9B8}
.f-gap-win{background:var(--win-soft)}
.f-gap-lose{background:var(--lose-soft)}
.bar-vl{font-size:14.5px;font-weight:800;text-align:right;white-space:nowrap}
.bar-vl.muted{font-weight:600;color:var(--faint);font-size:13.5px}
.bar-vl .qty{font-size:11px;font-weight:600;color:var(--faint);margin-left:3px}

/* 판정 요약줄 */
.sum{
  display:flex;align-items:baseline;gap:8px;margin-top:12px;
  padding-top:11px;border-top:1px solid var(--rule);
}
.gap{font-size:14.5px;font-weight:800}
.gap.win{color:var(--win)} .gap.lose{color:var(--lose)} .gap.same{color:var(--same)}
.unit{margin-left:auto;font-size:11.5px;color:var(--faint);white-space:nowrap}

.flag{
  margin-top:10px;font-size:12px;padding:8px 11px;border-radius:9px;
  background:var(--same-bg);color:var(--same);font-weight:600;
}
.note{
  margin-top:10px;font-size:12.5px;padding:8px 11px;border-radius:9px;
  background:var(--wash);color:var(--dim);line-height:1.5;
}

.save{
  position:absolute;right:10px;bottom:10px;width:32px;height:32px;
  border:none;background:none;font-size:16px;line-height:1;opacity:.3;border-radius:8px;
}
.save[aria-pressed="true"]{opacity:1}

.tags{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--wash);color:var(--dim)}
.tag.pick{background:#FAF0DC;color:var(--gold-dk)}

/* ─── 안내/빈 화면 ───────────────────────────────── */
.blank{padding:64px 26px;text-align:center;color:var(--dim);font-size:13.5px;line-height:1.7}
.blank b{display:block;color:var(--ink);font-size:16px;font-weight:800;margin-bottom:7px}

.skel{height:132px;border-radius:14px;background:linear-gradient(100deg,#F1EEE4 30%,#FAF7F0 45%,#F1EEE4 60%);background-size:300% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{from{background-position:200% 0}to{background-position:-100% 0}}

/* ─── 정적 패널 (후원 · 설정) ────────────────────── */
.panel{padding:16px 16px 24px;display:flex;flex-direction:column;gap:12px}
.block{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:16px}
.block h2{font-size:14.5px;font-weight:800;margin-bottom:8px;letter-spacing:-.2px}
.block p{font-size:13px;color:var(--dim);line-height:1.65}
.block p + p{margin-top:8px}

.pledge{background:var(--deep);border-color:var(--deep);color:#fff}
.pledge h2{color:#fff}
.pledge p{color:#CFC9B8}
.pledge .stamp{
  display:inline-block;margin-bottom:10px;font-size:11.5px;font-weight:800;
  color:var(--gold);border:1px solid var(--gold-dk);border-radius:7px;padding:5px 10px;
}

.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--rule)}
.row:first-of-type{border-top:none;padding-top:2px}
.row .k{font-size:13px;font-weight:600}
.row .v{margin-left:auto;font-size:13px;color:var(--dim)}
.seg{display:flex;gap:5px;margin-left:auto}
.seg button{
  padding:6px 12px;border-radius:8px;border:1px solid var(--rule);
  background:var(--paper);font-size:12.5px;font-weight:700;color:var(--dim);
}
.seg button[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:#fff}

/* ─── 하단 탭 ────────────────────────────────────── */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--paper);border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  border:none;background:none;padding:8px 0 9px;display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--faint);
}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--olive)}

@media (min-width:600px){
  .list{max-width:560px;margin:0 auto}
  .top,.lede,.panel{max-width:560px;margin-left:auto;margin-right:auto}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<header class="top" id="top">
  <div class="search-wrap">
    <svg class="search-ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
    </svg>
    <input class="search" id="search" placeholder="상품명 검색" autocomplete="off">
  </div>
  <div class="chips" id="chips"></div>
</header>

<p class="lede" id="lede"></p>

<main id="stage">
  <div class="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</main>

<nav class="tabs" id="tabs" role="tablist">
  <button class="tab" role="tab" data-t="verdict" aria-selected="true">
    <svg viewBox="0 0 24 24"><path d="M12 3v18M5 8h14M7 8l-3 6h6zM17 8l-3 6h6z"/></svg>판정
  </button>
  <button class="tab" role="tab" data-t="search" aria-selected="false">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>검색
  </button>
  <button class="tab" role="tab" data-t="saved" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 011 1v17l-7-4-7 4V4a1 1 0 011-1z"/></svg>저장
  </button>
  <button class="tab" role="tab" data-t="pledge" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-9.3A3.8 3.8 0 0112 8.4a3.8 3.8 0 017 2.3c0 4.9-7 9.3-7 9.3z"/></svg>후원
  </button>
  <button class="tab" role="tab" data-t="settings" aria-selected="false">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2L5.6 5.6"/></svg>설정
  </button>
</nav>

<script type="module">
/* ═══ 프로젝트 설정 ═══════════════════════════════════════ */
const SUPABASE_URL = "https://zxbiwyjlnkiyglbxxsof.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_BtUydzGa1D7zX-dYpaQ_7Q_aRusBj56";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);
const won = n => (n ?? 0).toLocaleString("ko-KR");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TODAY = new Date().toISOString().slice(0, 10);
const daysSince = d => d ? Math.floor((new Date(TODAY) - new Date(d)) / 864e5) : 999;

/* ═══ 저장·설정은 이 기기에만 남습니다 ═════════════════════ */
const store = {
  get(k, dflt){ try{ const v = localStorage.getItem(k); return v == null ? dflt : JSON.parse(v); }catch{ return dflt; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};
let SAVED  = new Set(store.get("dilgun.saved", []));
let THRESH = store.get("dilgun.thresh", 5);

let ITEMS = [], TAB = "verdict", cat = "전체", term = "";

/* ═══ 판정 ═══════════════════════════════════════════════
   단가(g·ml·개당)가 판정의 유일한 기준입니다.
   단위를 알 수 없을 때만 총액으로 물러섭니다.            */
function judge(it){
  const q = Number(it.q), rq = Number(it.rq);
  const mart = it.mart == null ? null : Number(it.mart);
  const ref  = it.ref  == null ? null : Number(it.ref);

  const canUnit = q > 0 && rq > 0 && it.u && it.ru && it.u === it.ru;
  const a = canUnit ? mart / q  : mart;
  const b = canUnit ? ref  / rq : ref;
  if(a == null || b == null || !b) return { v:"unknown", basis:null };

  const pct = ((a - b) / b) * 100;
  const v = pct <= -20 ? "win2" : pct <= -THRESH ? "win"
          : pct >=  THRESH ? "lose" : "same";
  return { v, pct, a, b, basis: canUnit ? "unit" : "total" };
}

const LABEL = { win2:"확실히 이득", win:"이득", same:"비슷", lose:"주의", unknown:"판정 불가" };
const ICON  = { win2:"✅", win:"✅", same:"➖", lose:"⚠️", unknown:"·" };

const fmtUnit = n => n >= 100 ? won(Math.round(n)) : n >= 10 ? n.toFixed(1) : n.toFixed(2);
const isNew   = it => it.added ? daysSince(it.added) <= 30 : false;
const onPromo = it => !!(it.promo_ends && daysSince(it.promo_ends) <= 0);

/* ═══ 불러오기 ═══════════════════════════════════════════ */
async function load(){
  const { data, error } = await sb.from("products")
    .select("*").eq("hidden", false).order("name");
  if(error){
    $("stage").innerHTML = `<div class="blank"><b>목록을 불러오지 못했습니다</b>
      ${esc(error.message)}<br>잠시 후 새로고침해 주세요.</div>`;
    return;
  }
  ITEMS = data;
  buildChips();
  render();
}

function buildChips(){
  const cats = ["전체", ...new Set(ITEMS.map(i => i.cat).filter(Boolean))];
  $("chips").innerHTML = cats.map(c =>
    `<button class="chip" data-c="${esc(c)}" aria-pressed="${c === cat}">${esc(c)}</button>`).join("");
  $("chips").querySelectorAll("[data-c]").forEach(b =>
    b.onclick = () => { cat = b.dataset.c; render(); });
}

/* ═══ 카드 ═══════════════════════════════════════════════ */
function card(it){
  const j = judge(it);
  const known = j.v !== "unknown";

  /* 용량이 서로 다를 수 있으니 각 가격 옆에 얼마어치인지 붙입니다 */
  const qty = (n, u) => (n && u) ? `<span class="qty">/${esc(n)}${esc(u)}</span>` : "";

  /* 막대 : 두 단가를 같은 눈금에 올리고, 차이나는 구간만 색으로 채웁니다 */
  let bars;
  if(known){
    const max = Math.max(j.a, j.b);
    const pw = j.a / max * 100, rw = j.b / max * 100;
    const same = Math.min(pw, rw).toFixed(1);
    const cheaper = j.a <= j.b;
    const gapCls  = cheaper ? "f-gap-win" : "f-gap-lose";
    bars = `
      <div class="bar-lb">PX</div>
      <div class="bar-tr">
        <div class="bar-fill f-px" style="width:${same}%"></div>
        ${!cheaper ? `<div class="bar-fill ${gapCls}" style="width:${(pw - rw).toFixed(1)}%"></div>` : ""}
      </div>
      <div class="bar-vl num">${won(it.mart)}원${qty(it.q, it.u)}</div>

      <div class="bar-lb">시중</div>
      <div class="bar-tr">
        <div class="bar-fill f-ref" style="width:${same}%"></div>
        ${cheaper ? `<div class="bar-fill ${gapCls}" style="width:${(rw - pw).toFixed(1)}%"></div>` : ""}
      </div>
      <div class="bar-vl num muted">${won(it.ref)}원${qty(it.rq, it.ru)}</div>`;
  } else {
    bars = `
      <div class="bar-lb">PX</div>
      <div class="bar-tr"><div class="bar-fill f-px" style="width:100%"></div></div>
      <div class="bar-vl num">${won(it.mart)}원${qty(it.q, it.u)}</div>`;
  }

  /* 요약 : 얼마 차이인지 + 무엇을 기준으로 판정했는지 */
  let sum;
  if(known){
    /* 용량이 다르면 총액 차이는 오해를 부릅니다.
       PX와 같은 양을 시중에서 살 때의 값으로 맞춰 비교합니다. */
    const sameQty = j.basis === "unit" && Number(it.q) !== Number(it.rq);
    const refAtPxQty = j.basis === "unit" ? j.b * Number(it.q) : Number(it.ref);
    const diff = Math.round(Math.abs(Number(it.mart) - refAtPxQty));
    const side = j.pct < 0 ? "저렴" : j.pct > 0 ? "비쌈" : "동일";
    const tone = j.v === "lose" ? "lose" : j.v === "same" ? "same" : "win";
    const unitTxt = j.basis === "unit"
      ? `${esc(it.u)}당 ${fmtUnit(j.a)} vs ${fmtUnit(j.b)}원`
      : "총액 기준 · 용량 미확인";
    sum = `<div class="sum">
      <span class="gap ${tone} num">${sameQty ? "같은 양이면 " : ""}${won(diff)}원 ${side}${j.pct ? ` · ${Math.abs(j.pct).toFixed(0)}%` : ""}</span>
      <span class="unit">${unitTxt}</span>
    </div>`;
  } else {
    sum = `<div class="sum"><span class="unit" style="margin:0">시중가가 아직 없어 비교하지 못합니다</span></div>`;
  }

  const tags = [
    it.pick ? `<span class="tag pick">⭐ 추천</span>` : "",
    isNew(it) ? `<span class="tag">신상</span>` : "",
    it.ref_date ? `<span class="tag">시중가 ${esc(it.ref_date)}</span>` : ""
  ].filter(Boolean).join("");

  return `<article class="card v-${j.v}">
    <div class="hd">
      <div class="tile">${it.emoji || "📦"}${
        it.img ? `<img src="${esc(it.img)}" alt="" loading="lazy" onerror="this.remove()">` : ""
      }</div>
      <div class="hd-txt">
        <div class="name">${esc(it.name)}</div>
        <div class="sub">${esc(it.cat) || "미분류"}</div>
      </div>
      <span class="mark m-${j.v}">${ICON[j.v]} ${LABEL[j.v]}</span>
    </div>
    <div class="bars">${bars}</div>
    ${sum}
    ${onPromo(it) ? `<div class="flag">행사가로 등록된 상품입니다</div>` : ""}
    ${it.pick && it.pick_note ? `<div class="note">${esc(it.pick_note)}</div>` : ""}
    ${tags ? `<div class="tags">${tags}</div>` : ""}
    <button class="save" data-id="${esc(it.id)}" aria-pressed="${SAVED.has(it.id)}"
            aria-label="저장">${SAVED.has(it.id) ? "❤️" : "🤍"}</button>
  </article>`;
}

/* ═══ 화면 ═══════════════════════════════════════════════ */
function render(){
  const showList = TAB === "verdict" || TAB === "search" || TAB === "saved";
  $("top").style.display  = showList ? "" : "none";
  $("lede").style.display = showList ? "" : "none";

  $("chips").querySelectorAll("[data-c]").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.c === cat));
  $("tabs").querySelectorAll("[data-t]").forEach(b =>
    b.setAttribute("aria-selected", b.dataset.t === TAB));

  if(TAB === "pledge")   return renderPledge();
  if(TAB === "settings") return renderSettings();

  let list = ITEMS
    .filter(it => cat === "전체" || it.cat === cat)
    .filter(it => !term || it.name.toLowerCase().includes(term));

  if(TAB === "saved") list = list.filter(it => SAVED.has(it.id));

  const scored = list.map(it => ({ it, j: judge(it) }));

  if(TAB === "verdict"){
    /* 이득이 큰 순서. 판정 불가는 뒤로 */
    scored.sort((x, y) =>
      (x.it.pick === y.it.pick ? 0 : (y.it.pick ? 1 : 0) - (x.it.pick ? 1 : 0)) ||
      ((x.j.pct ?? 9999) - (y.j.pct ?? 9999)));
  } else {
    scored.sort((x, y) => x.it.name.localeCompare(y.it.name, "ko"));
  }

  $("lede").innerHTML =
    TAB === "verdict" ? `PX가 시중가보다 싼 순서입니다 · <b>${won(scored.length)}개</b>`
  : TAB === "saved"   ? `저장한 상품 <b>${won(scored.length)}개</b>`
  : `검색 결과 <b>${won(scored.length)}개</b>`;

  if(!scored.length){
    $("stage").innerHTML = `<div class="blank">${
      TAB === "saved"
        ? `<b>저장한 상품이 없습니다</b>카드 오른쪽 아래 하트를 누르면 여기 모입니다.`
        : term
          ? `<b>“${esc(term)}”에 맞는 상품이 없습니다</b>다른 이름으로 찾아보세요.`
          : `<b>아직 등록된 상품이 없습니다</b>관리자 화면에서 상품과 시중가를 넣어주세요.`
    }</div>`;
    return;
  }

  $("stage").innerHTML = `<div class="list">${scored.map(s => card(s.it)).join("")}</div>`;

  $("stage").querySelectorAll(".save").forEach(b => b.onclick = () => {
    const id = b.dataset.id;
    if(SAVED.has(id)) SAVED.delete(id); else SAVED.add(id);
    store.set("dilgun.saved", [...SAVED]);
    b.setAttribute("aria-pressed", SAVED.has(id));
    b.textContent = SAVED.has(id) ? "❤️" : "🤍";
    if(TAB === "saved") render();
  });
}

function renderPledge(){
  $("stage").innerHTML = `<div class="panel">
    <div class="block pledge">
      <span class="stamp">협찬 없음 · 판정은 팔지 않습니다</span>
      <h2>돈 받고 순위를 바꾸지 않습니다</h2>
      <p>딜군의 이득·주의 판정은 오직 단가 계산으로만 나옵니다.
         어떤 브랜드도 판정을 살 수 없고, 광고로 카드를 위로 올리지 않습니다.</p>
    </div>

    <div class="block">
      <h2>수익이 생기면 10분의 1은 돌려보냅니다</h2>
      <p>이 앱에서 수익이 발생하면 그중 10%를 군 관련 단체에 기부하고,
         영수증을 이 화면에 그대로 공개합니다.</p>
      <p>아직 첫 수익 전이라 공개할 내역이 없습니다.
         생기는 즉시 여기에 날짜와 금액이 올라옵니다.</p>
    </div>

    <div class="block">
      <h2>제보가 가장 큰 도움입니다</h2>
      <p>가격이 바뀌었거나 없는 상품을 발견하면 알려주세요.
         제보 한 건이 광고 한 건보다 이 앱을 정확하게 만듭니다.</p>
    </div>
  </div>`;
}

function renderSettings(){
  const withRef = ITEMS.filter(i => i.ref != null).length;
  const last = ITEMS.map(i => i.ref_date).filter(Boolean).sort().pop();

  $("stage").innerHTML = `<div class="panel">
    <div class="block">
      <h2>판정 기준</h2>
      <p style="margin-bottom:12px">단가가 이 비율보다 싸면 이득, 비싸면 주의로 판정합니다.</p>
      <div class="row">
        <span class="k">기준 차이</span>
        <div class="seg" id="segThresh">
          ${[3,5,10].map(v => `<button data-v="${v}" aria-pressed="${v === THRESH}">${v}%</button>`).join("")}
        </div>
      </div>
    </div>

    <div class="block">
      <h2>담긴 자료</h2>
      <div class="row"><span class="k">전체 상품</span><span class="v num">${won(ITEMS.length)}개</span></div>
      <div class="row"><span class="k">시중가 있는 상품</span><span class="v num">${won(withRef)}개</span></div>
      <div class="row"><span class="k">가장 최근 시중가</span><span class="v num">${last ? esc(last) : "없음"}</span></div>
      <div class="row"><span class="k">저장한 상품</span><span class="v num">${won(SAVED.size)}개</span></div>
    </div>

    <div class="block">
      <h2>판정 방법</h2>
      <p>총액이 아니라 <b>단가</b>로 비교합니다. 100g에 5,000원과 200g에 9,000원이면
         뒤쪽이 총액은 비싸도 단가는 쌉니다.</p>
      <p>용량 단위가 서로 다르거나 비어 있으면 총액으로 비교하고,
         카드에 그 사실을 적어둡니다.</p>
      <p>배송비는 판정에 넣지 않습니다. 사람마다 조건이 달라서입니다.</p>
    </div>

    <div class="block">
      <h2>저장 위치</h2>
      <p>저장한 상품과 판정 기준은 이 기기에만 남습니다.
         다른 기기에서는 보이지 않고, 브라우저 자료를 지우면 함께 사라집니다.</p>
    </div>
  </div>`;

  $("segThresh").querySelectorAll("[data-v]").forEach(b => b.onclick = () => {
    THRESH = Number(b.dataset.v);
    store.set("dilgun.thresh", THRESH);
    render();
  });
}

/* ═══ 조작 ═══════════════════════════════════════════════ */
$("search").addEventListener("input", e => {
  term = e.target.value.trim().toLowerCase();
  render();
});

$("tabs").querySelectorAll("[data-t]").forEach(b => b.onclick = () => {
  TAB = b.dataset.t;
  window.scrollTo({ top:0 });
  render();
  if(TAB === "search") $("search").focus();
});

load();
</script>
</body>
</html>
