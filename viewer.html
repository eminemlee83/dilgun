<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light only">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2E3B28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>딜군 — PX 가격 판정</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  color-scheme: light only;

  --olive:#4E6144; --deep:#2E3B28; --deeper:#232D1E;
  --gold:#D2A55C; --gold-dk:#A67C3A; --gold-lt:#E8C88B;
  --sand:#EDE1C7; --wash:#F7F4EC; --paper:#fff;
  --rule:#E4DED1; --track:#EBE5D8;
  --ink:#1F241C; --dim:#6E7166; --faint:#9C9E8F;

  --win:#2F7D4F;  --win-bg:#E7F3EA;  --win-soft:#A9D4B8;
  --same:#8A6A20; --same-bg:#FBF2DC;
  --lose:#B4432A; --lose-bg:#FBEEE8; --lose-soft:#EBBBA8;

  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,"Roboto Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --tabh:60px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--wash)}
body{
  font-family:var(--sans);background:var(--wash);color:var(--ink);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom));
  forced-color-adjust:none;
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ═══ 머리 : 어두운 띠로 앱의 무게중심을 잡습니다 ═══════ */
.hero{
  background:var(--deep);color:#fff;
  padding:calc(env(safe-area-inset-top) + 14px) 16px 16px;
}
.hero-top{display:flex;align-items:center;gap:9px}
.hero-mark{width:30px;height:30px;border-radius:8px;flex:0 0 auto}
.hero-name{font-size:17px;font-weight:800;letter-spacing:-.4px}
.hero-tag{font-size:11px;color:#A8B096;font-weight:600;letter-spacing:.2px}
.hero-share{
  margin-left:auto;width:34px;height:34px;border-radius:10px;flex:0 0 auto;
  border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);
  display:grid;place-items:center;
}
.hero-share svg{width:16px;height:16px;fill:#CFC9B8}

/* 요약 지표 — 장식이 아니라 데이터입니다 */
.stats{display:flex;gap:2px;margin-top:15px}
.stat{flex:1;min-width:0}
.stat .v{font-family:var(--mono);font-size:19px;font-weight:800;color:var(--gold-lt);letter-spacing:-.5px}
.stat .k{font-size:10.5px;color:#8E9280;font-weight:600;margin-top:1px}
.stat + .stat{border-left:1px solid rgba(255,255,255,.1);padding-left:14px}
.stat:not(:last-child){padding-right:6px}

/* ═══ 검색 · 분류 ═══════════════════════════════════════ */
.bar{position:sticky;top:0;z-index:30;background:var(--wash);padding:13px 14px 0;
     box-shadow:0 1px 0 var(--rule)}
.bar.scrolled{box-shadow:0 2px 10px rgba(31,36,28,.07)}
.sw{position:relative}
.search{
  width:100%;padding:12px 14px 12px 41px;border:1px solid var(--rule);
  border-radius:12px;font-size:14.5px;background:var(--paper);color:var(--ink);
}
.search::placeholder{color:var(--faint)}
.search:focus{outline:none;border-color:var(--olive)}
.sw svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.38;pointer-events:none}

.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:7px 15px;border-radius:99px;border:1px solid var(--rule);
  background:var(--paper);font-size:13px;font-weight:600;color:var(--dim);white-space:nowrap;
}
.chip[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}

/* ═══ 설치 안내 ═════════════════════════════════════════ */
.install{
  display:flex;align-items:center;gap:10px;background:var(--sand);
  border:1px solid #DDCFAF;border-radius:12px;padding:11px 12px;
  margin:0 14px 12px;font-size:12.5px;font-weight:600;color:var(--deep);
}
.install span{flex:1;line-height:1.4}
.install button{border:none;border-radius:8px;font-weight:700;font-family:inherit}
#insGo{background:var(--deep);color:#fff;padding:8px 14px;font-size:12.5px;flex:0 0 auto}
#insX{background:none;color:var(--gold-dk);font-size:15px;padding:2px 4px;flex:0 0 auto}

/* ═══ 구역 제목 ═════════════════════════════════════════ */
.sec{display:flex;align-items:center;gap:8px;padding:16px 16px 11px}
.sec h2{font-size:16.5px;font-weight:800;letter-spacing:-.4px}
.sec .cnt{
  margin-left:auto;font-size:11px;font-family:var(--mono);font-weight:700;
  color:var(--dim);background:var(--paper);border:1px solid var(--rule);
  padding:3px 9px;border-radius:99px;
}
.sec.alert h2{color:var(--lose)}
.sec.alert .cnt{color:var(--lose);border-color:var(--lose-soft);background:var(--lose-bg)}

/* ═══ 판정 카드 ═════════════════════════════════════════ */
.list{padding:0 14px;display:flex;flex-direction:column;gap:10px}

.card{
  position:relative;background:var(--paper);border:1px solid var(--rule);
  border-radius:15px;padding:14px 14px 12px;
}
.card.v-lose{border-color:var(--lose-soft);background:#FFFBFA}

/* 상위권은 눈에 먼저 들어와야 합니다 */
.card.r1{border-color:var(--gold);box-shadow:0 3px 14px rgba(166,124,58,.14)}
.card.r1 .name{font-size:17px}

.rk{
  position:absolute;top:-8px;left:13px;height:22px;min-width:22px;padding:0 7px;
  border-radius:99px;background:var(--olive);color:#fff;
  font-family:var(--mono);font-size:11.5px;font-weight:800;
  display:grid;place-items:center;letter-spacing:-.02em;
}
.card.r1 .rk,.card.r2 .rk,.card.r3 .rk{background:var(--gold-dk)}
.card.r1 .rk{background:var(--gold-dk);box-shadow:0 2px 6px rgba(166,124,58,.3)}

.hd{display:flex;align-items:flex-start;gap:11px}
.thumb{
  flex:0 0 auto;width:44px;height:44px;border-radius:11px;background:var(--wash);
  display:grid;place-items:center;font-size:21px;line-height:1;
  position:relative;overflow:hidden;border:1px solid var(--rule);
}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--paper)}
.ht{flex:1;min-width:0;padding-top:1px}
.name{font-size:15.5px;font-weight:800;letter-spacing:-.35px;line-height:1.3}
.sub{font-size:11.5px;color:var(--faint);margin-top:2px}

.vd{
  flex:0 0 auto;font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:99px;
  white-space:nowrap;
}
.vd.win2{background:var(--win);color:#fff}
.vd.win{background:var(--win-bg);color:var(--win)}
.vd.same{background:var(--same-bg);color:var(--same)}
.vd.lose{background:var(--lose);color:#fff}
.vd.unknown{background:#F1EFE7;color:var(--faint)}

/* 막대 : 두 단가를 같은 눈금에, 차이 구간만 색으로 */
.bars{margin-top:13px;display:grid;grid-template-columns:32px 1fr auto;gap:8px 9px;align-items:center}
.bl{font-size:11px;font-weight:700;color:var(--dim)}
.bt{height:10px;border-radius:99px;background:var(--track);overflow:hidden;display:flex}
.bf{height:100%}
.f-px{background:var(--deep)}
.f-ref{background:#C9C2B0}
.f-win{background:var(--win-soft)}
.f-lose{background:var(--lose-soft)}
.bv{font-size:14.5px;font-weight:800;text-align:right;white-space:nowrap}
.bv.mut{font-weight:600;color:var(--faint);font-size:13.5px}
.bv .q{font-size:10.5px;font-weight:600;color:var(--faint);margin-left:2px}

.sum{display:flex;align-items:baseline;gap:8px;margin-top:12px;padding-top:11px;
     border-top:1px solid var(--rule)}
.gap{font-size:15px;font-weight:800;letter-spacing:-.3px}
.gap.win{color:var(--win)} .gap.lose{color:var(--lose)} .gap.same{color:var(--same)}
.unit{margin-left:auto;font-size:11px;color:var(--faint);white-space:nowrap}

.flag{margin-top:10px;font-size:12px;padding:8px 11px;border-radius:9px;
      background:var(--same-bg);color:var(--same);font-weight:600}
.note{margin-top:10px;font-size:12.5px;padding:9px 11px;border-radius:9px;
      background:var(--wash);color:var(--dim);line-height:1.5}

.foot{display:flex;align-items:center;gap:5px;margin-top:10px}
.tag{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;
     background:var(--wash);color:var(--dim)}
.tag.pick{background:#FAF0DC;color:var(--gold-dk)}
.fav{margin-left:auto;width:30px;height:30px;border:none;background:none;
     font-size:15px;line-height:1;opacity:.3;border-radius:8px;flex:0 0 auto}
.fav[aria-pressed="true"]{opacity:1}

/* ═══ 접이식 나머지 ═════════════════════════════════════ */
.gap-lg{height:20px}
.fold{
  margin:0 14px;width:calc(100% - 28px);padding:13px;border:1px dashed #D8D0BE;
  border-radius:12px;background:var(--paper);font-size:13px;font-weight:700;color:var(--dim);
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.fold svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4;transition:transform .2s}
.fold[aria-expanded="true"] svg{transform:rotate(180deg)}
.cond{display:none;flex-direction:column;background:var(--paper);border:1px solid var(--rule);
      border-radius:12px;overflow:hidden;margin:8px 14px 0}
.cond.on{display:flex}
.crow{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--rule)}
.crow:last-child{border-bottom:none}
.crow .e{font-size:15px;flex:0 0 auto}
.crow .n{font-size:13px;font-weight:600;flex:1;min-width:0;overflow:hidden;
         text-overflow:ellipsis;white-space:nowrap}
.crow .p{font-family:var(--mono);font-size:12.5px;font-weight:800;color:var(--win);flex:0 0 auto}

.pending{margin:18px 14px 0;padding:12px 14px;border-radius:11px;background:var(--paper);
         border:1px dashed var(--rule);font-size:12px;color:var(--faint);text-align:center}

/* ═══ 빈 화면 · 뼈대 ═══════════════════════════════════ */
.blank{padding:60px 26px;text-align:center;color:var(--dim);font-size:13.5px;line-height:1.7}
.blank b{display:block;color:var(--ink);font-size:16.5px;font-weight:800;margin-bottom:7px}
.blank .retry{margin-top:16px;padding:10px 20px;border:1px solid var(--rule);border-radius:9px;
               background:var(--paper);font-size:13px;font-weight:700;color:var(--olive)}
.skel{height:138px;border-radius:15px;
      background:linear-gradient(100deg,#F0ECE2 30%,#F9F6EF 45%,#F0ECE2 60%);
      background-size:300% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{from{background-position:200% 0}to{background-position:-100% 0}}

/* ═══ 후원 · 설정 ═══════════════════════════════════════ */
.panel{padding:16px 16px 24px;display:flex;flex-direction:column;gap:12px}
.block{background:var(--paper);border:1px solid var(--rule);border-radius:15px;padding:17px}
.block h2{font-size:14.5px;font-weight:800;margin-bottom:9px;letter-spacing:-.3px}
.block p{font-size:13px;color:var(--dim);line-height:1.65}
.block p + p{margin-top:8px}
.pledge{background:var(--deep);border-color:var(--deep)}
.pledge h2{color:#fff}
.pledge p{color:#CFC9B8}
.stamp{display:inline-block;margin-bottom:11px;font-size:11.5px;font-weight:800;
       color:var(--gold);border:1px solid var(--gold-dk);border-radius:7px;padding:5px 10px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--rule)}
.row:first-of-type{border-top:none;padding-top:2px}
.row .k{font-size:13px;font-weight:600}
.row .v{margin-left:auto;font-size:13px;color:var(--dim)}
.seg{display:flex;gap:5px;margin-left:auto}
.seg button{padding:6px 13px;border-radius:8px;border:1px solid var(--rule);
            background:var(--paper);font-size:12.5px;font-weight:700;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:#fff}

/* ═══ 하단 탭 ═══════════════════════════════════════════ */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--paper);border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{border:none;background:none;padding:9px 0 10px;display:flex;flex-direction:column;
     align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--faint)}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;
         stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--olive)}

@media (min-width:620px){
  .hero,.bar,.list,.sec,.panel,.fold,.cond,.install,.pending{max-width:580px;margin-left:auto;margin-right:auto}
  .fold{width:calc(580px - 28px)}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-top">
    <img class="hero-mark" src="icon.svg" alt="">
    <div>
      <div class="hero-name">딜군</div>
      <div class="hero-tag">PX 가격 정찰</div>
    </div>
    <button class="hero-share" id="share" aria-label="공유">
      <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.4 10.8l7.2-4.3M8.4 13.2l7.2 4.3" stroke="#CFC9B8" stroke-width="1.6"/></svg>
    </button>
  </div>
  <div class="stats" id="stats"></div>
</header>

<div class="install" id="install" hidden>
  <span id="insTxt">홈 화면에 추가하면 앱처럼 바로 열립니다</span>
  <button id="insGo">추가하기</button>
  <button id="insX" aria-label="닫기">✕</button>
</div>

<div class="bar" id="bar">
  <div class="sw">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
    </svg>
    <input class="search" id="q" placeholder="상품명 검색" autocomplete="off">
  </div>
  <div class="chips" id="chips"></div>
</div>

<main id="stage">
  <div class="list" style="padding-top:14px">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </div>
</main>

<nav class="tabs" id="tabs" role="tablist">
  <button class="tab" role="tab" data-t="verdict" aria-selected="true">
    <svg viewBox="0 0 24 24"><path d="M12 3v18M5 8h14M7 8l-3 6h6zM17 8l-3 6h6z"/></svg>판정
  </button>
  <button class="tab" role="tab" data-t="search" aria-selected="false">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>검색
  </button>
  <button class="tab" role="tab" data-t="saved" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 011 1v17l-7-4-7 4V4a1 1 0 011-1z"/></svg>저장
  </button>
  <button class="tab" role="tab" data-t="pledge" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-9.3A3.8 3.8 0 0112 8.4a3.8 3.8 0 017 2.3c0 4.9-7 9.3-7 9.3z"/></svg>후원
  </button>
  <button class="tab" role="tab" data-t="settings" aria-selected="false">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2L5.6 5.6"/></svg>설정
  </button>
</nav>

<script type="module">
/* ═══ 연결 ═══════════════════════════════════════════════
   키는 config.js 한 곳에만 둡니다. 이 파일을 새로 받아
   덮어써도 키는 그대로 남습니다.                        */
const CFG = window.DILGUN || {};
const sb = (CFG.SUPABASE_URL && !CFG.SUPABASE_URL.includes("YOUR-PROJECT"))
  ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY)
  : null;

const $ = id => document.getElementById(id);
const won = n => (n ?? 0).toLocaleString("ko-KR");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TODAY = new Date().toISOString().slice(0, 10);
const days = d => d ? Math.floor((new Date(TODAY) - new Date(d)) / 864e5) : 999;

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};
let SAVED  = new Set(store.get("dilgun.saved", []));
let THRESH = store.get("dilgun.thresh", 5);

let ITEMS = [], TAB = "verdict", cat = "전체", term = "";

/* ═══ 판정 : 단가가 기준. 단위를 모를 때만 총액으로 ═════ */
function judge(it){
  const q = Number(it.q), rq = Number(it.rq);
  const mart = it.mart == null ? null : Number(it.mart);
  const ref  = it.ref  == null ? null : Number(it.ref);
  const unit = q > 0 && rq > 0 && it.u && it.ru && it.u === it.ru;
  const a = unit ? mart / q  : mart;
  const b = unit ? ref  / rq : ref;
  if(a == null || b == null || !b) return { v:"unknown", basis:null };
  const pct = ((a - b) / b) * 100;
  const v = pct <= -20 ? "win2" : pct <= -THRESH ? "win" : pct >= THRESH ? "lose" : "same";
  return { v, pct, a, b, basis: unit ? "unit" : "total" };
}
const LABEL = { win2:"확실히 이득", win:"이득", same:"비슷", lose:"주의", unknown:"판정 대기" };
const fmtU  = n => n >= 100 ? won(Math.round(n)) : n >= 10 ? n.toFixed(1) : n.toFixed(2);
const isNew = it => it.added ? days(it.added) <= 30 : false;
const promo = it => !!(it.promo_ends && days(it.promo_ends) <= 0);

/* ═══ 불러오기 ═══════════════════════════════════════════ */
async function load(){
  if(!sb){
    $("stage").innerHTML = `<div class="blank"><b>설정이 아직 끝나지 않았습니다</b>
      config.js 파일에 Supabase 주소와 키를 넣어주세요.</div>`;
    return;
  }
  try{
    const { data, error } = await sb.from("products")
      .select("*").eq("hidden", false).order("name");
    if(error) throw error;
    ITEMS = data || [];
    buildStats(); buildChips(); render();
  }catch(e){
    $("stage").innerHTML = `<div class="blank"><b>목록을 불러오지 못했습니다</b>
      ${esc(e.message || e)}<br>연결 상태를 확인해 주세요.
      <br><button class="retry" onclick="location.reload()">다시 시도</button></div>`;
  }
}

/* 요약 지표 — 이 앱이 지금 뭘 알고 있는지 한 줄로 */
function buildStats(){
  const j = ITEMS.map(judge).filter(x => x.v !== "unknown");
  const wins = j.filter(x => x.pct < 0);
  const avg = wins.length ? wins.reduce((s, x) => s + Math.abs(x.pct), 0) / wins.length : 0;
  const max = wins.length ? Math.max(...wins.map(x => Math.abs(x.pct))) : 0;
  $("stats").innerHTML = `
    <div class="stat"><div class="v">${won(j.length)}</div><div class="k">비교한 상품</div></div>
    <div class="stat"><div class="v">${avg.toFixed(0)}%</div><div class="k">평균 절약</div></div>
    <div class="stat"><div class="v">${max.toFixed(0)}%</div><div class="k">최대 절약</div></div>`;
}

function buildChips(){
  const cats = ["전체", ...new Set(ITEMS.map(i => i.cat).filter(Boolean))];
  $("chips").innerHTML = cats.map(c =>
    `<button class="chip" data-c="${esc(c)}" aria-pressed="${c === cat}">${esc(c)}</button>`).join("");
  $("chips").querySelectorAll("[data-c]").forEach(b =>
    b.onclick = () => { cat = b.dataset.c; render(); });
}

/* ═══ 카드 ═══════════════════════════════════════════════ */
function card(it, rank){
  const j = judge(it);
  const known = j.v !== "unknown";
  const qty = (n, u) => (n && u) ? `<span class="q">/${esc(n)}${esc(u)}</span>` : "";

  let bars;
  if(known){
    const max = Math.max(j.a, j.b);
    const pw = j.a / max * 100, rw = j.b / max * 100;
    const base = Math.min(pw, rw).toFixed(1);
    const cheap = j.a <= j.b;
    bars = `
      <div class="bl">PX</div>
      <div class="bt">
        <div class="bf f-px" style="width:${base}%"></div>
        ${!cheap ? `<div class="bf f-lose" style="width:${(pw - rw).toFixed(1)}%"></div>` : ""}
      </div>
      <div class="bv num">${won(it.mart)}원${qty(it.q, it.u)}</div>
      <div class="bl">시중</div>
      <div class="bt">
        <div class="bf f-ref" style="width:${base}%"></div>
        ${cheap ? `<div class="bf f-win" style="width:${(rw - pw).toFixed(1)}%"></div>` : ""}
      </div>
      <div class="bv num mut">${won(it.ref)}원${qty(it.rq, it.ru)}</div>`;
  } else {
    bars = `<div class="bl">PX</div>
      <div class="bt"><div class="bf f-px" style="width:100%"></div></div>
      <div class="bv num">${won(it.mart)}원${qty(it.q, it.u)}</div>`;
  }

  let sum;
  if(known){
    /* 용량이 다르면 총액 차이는 오해를 부릅니다.
       PX와 같은 양을 시중에서 살 때 값으로 맞춥니다. */
    const diffQty = j.basis === "unit" && Number(it.q) !== Number(it.rq);
    const refAt = j.basis === "unit" ? j.b * Number(it.q) : Number(it.ref);
    const diff = Math.round(Math.abs(Number(it.mart) - refAt));
    const side = j.pct < 0 ? "저렴" : j.pct > 0 ? "비쌈" : "동일";
    const tone = j.v === "lose" ? "lose" : j.v === "same" ? "same" : "win";
    const u = j.basis === "unit"
      ? `${esc(it.u)}당 ${fmtU(j.a)} vs ${fmtU(j.b)}원`
      : "총액 기준 · 용량 미확인";
    sum = `<div class="sum">
      <span class="gap ${tone} num">${diffQty ? "같은 양이면 " : ""}${won(diff)}원 ${side}${j.pct ? ` · ${Math.abs(j.pct).toFixed(0)}%` : ""}</span>
      <span class="unit">${u}</span></div>`;
  } else {
    sum = `<div class="sum"><span class="unit" style="margin:0">시중가가 아직 없어 비교하지 못합니다</span></div>`;
  }

  const tags = [
    it.pick ? `<span class="tag pick">⭐ 추천</span>` : "",
    isNew(it) ? `<span class="tag">신상</span>` : "",
    it.ref_date ? `<span class="tag">${esc(it.ref_date)} 확인</span>` : ""
  ].filter(Boolean).join("");

  return `<article class="card v-${j.v}${rank ? " r" + rank : ""}">
    ${rank ? `<span class="rk">${rank}</span>` : ""}
    <div class="hd">
      <div class="thumb">${it.emoji || "📦"}${
        it.img ? `<img src="${esc(it.img)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</div>
      <div class="ht">
        <div class="name">${esc(it.name)}</div>
        <div class="sub">${esc(it.cat) || "미분류"}</div>
      </div>
      <span class="vd ${j.v}">${LABEL[j.v]}</span>
    </div>
    <div class="bars">${bars}</div>
    ${sum}
    ${promo(it) ? `<div class="flag">행사가로 등록된 상품입니다</div>` : ""}
    ${it.pick && it.pick_note ? `<div class="note">${esc(it.pick_note)}</div>` : ""}
    <div class="foot">${tags}
      <button class="fav" data-id="${esc(it.id)}" aria-pressed="${SAVED.has(it.id)}"
              aria-label="저장">${SAVED.has(it.id) ? "❤️" : "🤍"}</button>
    </div>
  </article>`;
}

/* ═══ 화면 ═══════════════════════════════════════════════ */
function render(){
  const listTab = TAB === "verdict" || TAB === "search" || TAB === "saved";
  $("bar").style.display = listTab ? "" : "none";
  $("chips").querySelectorAll("[data-c]").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.c === cat));
  $("tabs").querySelectorAll("[data-t]").forEach(b =>
    b.setAttribute("aria-selected", b.dataset.t === TAB));

  if(TAB === "pledge")   return pledge();
  if(TAB === "settings") return settings();

  let list = ITEMS
    .filter(it => cat === "전체" || it.cat === cat)
    .filter(it => !term || it.name.toLowerCase().includes(term));
  if(TAB === "saved") list = list.filter(it => SAVED.has(it.id));

  const scored = list.map(it => ({ it, j: judge(it) }));
  if(TAB === "verdict") return verdict(scored);

  scored.sort((x, y) => x.it.name.localeCompare(y.it.name, "ko"));
  if(!scored.length){
    $("stage").innerHTML = `<div class="blank">${
      TAB === "saved"
        ? `<b>저장한 상품이 없습니다</b>카드의 하트를 누르면 여기 모입니다.`
        : term ? `<b>“${esc(term)}”에 맞는 상품이 없습니다</b>다른 이름으로 찾아보세요.`
               : `<b>상품을 검색해 보세요</b>이름 일부만 넣어도 찾아줍니다.`
    }</div>`;
    return;
  }
  $("stage").innerHTML = `<div class="sec"><h2>${TAB === "saved" ? "저장한 상품" : "검색 결과"}</h2>
    <span class="cnt">${won(scored.length)}개</span></div>
    <div class="list">${scored.map(s => card(s.it)).join("")}</div>`;
  bind();
}

/* PX는 원래 대부분 쌉니다. 그래서 "싼가?"가 아니라
   "뭐가 제일 이득인가?"와 "예외는 뭔가?"를 보여줍니다. */
function verdict(scored){
  const known = scored.filter(s => s.j.v !== "unknown");
  const pend  = scored.length - known.length;
  known.sort((x, y) => (x.j.pct ?? 0) - (y.j.pct ?? 0));

  const alert = known.filter(s => s.j.v === "lose" || s.j.v === "same");
  const wins  = known.filter(s => s.j.v === "win" || s.j.v === "win2");
  const top   = wins.slice(0, 10), rest = wins.slice(10);

  if(!known.length && !pend){
    $("stage").innerHTML = `<div class="blank"><b>아직 등록된 상품이 없습니다</b>
      관리자 화면에서 상품과 시중가를 넣어주세요.</div>`;
    return;
  }

  let h = "";
  if(top.length){
    h += `<div class="sec"><h2>지금 가장 이득</h2><span class="cnt">TOP ${top.length}</span></div>
          <div class="list">${top.map((s, i) => card(s.it, i + 1)).join("")}</div>`;
  }
  if(alert.length){
    h += `<div class="gap-lg"></div>
          <div class="sec alert"><h2>시중과 비슷하거나 비쌉니다</h2>
          <span class="cnt">${won(alert.length)}개</span></div>
          <div class="list">${alert.map(s => card(s.it)).join("")}</div>`;
  }
  if(rest.length){
    h += `<div class="gap-lg"></div>
      <button class="fold" id="fold" aria-expanded="false">
        나머지 이득 상품 ${won(rest.length)}개
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="cond" id="rest">${rest.map(s => `<div class="crow">
        <span class="e">${s.it.emoji || "📦"}</span>
        <span class="n">${esc(s.it.name)}</span>
        <span class="p num">${Math.abs(s.j.pct).toFixed(0)}%</span></div>`).join("")}</div>`;
  }
  if(pend) h += `<div class="pending">시중가 확인 전 ${won(pend)}개는 판정에서 빠졌습니다</div>`;
  if(!h) h = `<div class="blank"><b>표시할 상품이 없습니다</b>다른 분류로 살펴보세요.</div>`;

  $("stage").innerHTML = h;
  bind();
  const f = $("fold");
  if(f) f.onclick = () => {
    const open = f.getAttribute("aria-expanded") === "true";
    f.setAttribute("aria-expanded", String(!open));
    $("rest").classList.toggle("on", !open);
  };
}

function bind(){
  $("stage").querySelectorAll(".fav").forEach(b => b.onclick = () => {
    const id = b.dataset.id;
    if(SAVED.has(id)) SAVED.delete(id); else SAVED.add(id);
    store.set("dilgun.saved", [...SAVED]);
    b.setAttribute("aria-pressed", SAVED.has(id));
    b.textContent = SAVED.has(id) ? "❤️" : "🤍";
    if(TAB === "saved") render();
  });
}

function pledge(){
  $("stage").innerHTML = `<div class="panel">
    <div class="block pledge">
      <span class="stamp">협찬 없음 · 판정은 팔지 않습니다</span>
      <h2>돈 받고 순위를 바꾸지 않습니다</h2>
      <p>딜군의 판정은 오직 단가 계산으로만 나옵니다. 어떤 브랜드도 판정을 살 수 없고,
         광고로 카드를 위로 올리지 않습니다.</p>
    </div>
    <div class="block">
      <h2>수익의 10분의 1은 돌려보냅니다</h2>
      <p>이 앱에서 수익이 생기면 그중 10%를 군 관련 단체에 기부하고,
         영수증을 이 화면에 그대로 공개합니다.</p>
      <p>아직 첫 수익 전이라 공개할 내역이 없습니다.</p>
    </div>
    <div class="block">
      <h2>제보가 가장 큰 도움입니다</h2>
      <p>가격이 바뀌었거나 없는 상품을 발견하면 알려주세요.
         제보 한 건이 광고 한 건보다 이 앱을 정확하게 만듭니다.</p>
    </div>
  </div>`;
}

function settings(){
  const withRef = ITEMS.filter(i => i.ref != null).length;
  const last = ITEMS.map(i => i.ref_date).filter(Boolean).sort().pop();
  $("stage").innerHTML = `<div class="panel">
    <div class="block">
      <h2>판정 기준</h2>
      <p style="margin-bottom:12px">단가가 이 비율보다 싸면 이득, 비싸면 주의로 봅니다.</p>
      <div class="row"><span class="k">기준 차이</span>
        <div class="seg" id="seg">${[3,5,10].map(v =>
          `<button data-v="${v}" aria-pressed="${v === THRESH}">${v}%</button>`).join("")}</div>
      </div>
    </div>
    <div class="block">
      <h2>담긴 자료</h2>
      <div class="row"><span class="k">전체 상품</span><span class="v num">${won(ITEMS.length)}개</span></div>
      <div class="row"><span class="k">시중가 있는 상품</span><span class="v num">${won(withRef)}개</span></div>
      <div class="row"><span class="k">가장 최근 시중가</span><span class="v num">${last ? esc(last) : "없음"}</span></div>
      <div class="row"><span class="k">저장한 상품</span><span class="v num">${won(SAVED.size)}개</span></div>
    </div>
    <div class="block">
      <h2>판정 방법</h2>
      <p>총액이 아니라 <b>단가</b>로 비교합니다. 100g에 5,000원과 200g에 9,000원이면
         뒤쪽이 총액은 비싸도 단가는 쌉니다.</p>
      <p>용량 단위가 다르거나 비어 있으면 총액으로 비교하고, 카드에 그 사실을 적어둡니다.</p>
      <p>배송비는 판정에 넣지 않습니다. 사람마다 조건이 달라서입니다.</p>
    </div>
    <div class="block">
      <h2>저장 위치</h2>
      <p>저장한 상품과 판정 기준은 이 기기에만 남습니다. 다른 기기에서는 보이지 않고,
         브라우저 자료를 지우면 함께 사라집니다.</p>
    </div>
  </div>`;
  $("seg").querySelectorAll("[data-v]").forEach(b => b.onclick = () => {
    THRESH = Number(b.dataset.v);
    store.set("dilgun.thresh", THRESH);
    buildStats(); render();
  });
}

/* ═══ 조작 ═══════════════════════════════════════════════ */
$("q").addEventListener("input", e => { term = e.target.value.trim().toLowerCase(); render(); });

$("tabs").querySelectorAll("[data-t]").forEach(b => b.onclick = () => {
  TAB = b.dataset.t;
  window.scrollTo({ top:0 });
  render();
  if(TAB === "search") $("q").focus();
});

addEventListener("scroll", () => {
  $("bar").classList.toggle("scrolled", window.scrollY > 8);
}, { passive:true });

function toast(m){
  let el = $("toast");
  if(!el){
    el = document.createElement("div"); el.id = "toast";
    el.style.cssText = "position:fixed;left:50%;bottom:-60px;transform:translateX(-50%);"
      + "background:#232D1E;color:#fff;padding:11px 20px;border-radius:99px;font-size:13px;"
      + "font-weight:600;transition:bottom .25s;z-index:60";
    document.body.appendChild(el);
  }
  el.textContent = m;
  requestAnimationFrame(() => el.style.bottom = "22px");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.style.bottom = "-60px", 1800);
}

$("share").onclick = async () => {
  const url = location.origin + location.pathname;
  if(navigator.share){
    try{ await navigator.share({ title:"딜군", text:"PX 가격, 진짜 싼지 확인해보세요", url }); }catch{}
  } else {
    try{ await navigator.clipboard.writeText(url); toast("링크를 복사했습니다"); }catch{ toast(url); }
  }
};

/* ═══ 홈 화면에 추가 ═══════════════════════════════════ */
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
let deferred = null;

if(!standalone && !store.get("dilgun.insHide", false)){
  if(ios){
    $("insTxt").textContent = "공유 버튼을 누르고 “홈 화면에 추가”를 선택하세요";
    $("insGo").style.display = "none";
    $("install").hidden = false;
  } else {
    addEventListener("beforeinstallprompt", e => {
      e.preventDefault(); deferred = e; $("install").hidden = false;
    });
  }
}
$("insGo").onclick = async () => {
  if(!deferred) return;
  deferred.prompt(); await deferred.userChoice;
  deferred = null; $("install").hidden = true;
};
$("insX").onclick = () => { $("install").hidden = true; store.set("dilgun.insHide", true); };
addEventListener("appinstalled", () => { $("install").hidden = true; });

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

load();
</script>
