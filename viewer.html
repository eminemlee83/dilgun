<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2E3B28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>딜군 — PX에서 사면 좋은 것</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  color-scheme:light;
  --olive:#4E6144; --deep:#2E3B28; --deeper:#212A1C;
  --gold:#D2A55C; --gold-dk:#A67C3A; --gold-lt:#EBCF9B;
  --silver:#AFAFA2; --bronze:#B08050;
  --sand:#EDE1C7; --sand-dp:#E2D2B2; --wash:#F5F2EA; --paper:#fff;
  --rule:#E6E0D3; --line:#EEE9DE;
  --ink:#1E231B; --dim:#6B6F63; --faint:#8E9082; --arrow:#7E8174;
  --win:#2C7A4B; --win-bg:#EBF6EF; --win-line:#BEDECB;
  --same:#8A6A20; --same-bg:#FBF3DE; --same-line:#E9DAB6;
  --lose:#B4432A; --lose-bg:#FDF0EB; --lose-line:#EFCCBD;
  --sh-xs:0 1px 2px rgba(30,35,27,.05);
  --sh-sm:0 1px 4px rgba(30,35,27,.06);
  --sh-md:0 2px 10px rgba(30,35,27,.07);
  --sh-lg:0 6px 20px rgba(30,35,27,.10);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,"Roboto Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --tabh:62px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--wash)}
body{font-family:var(--sans);background:var(--wash);color:var(--ink);font-size:14px;
     line-height:1.5;-webkit-font-smoothing:antialiased;
     padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom))}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;text-align:left}
img{display:block}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.chev{width:16px;height:16px;stroke:var(--arrow);fill:none;stroke-width:2.6;flex:0 0 auto}

/* ═══ 머리 ═══════════════════════════════════════════════ */
.hero{position:relative;background:var(--deep);overflow:hidden;color:#fff;text-align:center;
      padding:calc(env(safe-area-inset-top) + 15px) 64px 18px}
.hero-tx{position:relative;z-index:2}
.hero .brand{font-size:12px;font-weight:800;color:var(--gold-lt);letter-spacing:.6px;
             display:block;margin-bottom:3px}
.hero h1{font-size:21px;font-weight:800;letter-spacing:-.7px;line-height:1.2}
.hero p{display:none}
.hbtn{position:absolute;top:calc(env(safe-area-inset-top) + 14px);width:40px;height:40px;
      border-radius:13px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.09);
      display:grid;place-items:center;z-index:5}
.hbtn.l{left:12px} .hbtn.r{right:12px} .hbtn.r2{right:58px}
.hbtn svg{width:21px;height:21px;stroke:#E4E0D2;fill:none;stroke-width:2}

/* 작은 머리 (목록 탭) */
.hero.slim{padding:calc(env(safe-area-inset-top) + 17px) 64px 16px}
.hero.slim h1{font-size:18px;letter-spacing:-.5px}
.hero.slim .brand{display:none}

/* 흰 머리 (상세) */
.hero.sheet{background:var(--paper);color:var(--ink);border-bottom:1px solid var(--line);
            padding:calc(env(safe-area-inset-top) + 15px) 104px 14px}
.hero.sheet h1{font-size:16px;font-weight:800;letter-spacing:-.4px;
               white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero.sheet .brand{display:none}
.hero.sheet .hbtn{border-color:var(--rule);background:var(--wash);top:calc(env(safe-area-inset-top) + 12px)}
.hero.sheet .hbtn svg{stroke:var(--ink)}

/* ═══ 구역 제목 ═════════════════════════════════════════ */
.sec{display:flex;align-items:center;gap:7px;padding:22px 16px 12px}
.sec .em{font-size:16px}
.sec h2{font-size:16.5px;font-weight:800;letter-spacing:-.4px}
.sec .more{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--dim);
           display:flex;align-items:center;gap:1px}
.sec.alert h2{color:var(--lose)}
.nb{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;
    border-radius:6px;background:var(--olive);color:#fff;font-size:10px;font-weight:800}

/* ═══ 할인 배지 : 테두리 있는 알약 ═════════════════════ */
.bdg{display:inline-block;font-size:11px;font-weight:800;padding:4px 9px;border-radius:8px;
     border:1px solid;white-space:nowrap;letter-spacing:-.2px}
.bdg.win{background:var(--win-bg);border-color:var(--win-line);color:var(--win)}
.bdg.same{background:var(--same-bg);border-color:var(--same-line);color:var(--same)}
.bdg.lose{background:var(--lose-bg);border-color:var(--lose-line);color:var(--lose)}
.bdg.wait{background:var(--wash);border-color:var(--rule);color:var(--faint)}
.bdg.must{background:var(--lose);border-color:var(--lose);color:#fff;font-size:10px;
          padding:4px 8px;letter-spacing:.2px}

/* ═══ MUST BUY ═══════════════════════════════════════════ */
.mb{display:flex;gap:15px;width:calc(100% - 28px);margin:0 14px;background:var(--win-bg);
    border:1.5px solid var(--win-line);border-radius:18px;padding:17px;box-shadow:var(--sh-lg);
    align-items:flex-start}
.mb-img{width:104px;height:116px;border-radius:15px;background:var(--paper);flex:0 0 auto;
        display:grid;place-items:center;font-size:44px;overflow:hidden;
        border:1px solid var(--win-line);box-shadow:var(--sh-sm)}
.mb-img img{width:100%;height:100%;object-fit:contain;padding:7px}
.mb-tx{flex:1;min-width:0}
.mb-name{font-size:16.5px;font-weight:800;letter-spacing:-.4px;line-height:1.3;
         display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mb-vol{font-size:12px;color:var(--dim);margin-top:3px}
.mb-mid{display:flex;align-items:center;gap:8px;margin-top:10px}
.mb-like{font-size:11.5px;font-weight:700;color:var(--gold-dk)}
.mb-bot{display:flex;align-items:flex-end;gap:9px;margin-top:10px}
.mb-price{font-family:var(--mono);font-size:25px;font-weight:800;color:var(--lose);letter-spacing:-.9px}
.mb-ref{font-size:11.5px;color:var(--faint);text-decoration:line-through;margin-top:3px}

/* ═══ 가로 스크롤 카드 ═════════════════════════════════ */
.rail{display:flex;gap:10px;overflow-x:auto;padding:0 14px 6px;scrollbar-width:none;
      -webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.rc{flex:0 0 auto;width:132px;background:var(--paper);border:1px solid var(--rule);
    border-radius:15px;padding:10px;position:relative;box-shadow:var(--sh-xs)}
.rc-tag{position:absolute;left:15px;top:15px;font-size:9.5px;font-weight:800;
        padding:3px 7px;border-radius:6px;color:#fff;z-index:2;letter-spacing:.2px}
.rc-tag.promo{background:var(--lose)} .rc-tag.new{background:var(--olive)}
.rc-rank{position:absolute;left:15px;top:15px;z-index:2;width:23px;height:23px;
         border-radius:99px;display:grid;place-items:center;font-family:var(--mono);
         font-size:11px;font-weight:800;background:var(--paper);color:var(--dim);
         box-shadow:var(--sh-sm)}
.rc-rank.m1{background:var(--gold);color:#fff}
.rc-rank.m2{background:var(--silver);color:#fff}
.rc-rank.m3{background:var(--bronze);color:#fff}
.rc-img{width:100%;height:86px;border-radius:12px;background:var(--wash);display:grid;
        place-items:center;font-size:34px;overflow:hidden;margin-bottom:9px;border:1px solid #fff}
.rc-img img{width:100%;height:100%;object-fit:contain;padding:5px}
.rc-name{font-size:12.5px;font-weight:700;line-height:1.35;height:34px;
         display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rc-vol{font-size:10.5px;color:var(--faint);margin-top:2px}
.rc-pricerow{display:flex;align-items:baseline;gap:5px;margin-top:7px;flex-wrap:wrap}
.rc-price{font-family:var(--mono);font-size:16px;font-weight:800;
          letter-spacing:-.5px}
.rc-ref{font-size:10.5px;color:var(--faint);text-decoration:line-through}
.rc-save{font-size:10.5px;font-weight:800;color:var(--win);margin-top:3px;display:block}
.rc-bdg{margin-top:6px;display:block}

/* ═══ 목록 행 ═══════════════════════════════════════════ */
.ranks{margin:0 14px;background:var(--paper);border:1px solid var(--rule);
       border-radius:16px;overflow:hidden;box-shadow:var(--sh-xs)}
.rw-wrap{position:relative;border-bottom:1px solid var(--line)}
.rw-wrap:last-child{border-bottom:none}
.rw{display:flex;align-items:center;gap:12px;padding:15px 14px;width:100%}
.rw-no{width:24px;height:24px;border-radius:99px;flex:0 0 auto;display:grid;place-items:center;
       font-family:var(--mono);font-size:11px;font-weight:800;background:var(--wash);color:var(--dim)}
.rw-no.m1{background:var(--gold);color:#fff}
.rw-no.m2{background:var(--silver);color:#fff}
.rw-no.m3{background:var(--bronze);color:#fff}
.rw-img{width:54px;height:54px;border-radius:15px;background:var(--wash);flex:0 0 auto;
        display:grid;place-items:center;font-size:23px;overflow:hidden;
        border:1px solid #fff;box-shadow:var(--sh-xs)}
.rw-img img{width:100%;height:100%;object-fit:contain;padding:4px}
.rw-tx{flex:1;min-width:0;padding-right:4px}
.rw-name{font-size:13.5px;font-weight:700;line-height:1.35;
         display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rw-sub{font-size:10.5px;color:var(--faint);margin-top:3px;display:flex;align-items:center;gap:7px}
.rw-like{color:var(--gold-dk);font-weight:700}
.rw-rt{text-align:right;flex:0 0 auto;padding-right:26px}
.rw-price{font-family:var(--mono);font-size:16.5px;font-weight:800;letter-spacing:-.5px;display:block}
.rw-bdg{margin-top:5px;display:block}
.rw-fav{position:absolute;right:8px;top:50%;transform:translateY(-50%);
        width:30px;height:30px;display:grid;place-items:center;font-size:15px;
        opacity:.32;border-radius:8px}
.rw-fav[aria-pressed="true"]{opacity:1}
.rw-why{font-size:11px;color:var(--lose);margin-top:4px;font-weight:600}

/* ═══ 상세 ═══════════════════════════════════════════════ */
.dv{padding:16px 14px}
.d-hd{display:flex;gap:16px;align-items:flex-start}
.d-img{width:132px;height:150px;border-radius:16px;background:var(--wash);flex:0 0 auto;
       display:grid;place-items:center;font-size:52px;overflow:hidden;
       border:1px solid var(--line);box-shadow:var(--sh-sm)}
.d-img img{width:100%;height:100%;object-fit:contain;padding:9px}
.d-info{flex:1;min-width:0;padding-top:2px}
.d-name{font-size:19px;font-weight:800;letter-spacing:-.5px;line-height:1.3;margin-top:8px}
.d-vol{font-size:13px;color:var(--faint);margin-top:3px}
.d-like-line{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:12px;font-weight:700}
.d-like-line .n{color:var(--gold-dk)}
.d-verdict{margin-top:12px;border-radius:13px;padding:13px 14px;text-align:center;
           background:var(--win-bg);border:1px solid var(--win-line)}
.d-verdict.bad{background:var(--lose-bg);border-color:var(--lose-line)}
.d-verdict.mid{background:var(--same-bg);border-color:var(--same-line)}
.d-verdict .big{font-family:var(--mono);font-size:24px;font-weight:800;
                color:var(--win);letter-spacing:-.9px;display:block}
.d-verdict.bad .big{color:var(--lose)} .d-verdict.mid .big{color:var(--same)}
.d-verdict .big s{font-family:var(--sans);font-size:13px;font-weight:700;
                  text-decoration:none;margin-left:3px}
.d-verdict .sm{font-size:12px;font-weight:700;color:var(--win);margin-top:3px;display:block}
.d-verdict.bad .sm{color:var(--lose)} .d-verdict.mid .sm{color:var(--same)}

.card{background:var(--paper);border:1px solid var(--rule);border-radius:16px;
      margin-top:12px;box-shadow:var(--sh-xs)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
    padding:16px 14px;border-bottom:1px solid var(--line)}
.vs-c .k{font-size:11px;color:var(--dim);font-weight:600;display:block}
.vs-c .p{font-family:var(--mono);font-size:20px;font-weight:800;margin-top:3px;
         letter-spacing:-.7px;display:block}
.vs-c .u{font-size:10.5px;color:var(--faint);margin-top:2px;display:block}
.vs-c.rt{text-align:right}
.vs-c.rt .p{color:var(--dim)}
.vs-mid{width:36px;height:36px;border-radius:99px;background:var(--wash);display:grid;
        place-items:center;font-size:11px;font-weight:800;color:var(--dim)}
.dr{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);gap:12px}
.dr:last-child{border-bottom:none}
.dr .k{font-size:12.5px;color:var(--dim);font-weight:600}
.dr .v{margin-left:auto;font-size:13.5px;font-weight:800;text-align:right}
.dr .v.win{color:var(--win)} .dr .v.lose{color:var(--lose)}
.dr .v small{display:block;font-size:10.5px;color:var(--faint);font-weight:600;margin-top:1px}

.d-note{margin-top:12px;background:var(--win-bg);border:1px solid var(--win-line);
        border-radius:16px;padding:14px 16px;display:flex;gap:11px;align-items:flex-start}
.d-note.bad{background:var(--lose-bg);border-color:var(--lose-line)}
.d-note .ic{width:24px;height:24px;border-radius:99px;background:var(--win);color:#fff;
            display:grid;place-items:center;font-size:13px;flex:0 0 auto;margin-top:1px}
.d-note.bad .ic{background:var(--lose)}
.d-note h3{font-size:13.5px;font-weight:800;color:var(--win)}
.d-note.bad h3{color:var(--lose)}
.d-note ul{margin-top:6px;list-style:none}
.d-note li{font-size:12.5px;color:var(--dim);line-height:1.6;padding-left:11px;position:relative}
.d-note li::before{content:"·";position:absolute;left:2px;font-weight:800}

/* 그래프 */
.d-chart{background:var(--paper);border:1px solid var(--rule);border-radius:16px;
         padding:16px;margin-top:12px;box-shadow:var(--sh-xs)}
.d-chart .hd{display:flex;align-items:center;gap:8px}
.d-chart h3{font-size:13.5px;font-weight:800}
.d-chart .leg{margin-left:auto;display:flex;gap:12px;font-size:10.5px;font-weight:700}
.d-chart .leg i{display:inline-block;width:14px;height:0;border-top-width:2.5px;
                border-top-style:solid;vertical-align:middle;margin-right:5px}
.lg-r{color:var(--faint)} .lg-r i{border-color:#B9B1A0;border-top-style:dashed}
.lg-m{color:var(--deep)} .lg-m i{border-color:var(--deep)}
.d-chart svg{width:100%;height:auto;margin-top:10px;display:block}
.d-chart .empty{font-size:12.5px;color:var(--faint);text-align:center;padding:26px 6px 10px;line-height:1.65}
.d-chart .xr{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);
             font-family:var(--mono);margin-top:4px;padding:0 2px}

.d-like{margin-top:12px;background:var(--paper);border:1px solid var(--rule);
        border-radius:16px;padding:15px 16px;display:flex;align-items:center;
        gap:13px;box-shadow:var(--sh-xs)}
.d-like .n{font-family:var(--mono);font-size:23px;font-weight:800;color:var(--gold-dk);letter-spacing:-.6px}
.d-like .tx{flex:1;min-width:0}
.d-like .t1{font-size:13px;font-weight:700;display:block}
.d-like .t2{font-size:11px;color:var(--faint);margin-top:2px;display:block}
.d-like .btn{flex:0 0 auto;background:var(--gold);color:#fff;font-size:12.5px;font-weight:800;
             padding:10px 16px;border-radius:99px;white-space:nowrap}
.d-like .btn[disabled]{background:var(--sand-dp);color:var(--gold-dk);cursor:default}

/* ═══ 검색 · 분류 ═══════════════════════════════════════ */
.bar{position:sticky;top:0;z-index:30;background:var(--wash);padding:12px 14px 0}
.bar.stuck{box-shadow:0 2px 10px rgba(30,35,27,.06)}
.sw{position:relative}
.search{width:100%;padding:12px 14px 12px 41px;border:1px solid var(--rule);border-radius:12px;
        font-size:14.5px;background:var(--paper);color:var(--ink);box-shadow:var(--sh-xs)}
.search::placeholder{color:var(--faint)}
.search:focus{outline:none;border-color:var(--olive)}
.sw svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.38;pointer-events:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:11px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 16px;border-radius:99px;border:1px solid var(--rule);
      background:var(--paper);font-size:13px;font-weight:700;color:var(--dim);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}
.sortbar{display:flex;gap:6px;padding:0 14px 2px}
.sortbar button{font-size:12px;font-weight:700;color:var(--dim);padding:6px 12px;
                border-radius:99px;border:1px solid var(--rule);background:var(--paper)}
.sortbar button[aria-pressed="true"]{background:var(--wash);border-color:var(--olive);color:var(--olive)}

/* ═══ 후원 ═══════════════════════════════════════════════ */
.spon{margin:20px 14px 0;background:var(--sand);border:1px solid var(--sand-dp);
      border-radius:14px;padding:11px 13px;display:flex;align-items:center;gap:11px;box-shadow:var(--sh-xs)}
.spon .hi{width:32px;height:32px;border-radius:99px;background:var(--gold);color:#fff;
          display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.spon .tx{flex:1;min-width:0}
.spon .t1{font-size:12.5px;font-weight:700;display:block;color:var(--deep)}
.spon .t2{font-size:11px;color:var(--gold-dk);margin-top:2px;display:block;line-height:1.45}
.spon .go{flex:0 0 auto;background:var(--deep);color:#fff;font-size:12px;font-weight:800;
          padding:9px 14px;border-radius:99px;white-space:nowrap}
.spon .go[disabled]{background:var(--sand-dp);color:var(--gold-dk);cursor:default}
.pledge{margin:11px 14px 0;background:var(--deep);border-radius:18px;padding:18px;color:#fff}
.pledge .stamp{display:inline-block;font-size:10.5px;font-weight:800;color:var(--gold);
               border:1px solid var(--gold-dk);border-radius:6px;padding:4px 9px;margin-bottom:10px}
.pledge h3{font-size:14.5px;font-weight:800;letter-spacing:-.3px}
.pledge p{font-size:12.5px;color:#B9BCA9;line-height:1.6;margin-top:6px}

/* ═══ 그 밖 ═════════════════════════════════════════════ */
.blank{padding:56px 26px;text-align:center;color:var(--dim);font-size:13.5px;line-height:1.7}
.blank b{display:block;color:var(--ink);font-size:16.5px;font-weight:800;margin-bottom:7px}
.retry{margin-top:16px;padding:10px 20px;border:1px solid var(--rule);border-radius:9px;
       background:var(--paper);font-size:13px;font-weight:700;color:var(--olive)}
.skel{height:82px;border-radius:16px;margin:0 14px 10px;
      background:linear-gradient(100deg,#EEEAE0 30%,#F8F5EE 45%,#EEEAE0 60%);
      background-size:300% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{from{background-position:200% 0}to{background-position:-100% 0}}
.pending{margin:16px 14px 0;padding:13px 15px;border-radius:13px;background:var(--paper);
         border:1px dashed var(--rule);font-size:12px;color:var(--faint);text-align:center}
.install{display:flex;align-items:center;gap:10px;background:var(--sand);border:1px solid var(--sand-dp);
         border-radius:14px;padding:13px;margin:14px 14px 0;font-size:12.5px;
         font-weight:600;color:var(--deep);box-shadow:var(--sh-xs)}
.install span{flex:1;line-height:1.4}
#insGo{background:var(--deep);color:#fff;padding:9px 15px;font-size:12.5px;border-radius:9px;
       font-weight:700;flex:0 0 auto}
#insX{color:var(--gold-dk);font-size:15px;padding:2px 4px;flex:0 0 auto}
.panel{padding:16px 14px 24px;display:flex;flex-direction:column;gap:12px}
.block{background:var(--paper);border:1px solid var(--rule);border-radius:18px;
       padding:18px;box-shadow:var(--sh-xs)}
.block h2{font-size:14.5px;font-weight:800;margin-bottom:9px;letter-spacing:-.3px}
.block p{font-size:13px;color:var(--dim);line-height:1.65}
.block p + p{margin-top:8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:none;padding-top:2px}
.row .k{font-size:13px;font-weight:600}
.row .v{margin-left:auto;font-size:13px;color:var(--dim)}
.seg{display:flex;gap:5px;margin-left:auto}
.seg button{padding:6px 13px;border-radius:8px;border:1px solid var(--rule);
            background:var(--paper);font-size:12.5px;font-weight:700;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:#fff}
.end{height:14px}

/* ═══ 하단 탭 : 홈 · 인기 · 이벤트 · 신규 · 마이 ═══════ */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;
      grid-template-columns:repeat(5,1fr);background:var(--paper);
      border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom);
      box-shadow:0 -2px 10px rgba(30,35,27,.05)}
.tab{padding:10px 0 11px;display:flex;flex-direction:column;align-items:center;gap:3px;
     font-size:10.5px;font-weight:700;color:var(--faint);text-align:center;position:relative}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;
         stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--olive)}
.tab .dot{position:absolute;top:6px;right:calc(50% - 20px);min-width:17px;height:17px;
          padding:0 5px;border-radius:99px;background:var(--olive);color:#fff;
          font-size:9.5px;font-weight:800;display:grid;place-items:center}

@media (min-width:620px){
  .hero,.sec,.ranks,.mb,.rail,.panel,.pledge,.spon,.bar,.install,.pending,.dv,.sortbar{
    max-width:580px;margin-left:auto;margin-right:auto}
  .mb{width:calc(580px - 28px)}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<header class="hero" id="hero">
  <button class="hbtn l" id="hLeft" aria-label="뒤로" hidden>
    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <div class="hero-tx">
    <span class="brand" id="hBrand">딜군</span>
    <h1 id="hTitle">오늘 사면 좋은 것</h1>
    <p id="hSub"></p>
  </div>
  <button class="hbtn r2" id="hFav" aria-label="저장">
    <svg viewBox="0 0 24 24"><path d="M12 20.5S4 15.6 4 10.2A4.2 4.2 0 0112 7.6a4.2 4.2 0 018 2.6c0 5.4-8 10.3-8 10.3z"/></svg>
  </button>
  <button class="hbtn r" id="hRight" aria-label="검색">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
  </button>
</header>

<div class="bar" id="bar" hidden>
  <div class="sw">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
    </svg>
    <input class="search" id="q" placeholder="상품명 검색" autocomplete="off">
  </div>
  <div class="chips" id="chips"></div>
</div>

<main id="stage">
  <div style="height:18px"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>
</main>

<nav class="tabs" id="tabs" role="tablist">
  <button class="tab" role="tab" data-t="home" aria-selected="true">
    <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>홈
  </button>
  <button class="tab" role="tab" data-t="hot" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M12 3s5 4.2 5 8.6a5 5 0 01-10 0C7 8.4 12 3 12 3z"/><path d="M12 21a4 4 0 004-4c0-2-4-5-4-5s-4 3-4 5a4 4 0 004 4z"/></svg>인기
  </button>
  <button class="tab" role="tab" data-t="event" aria-selected="false">
    <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M3 12h18M12 8v13"/><path d="M12 8S9.5 3.5 7.5 5.2 9.6 8 12 8zM12 8s2.5-4.5 4.5-2.8S14.4 8 12 8z"/></svg>이벤트
  </button>
  <button class="tab" role="tab" data-t="new" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg>신규
  </button>
  <button class="tab" role="tab" data-t="my" aria-selected="false">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20.5a7.5 7.5 0 0115 0"/></svg>마이
  </button>
</nav>

<script type="module">
const CFG = window.DILGUN || {};
const sb = (CFG.SUPABASE_URL && !CFG.SUPABASE_URL.includes("YOUR-PROJECT"))
  ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY) : null;

const $ = id => document.getElementById(id);
const won = n => (n ?? 0).toLocaleString("ko-KR");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TODAY = new Date().toISOString().slice(0, 10);
const days = d => d ? Math.floor((new Date(TODAY) - new Date(d)) / 864e5) : 999;
const CHEV = `<svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>`;

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};
let SAVED = new Set(store.get("dilgun.saved", []));
let LIKED = new Set(store.get("dilgun.liked", []));
let THRESH = store.get("dilgun.thresh", 5);
let ITEMS = [], TAB = "home", DETAIL = null, SEARCH = false;
let cat = "전체", term = "", sort = "pct";

/* ═══ 판정 ═══════════════════════════════════════════════ */
function judge(it){
  const q = Number(it.q), rq = Number(it.rq);
  const mart = it.mart == null ? null : Number(it.mart);
  const ref  = it.ref  == null ? null : Number(it.ref);
  const unit = q > 0 && rq > 0 && it.u && it.ru && it.u === it.ru;
  const a = unit ? mart / q : mart, b = unit ? ref / rq : ref;
  if(a == null || b == null || !b) return { v:"unknown", basis:null, pct:null };
  const pct = ((a - b) / b) * 100;
  const v = pct <= -20 ? "win2" : pct <= -THRESH ? "win" : pct >= THRESH ? "lose" : "same";
  return { v, pct, a, b, basis: unit ? "unit" : "total" };
}
const LABEL = { win2:"확실히 이득", win:"거의 이득", same:"비슷", lose:"비추천", unknown:"판정 대기" };
const TONE  = { win2:"win", win:"win", same:"same", lose:"lose", unknown:"wait" };
const fmtU  = n => n >= 100 ? won(Math.round(n)) : n >= 10 ? n.toFixed(1) : n.toFixed(2);
const isNew   = it => it.added ? days(it.added) <= 30 : false;
const onPromo = it => !!(it.promo_ends && days(it.promo_ends) <= 0);
const vol = it => (it.q && it.u) ? `${it.q}${it.u}` : (it.cat || "");
const pic = (it, cls) => `<span class="${cls}">${it.img
  ? `<img src="${esc(it.img)}" alt="" loading="lazy" onerror="this.remove()">`
  : (it.emoji || "📦")}</span>`;
/* 테두리 배지 */
const bdg = j => j.v === "unknown"
  ? `<span class="bdg wait">판정 대기</span>`
  : Math.abs(j.pct) < 0.5
    ? `<span class="bdg same">시중가와 같음</span>`
    : `<span class="bdg ${TONE[j.v]}">${Math.abs(j.pct).toFixed(0)}% ${j.pct < 0 ? "저렴" : "비쌈"}</span>`;
/* 같은 양으로 맞춘 차액 */
function diffOf(it, j){
  const unit = j.basis === "unit";
  const refAt = unit ? j.b * Number(it.q) : Number(it.ref);
  return { amt: Math.round(Math.abs(Number(it.mart) - refAt)), scaled: unit && Number(it.q) !== Number(it.rq) };
}
/* 비추천 사유 한 줄 */
function whyBad(it, j){
  const bits = [];
  if(j.v === "lose") bits.push(`시중가보다 ${Math.abs(j.pct).toFixed(0)}% 비쌈`);
  else if(j.v === "same") bits.push(`시중가와 거의 같음`);
  if(j.basis !== "unit") bits.push("용량 미확인");
  if(it.ref_date && days(it.ref_date) > 30) bits.push(`시중가 ${days(it.ref_date)}일 전 확인`);
  return bits.join(" · ");
}

/* ═══ 불러오기 ═══════════════════════════════════════════ */
async function load(){
  if(!sb){
    $("stage").innerHTML = `<div class="blank"><b>설정이 아직 끝나지 않았습니다</b>
      config.js 파일에 Supabase 주소와 키를 넣어주세요.</div>`;
    return;
  }
  try{
    const { data, error } = await sb.from("products").select("*").eq("hidden", false).order("name");
    if(error) throw error;
    ITEMS = data || [];
    buildChips(); badges(); render();
  }catch(e){
    $("stage").innerHTML = `<div class="blank"><b>목록을 불러오지 못했습니다</b>
      ${esc(e.message || e)}<br>연결 상태를 확인해 주세요.
      <br><button class="retry" onclick="location.reload()">다시 시도</button></div>`;
  }
}
function buildChips(){
  const cats = ["전체", ...new Set(ITEMS.map(i => i.cat).filter(Boolean))];
  $("chips").innerHTML = cats.map(c =>
    `<button class="chip" data-c="${esc(c)}" aria-pressed="${c === cat}">${esc(c)}</button>`).join("");
  $("chips").querySelectorAll("[data-c]").forEach(b =>
    b.onclick = () => { cat = b.dataset.c; render(); });
}
function badges(){
  [["new", ITEMS.filter(isNew).length], ["event", ITEMS.filter(onPromo).length]]
    .forEach(([t, c]) => {
      const btn = $("tabs").querySelector(`[data-t="${t}"]`);
      btn.querySelector(".dot")?.remove();
      if(c) btn.insertAdjacentHTML("beforeend", `<span class="dot">${c > 99 ? "99+" : c}</span>`);
    });
}

/* ═══ 조각 ═══════════════════════════════════════════════ */
function railCard(s, tag, rank){
  const known = s.j.v !== "unknown";
  const d = known ? diffOf(s.it, s.j) : null;
  const cheap = known && s.j.pct < 0;
  const medal = rank === 1 ? "m1" : rank === 2 ? "m2" : rank === 3 ? "m3" : "";
  return `<button class="rc" data-id="${esc(s.it.id)}">
    ${rank ? `<span class="rc-rank ${medal}">${rank}</span>` : ""}
    ${tag ? `<span class="rc-tag ${tag.k}">${tag.t}</span>` : ""}
    ${pic(s.it, "rc-img")}
    <span class="rc-name">${esc(s.it.name)}</span>
    <span class="rc-vol">${esc(vol(s.it))}</span>
    <span class="rc-pricerow">
      <span class="rc-price num">${won(s.it.mart)}원</span>
      ${known ? `<span class="rc-ref num">${won(s.it.ref)}원</span>` : ""}</span>
    ${known && cheap ? `<span class="rc-save num">${d.scaled ? "같은 양이면 " : ""}${won(d.amt)}원 절약</span>` : ""}
    <span class="rc-bdg">${bdg(s.j)}</span></button>`;
}
function listRow(s, i, showWhy){
  const likes = Number(s.it.likes) || 0;
  const medal = i === 0 ? "m1" : i === 1 ? "m2" : i === 2 ? "m3" : "";
  const fav = SAVED.has(s.it.id);
  return `<div class="rw-wrap">
    <button class="rw" data-id="${esc(s.it.id)}">
      ${i != null ? `<span class="rw-no ${medal}">${i + 1}</span>` : ""}
      ${pic(s.it, "rw-img")}
      <span class="rw-tx"><span class="rw-name">${esc(s.it.name)}</span>
        <span class="rw-sub">${esc(vol(s.it))}
          ${likes ? `<span class="rw-like">👍 ${won(likes)}</span>` : ""}</span>
        ${showWhy ? `<span class="rw-why">${esc(whyBad(s.it, s.j))}</span>` : ""}</span>
      <span class="rw-rt"><span class="rw-price num">${won(s.it.mart)}원</span>
        <span class="rw-bdg">${bdg(s.j)}</span></span>
    </button>
    <button class="rw-fav" data-fav="${esc(s.it.id)}" aria-pressed="${fav}"
            aria-label="저장">${fav ? "❤️" : "🤍"}</button>
  </div>`;
}
function bindRows(){
  $("stage").querySelectorAll("[data-id]").forEach(b => b.onclick = () => openDetail(b.dataset.id));
  $("stage").querySelectorAll("[data-go]").forEach(b => b.onclick = () => switchTab(b.dataset.go));
  /* 분류 더보기 : 인기 탭을 그 분류로 걸러서 엽니다 */
  $("stage").querySelectorAll("[data-cat]").forEach(b => b.onclick = () => {
    DETAIL = null; SEARCH = false; TAB = "hot"; cat = b.dataset.cat;
    term = ""; $("q").value = "";
    window.scrollTo({ top:0 }); render();
  });
  $("stage").querySelectorAll("[data-fav]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const id = b.dataset.fav;
    if(SAVED.has(id)) SAVED.delete(id); else SAVED.add(id);
    store.set("dilgun.saved", [...SAVED]);
    b.setAttribute("aria-pressed", SAVED.has(id));
    b.textContent = SAVED.has(id) ? "❤️" : "🤍";
    if(TAB === "my") render();
  });
}
const sponsor = () => `<div class="spon">
    <span class="hi">♥</span>
    <span class="tx"><span class="t1">도움이 되셨다면 응원해주세요</span></span>
    <button class="go" data-go="my">응원하기</button></div>`;

/* 정렬 */
function sortScored(arr){
  if(sort === "save") return arr.sort((x, y) => diffOf(y.it, y.j).amt - diffOf(x.it, x.j).amt);
  if(sort === "like") return arr.sort((x, y) => (Number(y.it.likes) || 0) - (Number(x.it.likes) || 0));
  return arr.sort((x, y) => x.j.pct - y.j.pct);
}
const sortBar = () => `<div class="sortbar">
    ${[["pct","할인율순"],["save","절약액순"],["like","추천순"]].map(([k, t]) =>
      `<button data-sort="${k}" aria-pressed="${sort === k}">${t}</button>`).join("")}</div>`;
function bindSort(){
  $("stage").querySelectorAll("[data-sort]").forEach(b =>
    b.onclick = () => { sort = b.dataset.sort; render(); });
}

/* ═══ 홈 : 큐레이션만 ═══════════════════════════════════ */
function home(){
  const scored = ITEMS.map(it => ({ it, j: judge(it) }));
  const known = scored.filter(s => s.j.v !== "unknown");
  known.sort((x, y) => x.j.pct - y.j.pct);
  const wins = known.filter(s => s.j.pct < 0);
  const promo = known.filter(s => onPromo(s.it));
  const fresh = known.filter(s => isNew(s.it));

  if(!known.length){
    $("stage").innerHTML = `<div class="blank"><b>아직 비교할 상품이 없습니다</b>
      관리자 화면에서 시중가를 넣으면 여기에 나타납니다.</div>` + sponsor();
    bindRows(); return;
  }

  let h = "";
  const top = wins[0];
  if(top){
    const d = diffOf(top.it, top.j);
    const likes = Number(top.it.likes) || 0;
    h += `<div class="sec"><span class="em">🔥</span><h2>오늘의 MUST BUY</h2>
        <button class="more" data-go="hot">더보기 ${CHEV}</button></div>
      <button class="mb" data-id="${esc(top.it.id)}">
        ${pic(top.it, "mb-img")}
        <span class="mb-tx">
          <span class="mb-name">${esc(top.it.name)}</span>
          <span class="mb-vol">${esc(vol(top.it))}</span>
          <span class="mb-mid"><span class="bdg must">MUST BUY</span>
            ${likes ? `<span class="mb-like">👍 ${won(likes)}</span>` : ""}</span>
          <span class="mb-bot">
            <span><span class="mb-price num">${won(top.it.mart)}원</span>
              <span class="mb-ref">시중가 ${won(top.it.ref)}원</span></span>
            <span style="margin-left:auto">${bdg(top.j)}</span></span>
          <span class="mb-ref" style="text-decoration:none;color:var(--win);font-weight:800;margin-top:6px">
            ${d.scaled ? "같은 양이면 " : ""}${won(d.amt)}원 절약</span>
        </span></button>`;
  }
  if(promo.length){
    h += `<div class="sec"><span class="em">🎉</span><h2>이벤트 상품</h2>
        <button class="more" data-go="event">더보기 ${CHEV}</button></div>
      <div class="rail">${promo.slice(0, 12).map(s => railCard(s, { k:"promo", t:"행사중" })).join("")}</div>`;
  }
  if(fresh.length){
    h += `<div class="sec"><span class="nb">NEW</span><h2>신규 상품</h2>
        <button class="more" data-go="new">더보기 ${CHEV}</button></div>
      <div class="rail">${fresh.slice(0, 12).map(s => railCard(s, { k:"new", t:"NEW" })).join("")}</div>`;
  }
  /* 인기 TOP — 가로로 훑고, 전체는 인기 탭에서 */
  if(wins.length > 1){
    h += `<div class="sec"><span class="em">👑</span><h2>인기 상품 TOP ${Math.min(wins.length, 10)}</h2>
        <button class="more" data-go="hot">더보기 ${CHEV}</button></div>
      <div class="rail">${wins.slice(0, 10).map((s, i) => railCard(s, null, i + 1)).join("")}</div>`;
  }
  /* 분류별 이득 줄 — 어떤 분류가 뜨는지는 데이터가 정합니다.
     상품이 늘면 저절로 바뀌고, 3개 미만인 분류는 표본이 얕아 건너뜁니다. */
  const CAT_EMOJI = {
    화장품:"💄", 식품:"🍜", 음료:"🥤", 생활용품:"🧴", 건강:"💊",
    의류:"👕", 전자:"🔌", 유아동:"🧸", 반려동물:"🐾", 기타:"📦",
  };
  const groups = {};
  wins.forEach(s => { const c = s.it.cat || "기타"; (groups[c] = groups[c] || []).push(s); });
  const catRails = Object.entries(groups)
    .filter(([, arr]) => arr.length >= 3)
    .map(([c, arr]) => ({
      cat: c, arr,
      avg: arr.reduce((sum, s) => sum + Math.abs(s.j.pct), 0) / arr.length,
    }))
    .sort((a, b) => b.avg - a.avg)
    .slice(0, 3);

  catRails.forEach(g => {
    h += `<div class="sec"><span class="em">${CAT_EMOJI[g.cat] || "📦"}</span>
        <h2>${esc(g.cat)}은 여기가 싸요</h2>
        <button class="more" data-cat="${esc(g.cat)}">더보기 ${CHEV}</button></div>
      <div class="rail">${g.arr.slice(0, 12).map(s => railCard(s, null)).join("")}</div>`;
  });

  h += sponsor() + `<div class="end"></div>`;
  $("stage").innerHTML = h;
  bindRows();
}

/* ═══ 인기 : 순위 + 비추천 ═════════════════════════════ */
function hot(){
  let scored = ITEMS
    .filter(it => cat === "전체" || it.cat === cat)
    .filter(it => !term || it.name.toLowerCase().includes(term))
    .map(it => ({ it, j: judge(it) }))
    .filter(s => s.j.v !== "unknown");
  const bad = scored.filter(s => s.j.v === "lose" || s.j.v === "same")
                    .sort((x, y) => y.j.pct - x.j.pct);
  const wins = sortScored(scored.filter(s => s.j.pct < 0));
  const pend = ITEMS.filter(it => judge(it).v === "unknown").length;

  if(!scored.length){
    $("stage").innerHTML = `<div class="blank"><b>비교할 상품이 없습니다</b>다른 분류로 살펴보세요.</div>`;
    return;
  }
  let h = sortBar() +
    `<div class="sec"><span class="em">👑</span><h2>인기 상품 TOP ${Math.min(wins.length, 20)}</h2>
      <span class="more">${won(wins.length)}개</span></div>

/* ═══ 가격 변동 그래프 ═══════════════════════════════════ */
function niceTicks(lo, hi, n = 5){
  const range = (hi - lo) || hi || 1;
  const raw = range / (n - 1);
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
  const min = Math.floor(lo / step) * step, max = Math.ceil(hi / step) * step;
  const out = [];
  for(let v = min; v <= max + step * 1e-6; v += step) out.push(Math.round(v));
  return { min, max, ticks: out };
}
function chart(it){
  let hist = [];
  try{ hist = Array.isArray(it.hist) ? it.hist : JSON.parse(it.hist || "[]"); }catch{}
  hist = hist.filter(p => p && p.d && p.m != null);

  const head = `<div class="hd"><h3>📈 가격 변동</h3>
    <span class="leg"><span class="lg-r"><i></i>시중 최저가</span>
      <span class="lg-m"><i></i>PX 가격</span></span></div>`;

  if(hist.length < 2){
    return `<div class="d-chart">${head}
      <div class="empty">아직 기록이 한 번뿐입니다.<br>
        시중가를 다시 확인할 때마다 여기에 선이 그려집니다.</div></div>`;
  }

  const W = 320, H = 158, L = 46, R = 10, T = 12, B = 14;
  const ms = hist.map(p => Number(p.m));
  const rs = hist.map(p => p.r == null ? null : Number(p.r));
  const all = [...ms, ...rs.filter(v => v != null)];
  const sc = niceTicks(Math.min(...all), Math.max(...all));
  const span = (sc.max - sc.min) || 1;
  const X = i => L + i * (W - L - R) / (hist.length - 1);
  const Y = v => T + (1 - (v - sc.min) / span) * (H - T - B);
  const pts = a => a.map((v, i) => v == null ? null : `${X(i).toFixed(1)},${Y(v).toFixed(1)}`)
                    .filter(Boolean).join(" ");

  const grid = sc.ticks.map(v => `
    <line x1="${L}" y1="${Y(v).toFixed(1)}" x2="${W - R}" y2="${Y(v).toFixed(1)}"
          stroke="#EEE9DE" stroke-width="1"/>
    <text x="${L - 7}" y="${(Y(v) + 3.5).toFixed(1)}" text-anchor="end"
          font-size="9.5" fill="#8E9082">${won(v)}</text>`).join("");

  const first = ms[0], lastv = ms[ms.length - 1];
  const dir = lastv === first ? "그대로" : lastv < first ? "내림" : "오름";
  const dp = first ? Math.abs((lastv - first) / first * 100).toFixed(0) : "0";

  return `<div class="d-chart">${head}
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="가격 변동 그래프">
      <defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2E3B28" stop-opacity=".14"/>
        <stop offset="100%" stop-color="#2E3B28" stop-opacity="0"/></linearGradient></defs>
      ${grid}
      <polygon points="${L},${H - B} ${pts(ms)} ${W - R},${H - B}" fill="url(#gA)"/>
      ${rs.some(v => v != null) ? `<polyline points="${pts(rs)}" fill="none" stroke="#B9B1A0"
        stroke-width="2.2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/>` : ""}
      <polyline points="${pts(ms)}" fill="none" stroke="#2E3B28" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
      ${ms.map((v, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}"
        r="${i === ms.length - 1 ? 4.2 : 2.8}" fill="${i === ms.length - 1 ? "#D2A55C" : "#2E3B28"}"
        stroke="#fff" stroke-width="${i === ms.length - 1 ? 2 : 1.2}"/>`).join("")}
    </svg>
    <div class="xr"><span>${esc(hist[0].d)}</span>
      <span>PX가 ${dp}% ${dir}</span>
      <span>${esc(hist[hist.length - 1].d)}</span></div></div>`;
}

async function like(it){
  if(LIKED.has(it.id) || !sb) return;
  $("dLike").disabled = true;
  const { data, error } = await sb.rpc("bump_like", { pid: String(it.id) });
  if(error){ $("dLike").disabled = false; toast("추천을 저장하지 못했습니다"); return; }
  it.likes = data ?? (Number(it.likes) || 0) + 1;
  LIKED.add(it.id); store.set("dilgun.liked", [...LIKED]);
  render(); toast("추천했습니다");
}

    b.setAttribute("aria-pressed", b.dataset.c === cat));
  $("tabs").querySelectorAll("[data-t]").forEach(b =>
    b.setAttribute("aria-selected", !DETAIL && !SEARCH && b.dataset.t === TAB));

  if(DETAIL) return detail();
  if(SEARCH) return searchView();
  if(TAB === "home")  return home();
  if(TAB === "hot")   return hot();
  if(TAB === "event") return eventTab();
  if(TAB === "new")   return newTab();
  myTab();
}

function switchTab(t){
  DETAIL = null; SEARCH = false; TAB = t; term = ""; cat = "전체"; $("q").value = "";
  window.scrollTo({ top:0 }); render();
}
$("hLeft").onclick = () => {
  if(DETAIL) DETAIL = null; else { SEARCH = false; term = ""; $("q").value = ""; }
  render();
};
$("hRight").onclick = () => { if(SEARCH) return shareUrl(); SEARCH = true; render(); $("q").focus(); };
$("hFav").onclick = () => {
  if(!DETAIL) return switchTab("my");
  if(SAVED.has(DETAIL)) SAVED.delete(DETAIL); else SAVED.add(DETAIL);
  store.set("dilgun.saved", [...SAVED]);
  render();
};
$("q").addEventListener("input", e => { term = e.target.value.trim().toLowerCase(); render(); });
$("tabs").querySelectorAll("[data-t]").forEach(b => b.onclick = () => switchTab(b.dataset.t));
addEventListener("scroll", () => $("bar").classList.toggle("stuck", scrollY > 8), { passive:true });

/* ═══ 공유 ═══════════════════════════════════════════════ */
function toast(m){
  let el = $("toast");
  if(!el){
    el = document.createElement("div"); el.id = "toast";
    el.style.cssText = "position:fixed;left:50%;bottom:-60px;transform:translateX(-50%);"
      + "background:#212A1C;color:#fff;padding:11px 20px;border-radius:99px;font-size:13px;"
      + "font-weight:600;transition:bottom .25s;z-index:60";
    document.body.appendChild(el);
  }
  el.textContent = m;
  requestAnimationFrame(() => el.style.bottom = "22px");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.style.bottom = "-60px", 1800);
}
async function shareUrl(text){
  const url = location.origin + location.pathname;
  const body = text || "PX 가격, 진짜 싼지 확인해보세요";
  if(navigator.share){ try{ await navigator.share({ title:"딜군", text:body, url }); }catch{} }
  else { try{ await navigator.clipboard.writeText(`${body}\n${url}`); toast("링크를 복사했습니다"); }
         catch{ toast(url); } }
}

/* ═══ 홈 화면에 추가 ═══════════════════════════════════ */
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
let deferred = null;
function showInstall(txt, withBtn){
  const d = document.createElement("div");
  d.className = "install"; d.id = "install";
  d.innerHTML = `<span>${txt}</span>${withBtn ? `<button id="insGo">추가하기</button>` : ""}
                 <button id="insX" aria-label="닫기">✕</button>`;
  $("stage").parentElement.insertBefore(d, $("stage"));
  $("insX").onclick = () => { d.remove(); store.set("dilgun.insHide", true); };
  const g = $("insGo");
  if(g) g.onclick = async () => { if(!deferred) return;
    deferred.prompt(); await deferred.userChoice; deferred = null; d.remove(); };
}
if(!standalone && !store.get("dilgun.insHide", false)){
  if(ios) showInstall("공유 버튼을 누르고 “홈 화면에 추가”를 선택하세요", false);
  else addEventListener("beforeinstallprompt", e => {
    e.preventDefault(); deferred = e;
    if(!$("install")) showInstall("홈 화면에 추가하면 앱처럼 바로 열립니다", true);
  });
}
addEventListener("appinstalled", () => $("install")?.remove());
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

load();
</script>
