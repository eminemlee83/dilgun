<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2E3B28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>딜군 — PX에서 사면 좋은 것</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  color-scheme:light;
  --olive:#4E6144; --deep:#2E3B28; --deeper:#212A1C;
  --gold:#D2A55C; --gold-dk:#A67C3A; --gold-lt:#EBCF9B;
  --silver:#AFAFA2; --bronze:#B08050;
  --sand:#EDE1C7; --sand-dp:#E2D2B2; --wash:#F5F2EA; --paper:#fff;
  --rule:#E6E0D3; --track:#EDE8DC;
  --ink:#1E231B; --dim:#6B6F63; --faint:#8E9082; --arrow:#7E8174;
  --win:#2C7A4B; --win-bg:#EAF5EE; --win-line:#BEDECB;
  --same:#8A6A20; --same-bg:#FBF2DC;
  --lose:#B4432A; --lose-bg:#FCEFEA; --lose-line:#EFCCBD;
  --tip:#FDF7E7; --tip-line:#EADCB9;
  --sh-sm:0 1px 3px rgba(30,35,27,.05);
  --sh-md:0 2px 8px rgba(30,35,27,.07);
  --sh-lg:0 4px 16px rgba(30,35,27,.09);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,"Roboto Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --tabh:62px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--wash)}
body{font-family:var(--sans);background:var(--wash);color:var(--ink);font-size:14px;
     line-height:1.5;-webkit-font-smoothing:antialiased;
     padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom))}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;text-align:left}
img{display:block}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.chev{width:16px;height:16px;stroke:var(--arrow);fill:none;stroke-width:2.6;flex:0 0 auto}

/* ═══ 머리 : 여백을 줄이고 캐릭터를 세웁니다 ═══════════ */
.hero{position:relative;background:var(--deep);overflow:hidden;
      padding:calc(env(safe-area-inset-top) + 14px) 18px 30px;color:#fff}
.hero-tx{position:relative;z-index:2;padding-right:96px}
.hero h1{font-size:25px;font-weight:800;letter-spacing:-.9px;line-height:1.15}
.hero p{font-size:13px;color:#B3BCA3;margin-top:4px;font-weight:600}
.hero-mascot{position:absolute;right:8px;bottom:-6px;width:112px;height:118px;
             pointer-events:none;filter:drop-shadow(0 4px 12px rgba(0,0,0,.24))}
.hbtn{position:absolute;top:calc(env(safe-area-inset-top) + 14px);width:34px;height:34px;
      border-radius:11px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.07);
      display:grid;place-items:center;z-index:3}
.hbtn.l{left:14px} .hbtn.r{right:14px}
.hbtn svg{width:17px;height:17px;stroke:#D6D2C3;fill:none;stroke-width:1.9}
.hero.compact{padding:calc(env(safe-area-inset-top) + 14px) 18px 18px}
.hero.compact .hero-tx{padding-right:44px}
.hero.compact h1{font-size:18px;letter-spacing:-.5px}
.hero.compact .hero-mascot{display:none}
.hero.compact + .pull, .hero.compact ~ .bar{margin-top:0}

/* ═══ 안내 카드 ═════════════════════════════════════════ */
.pull{margin-top:-14px;padding:0 14px;position:relative;z-index:4}
.tip{background:var(--tip);border:1px solid var(--tip-line);border-radius:15px;
     padding:13px 15px;display:flex;gap:12px;align-items:center;width:100%;box-shadow:var(--sh-lg)}
.tip .ic{font-size:19px;flex:0 0 auto}
.tip .tx{flex:1;min-width:0}
.tip .t1{font-size:13.5px;font-weight:700;line-height:1.4;display:block}
.tip .t2{font-size:11.5px;color:var(--gold-dk);margin-top:3px;display:block;font-weight:600}
.tip .rt{flex:0 0 auto;text-align:right;padding-left:10px;border-left:1px solid var(--tip-line)}
.tip .rt .k{font-size:10px;color:var(--gold-dk);font-weight:600;display:block}
.tip .rt .v{font-family:var(--mono);font-size:12px;font-weight:800;display:block;margin-top:2px}
.tip .rt .a{font-size:9.5px;color:var(--faint);display:block}

/* ═══ 구역 ═══════════════════════════════════════════════ */
.sec{display:flex;align-items:center;gap:7px;padding:22px 16px 11px}
.sec .em{font-size:15px}
.sec h2{font-size:16.5px;font-weight:800;letter-spacing:-.4px}
.sec .more{margin-left:auto;font-size:12px;font-weight:700;color:var(--dim);
           display:flex;align-items:center;gap:1px}
.sec.alert h2{color:var(--lose)}
.nb{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;
    border-radius:6px;background:var(--win);color:#fff;font-size:10px;font-weight:800}

/* ═══ MUST BUY ═══════════════════════════════════════════ */
.mb{display:block;width:calc(100% - 28px);margin:0 14px;background:var(--win-bg);
    border:1px solid var(--win-line);border-radius:18px;padding:16px;box-shadow:var(--sh-md)}
.mb-top{display:flex;gap:15px;align-items:flex-start}
.mb-img{width:100px;height:100px;border-radius:17px;background:var(--paper);flex:0 0 auto;
        display:grid;place-items:center;font-size:42px;overflow:hidden;
        border:1px solid #fff;box-shadow:var(--sh-sm)}
.mb-img img{width:100%;height:100%;object-fit:cover}
.mb-tx{flex:1;min-width:0}
.mb-badge{display:inline-block;background:var(--win);color:#fff;font-size:10px;font-weight:800;
          padding:3px 8px;border-radius:6px;letter-spacing:.3px}
.mb-name{font-size:16.5px;font-weight:800;letter-spacing:-.4px;line-height:1.3;margin-top:7px;
         display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mb-vol{font-size:11.5px;color:var(--dim);margin-top:3px}
.mb-hl{display:flex;align-items:center;gap:9px;margin-top:12px;flex-wrap:wrap}
.mb-pct{font-family:var(--mono);font-size:29px;font-weight:800;color:var(--win);letter-spacing:-1.2px}
.mb-pct s{font-family:var(--sans);font-size:13px;font-weight:700;text-decoration:none;margin-left:2px}
.mb-ok{background:var(--win);color:#fff;font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:99px}

/* VS 비교 */
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;
    background:var(--paper);border-radius:13px;padding:14px;margin-top:13px;box-shadow:var(--sh-sm)}
.vs-c .k{font-size:10.5px;color:var(--dim);font-weight:600;display:block}
.vs-c .p{font-family:var(--mono);font-size:19px;font-weight:800;margin-top:2px;
         letter-spacing:-.6px;display:block}
.vs-c .u{font-size:10.5px;color:var(--faint);margin-top:1px;display:block}
.vs-c.rt{text-align:right}
.vs-c.rt .p{color:var(--dim)}
.vs-mid{width:34px;height:34px;border-radius:99px;background:var(--wash);display:grid;
        place-items:center;font-size:10.5px;font-weight:800;color:var(--dim)}
.save-line{margin-top:10px;text-align:center;font-size:14px;font-weight:800;color:var(--win)}
.save-line.bad{color:var(--lose)}

/* ═══ 가로 스크롤 ═══════════════════════════════════════ */
.rail{display:flex;gap:10px;overflow-x:auto;padding:0 14px 6px;scrollbar-width:none;
      -webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.mini{flex:0 0 auto;width:140px;background:var(--paper);border:1px solid var(--rule);
      border-radius:15px;padding:10px;position:relative;box-shadow:var(--sh-sm)}
.mini-tag{position:absolute;left:15px;top:15px;font-size:10px;font-weight:800;
          padding:3px 7px;border-radius:6px;color:#fff;z-index:2}
.mini-tag.promo{background:var(--lose)} .mini-tag.new{background:var(--olive)}
.mini-img{width:100%;height:88px;border-radius:14px;background:var(--wash);display:grid;
          place-items:center;font-size:34px;overflow:hidden;margin-bottom:9px;
          border:1px solid #fff;box-shadow:var(--sh-sm)}
.mini-img img{width:100%;height:100%;object-fit:cover}
.mini-name{font-size:12.5px;font-weight:700;line-height:1.35;height:34px;
           display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini-vol{font-size:10.5px;color:var(--faint);margin-top:2px}
.mini-pct{font-size:12px;font-weight:800;color:var(--lose);margin-top:7px}
.mini-pct.up{color:var(--win)}
.mini-price{font-family:var(--mono);font-size:17px;font-weight:800;margin-top:1px;letter-spacing:-.5px}
.mini-ref{font-size:10px;color:var(--faint);text-decoration:line-through;margin-top:1px}

/* ═══ 순위 목록 : 행 높이 여유 ═════════════════════════ */
.ranks{margin:0 14px;background:var(--paper);border:1px solid var(--rule);
       border-radius:16px;overflow:hidden;box-shadow:var(--sh-sm)}
.rrow{display:flex;align-items:center;gap:12px;padding:19px 14px;
      border-bottom:1px solid var(--rule);width:100%}
.rrow:last-child{border-bottom:none}
.rno{width:24px;height:24px;border-radius:99px;flex:0 0 auto;display:grid;place-items:center;
     font-family:var(--mono);font-size:11px;font-weight:800;background:var(--wash);color:var(--dim)}
.rno.m1{background:var(--gold);color:#fff}
.rno.m2{background:var(--silver);color:#fff}
.rno.m3{background:var(--bronze);color:#fff}
.rimg{width:46px;height:46px;border-radius:16px;background:var(--wash);flex:0 0 auto;
      display:grid;place-items:center;font-size:21px;overflow:hidden;
      border:1px solid #fff;box-shadow:var(--sh-sm)}
.rimg img{width:100%;height:100%;object-fit:cover}
.rtx{flex:1;min-width:0}
.rname{font-size:13.5px;font-weight:700;line-height:1.35;
       display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rvol{font-size:10.5px;color:var(--faint);margin-top:2px;display:flex;align-items:center;gap:6px}
.rlike{color:var(--gold-dk);font-weight:700}
.rrt{text-align:right;flex:0 0 auto}
.rpct{font-size:12px;font-weight:800;color:var(--lose);white-space:nowrap;display:block}
.rpct.up{color:var(--win)}
.rprice{font-family:var(--mono);font-size:17px;font-weight:800;white-space:nowrap;
        display:block;margin-top:2px;letter-spacing:-.5px}

/* ═══ 상세 ═══════════════════════════════════════════════ */
.dv{padding:14px}
.d-card{background:var(--paper);border:1px solid var(--rule);border-radius:18px;
        padding:17px;box-shadow:var(--sh-sm)}
.d-top{display:flex;gap:16px;align-items:flex-start}
.d-img{width:108px;height:108px;border-radius:18px;background:var(--wash);flex:0 0 auto;
       display:grid;place-items:center;font-size:46px;overflow:hidden;
       border:1px solid #fff;box-shadow:var(--sh-md)}
.d-img img{width:100%;height:100%;object-fit:cover}
.d-name{font-size:19px;font-weight:800;letter-spacing:-.5px;line-height:1.3;margin-top:7px}
.d-vol{font-size:12.5px;color:var(--dim);margin-top:3px}
.d-hl{margin-top:15px;background:var(--win-bg);border:1px solid var(--win-line);
      border-radius:13px;padding:14px 15px;display:flex;align-items:center;gap:11px}
.d-hl.bad{background:var(--lose-bg);border-color:var(--lose-line)}
.d-hl.mid{background:var(--same-bg);border-color:#EBDCB8}
.d-hl .pct{font-family:var(--mono);font-size:28px;font-weight:800;color:var(--win);letter-spacing:-1.2px}
.d-hl.bad .pct{color:var(--lose)} .d-hl.mid .pct{color:var(--same)}
.d-hl .pct s{font-family:var(--sans);font-size:13px;font-weight:700;text-decoration:none;margin-left:2px}
.d-hl .ok{margin-left:auto;font-size:12px;font-weight:800;color:var(--win);
          background:var(--paper);padding:6px 12px;border-radius:99px;white-space:nowrap}
.d-hl.bad .ok{color:var(--lose)} .d-hl.mid .ok{color:var(--same)}

/* 가격 변동 그래프 */
.d-chart{background:var(--paper);border:1px solid var(--rule);border-radius:18px;
         padding:16px;margin-top:11px;box-shadow:var(--sh-sm)}
.d-chart h3{font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:7px}
.d-chart h3 .leg{margin-left:auto;display:flex;gap:11px;font-size:10.5px;font-weight:700}
.d-chart h3 .leg i{display:inline-block;width:9px;height:3px;border-radius:2px;
                   vertical-align:middle;margin-right:4px}
.d-chart .lg-px{color:var(--deep)} .d-chart .lg-px i{background:var(--deep)}
.d-chart .lg-rf{color:var(--faint)} .d-chart .lg-rf i{background:#C4BCA8}
.d-chart svg{width:100%;height:118px;margin-top:12px;display:block;overflow:visible}
.d-chart .empty{font-size:12.5px;color:var(--faint);text-align:center;padding:22px 4px 8px;line-height:1.6}
.d-chart .foot{display:flex;justify-content:space-between;font-size:10.5px;
               color:var(--faint);margin-top:7px;font-family:var(--mono)}

.d-meta{background:var(--paper);border:1px solid var(--rule);border-radius:18px;
        padding:4px 17px;margin-top:11px;box-shadow:var(--sh-sm)}
.d-row{display:flex;align-items:center;padding:13px 0;border-top:1px solid var(--rule);gap:12px}
.d-row:first-child{border-top:none}
.d-row .k{font-size:12.5px;color:var(--dim);font-weight:600}
.d-row .v{margin-left:auto;font-size:13px;font-weight:700;text-align:right}
.d-row .v small{display:block;font-size:10.5px;color:var(--faint);font-weight:600;margin-top:1px}
.d-why{background:var(--win-bg);border:1px solid var(--win-line);border-radius:18px;
       padding:16px 17px;margin-top:11px}
.d-why.bad{background:var(--lose-bg);border-color:var(--lose-line)}
.d-why h3{font-size:13.5px;font-weight:800;color:var(--win)}
.d-why.bad h3{color:var(--lose)}
.d-why ul{margin-top:9px;list-style:none}
.d-why li{font-size:12.5px;color:var(--dim);line-height:1.65;padding-left:13px;position:relative}
.d-why li::before{content:"·";position:absolute;left:3px;font-weight:800}

/* 추천 */
.d-like{margin-top:11px;background:var(--paper);border:1px solid var(--rule);
        border-radius:18px;padding:15px 17px;display:flex;align-items:center;
        gap:13px;box-shadow:var(--sh-sm)}
.d-like .n{font-family:var(--mono);font-size:23px;font-weight:800;color:var(--gold-dk);letter-spacing:-.6px}
.d-like .tx{flex:1;min-width:0}
.d-like .t1{font-size:13px;font-weight:700;display:block}
.d-like .t2{font-size:11px;color:var(--faint);margin-top:2px;display:block}
.d-like .btn{flex:0 0 auto;background:var(--gold);color:#fff;font-size:12.5px;font-weight:800;
             padding:10px 16px;border-radius:99px;white-space:nowrap}
.d-like .btn[disabled]{background:var(--sand-dp);color:var(--gold-dk);cursor:default}

.d-acts{display:flex;gap:9px;margin-top:13px}
.d-btn{flex:1;padding:15px;border-radius:13px;background:var(--olive);color:#fff;
       font-size:14px;font-weight:800;text-align:center}
.d-btn.ghost{flex:0 0 56px;background:var(--paper);border:1px solid var(--rule);
             color:var(--dim);font-size:17px;display:grid;place-items:center}

/* ═══ 검색 · 분류 ═══════════════════════════════════════ */
.bar{position:sticky;top:0;z-index:30;background:var(--wash);padding:12px 14px 0}
.bar.stuck{box-shadow:0 2px 10px rgba(30,35,27,.07)}
.sw{position:relative}
.search{width:100%;padding:12px 14px 12px 41px;border:1px solid var(--rule);border-radius:12px;
        font-size:14.5px;background:var(--paper);color:var(--ink);box-shadow:var(--sh-sm)}
.search::placeholder{color:var(--faint)}
.search:focus{outline:none;border-color:var(--olive)}
.sw svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.38;pointer-events:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 15px;border-radius:99px;border:1px solid var(--rule);
      background:var(--paper);font-size:13px;font-weight:600;color:var(--dim);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}

/* ═══ 후원 : 베이지 톤 ═════════════════════════════════ */
.spon{margin:22px 14px 0;background:var(--sand);border:1px solid var(--sand-dp);
      border-radius:18px;padding:15px;display:flex;align-items:center;gap:13px;box-shadow:var(--sh-sm)}
.spon .hi{width:42px;height:42px;border-radius:99px;background:var(--gold);color:#fff;
          display:grid;place-items:center;font-size:19px;flex:0 0 auto}
.spon .tx{flex:1;min-width:0}
.spon .t1{font-size:13.5px;font-weight:800;display:block;color:var(--deep)}
.spon .t2{font-size:11.5px;color:var(--gold-dk);margin-top:2px;display:block;line-height:1.45}
.spon .go{flex:0 0 auto;background:var(--deep);color:#fff;font-size:12.5px;font-weight:800;
          padding:11px 16px;border-radius:99px;white-space:nowrap}
.spon .go[disabled]{background:var(--sand-dp);color:var(--gold-dk);cursor:default}
.pledge{margin:11px 14px 0;background:var(--deep);border-radius:18px;padding:18px;color:#fff}
.pledge .stamp{display:inline-block;font-size:10.5px;font-weight:800;color:var(--gold);
               border:1px solid var(--gold-dk);border-radius:6px;padding:4px 9px;margin-bottom:10px}
.pledge h3{font-size:14.5px;font-weight:800;letter-spacing:-.3px}
.pledge p{font-size:12.5px;color:#B9BCA9;line-height:1.6;margin-top:6px}

/* ═══ 그 밖 ═════════════════════════════════════════════ */
.blank{padding:56px 26px;text-align:center;color:var(--dim);font-size:13.5px;line-height:1.7}
.blank b{display:block;color:var(--ink);font-size:16.5px;font-weight:800;margin-bottom:7px}
.retry{margin-top:16px;padding:10px 20px;border:1px solid var(--rule);border-radius:9px;
       background:var(--paper);font-size:13px;font-weight:700;color:var(--olive)}
.skel{height:78px;border-radius:16px;margin:0 14px 10px;
      background:linear-gradient(100deg,#EEEAE0 30%,#F8F5EE 45%,#EEEAE0 60%);
      background-size:300% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{from{background-position:200% 0}to{background-position:-100% 0}}
.pending{margin:16px 14px 0;padding:13px 15px;border-radius:13px;background:var(--paper);
         border:1px dashed var(--rule);font-size:12px;color:var(--faint);text-align:center}
.install{display:flex;align-items:center;gap:10px;background:var(--sand);border:1px solid var(--sand-dp);
         border-radius:14px;padding:13px;margin:14px 14px 0;font-size:12.5px;
         font-weight:600;color:var(--deep);box-shadow:var(--sh-sm)}
.install span{flex:1;line-height:1.4}
#insGo{background:var(--deep);color:#fff;padding:9px 15px;font-size:12.5px;border-radius:9px;
       font-weight:700;flex:0 0 auto}
#insX{color:var(--gold-dk);font-size:15px;padding:2px 4px;flex:0 0 auto}
.panel{padding:16px 14px 24px;display:flex;flex-direction:column;gap:12px}
.block{background:var(--paper);border:1px solid var(--rule);border-radius:18px;
       padding:18px;box-shadow:var(--sh-sm)}
.block h2{font-size:14.5px;font-weight:800;margin-bottom:9px;letter-spacing:-.3px}
.block p{font-size:13px;color:var(--dim);line-height:1.65}
.block p + p{margin-top:8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--rule)}
.row:first-of-type{border-top:none;padding-top:2px}
.row .k{font-size:13px;font-weight:600}
.row .v{margin-left:auto;font-size:13px;color:var(--dim)}
.seg{display:flex;gap:5px;margin-left:auto}
.seg button{padding:6px 13px;border-radius:8px;border:1px solid var(--rule);
            background:var(--paper);font-size:12.5px;font-weight:700;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:#fff}
.end{height:12px}

/* ═══ 하단 탭 ═══════════════════════════════════════════ */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;
      grid-template-columns:repeat(4,1fr);background:var(--paper);
      border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom);
      box-shadow:0 -2px 10px rgba(30,35,27,.05)}
.tab{padding:10px 0 11px;display:flex;flex-direction:column;align-items:center;gap:3px;
     font-size:11px;font-weight:700;color:var(--faint);text-align:center;position:relative}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;
         stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--olive)}
.tab .dot{position:absolute;top:7px;right:calc(50% - 19px);min-width:17px;height:17px;
          padding:0 5px;border-radius:99px;background:var(--olive);color:#fff;
          font-size:9.5px;font-weight:800;display:grid;place-items:center}

@media (min-width:620px){
  .hero,.pull,.sec,.ranks,.mb,.rail,.panel,.pledge,.spon,.bar,.install,.pending,.dv{
    max-width:580px;margin-left:auto;margin-right:auto}
  .mb{width:calc(580px - 28px)}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<header class="hero" id="hero">
  <button class="hbtn l" id="hLeft" aria-label="뒤로" hidden>
    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <div class="hero-tx"><h1 id="hTitle">딜군</h1><p id="hSub">오늘 PX에서 사면 좋은 것</p></div>
  <button class="hbtn r" id="hRight" aria-label="검색">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
  </button>
  <img class="hero-mascot" id="mascot" src="mascot.svg" alt="">
</header>

<div class="bar" id="bar" hidden>
  <div class="sw">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
    </svg>
    <input class="search" id="q" placeholder="상품명 검색" autocomplete="off">
  </div>
  <div class="chips" id="chips"></div>
</div>

<main id="stage">
  <div class="pull"><div class="skel" style="height:62px;margin:0"></div></div>
  <div style="height:20px"></div><div class="skel"></div><div class="skel"></div>
</main>

<nav class="tabs" id="tabs" role="tablist">
  <button class="tab" role="tab" data-t="hot" aria-selected="true">
    <svg viewBox="0 0 24 24"><path d="M12 3s5 4.2 5 8.6a5 5 0 01-10 0C7 8.4 12 3 12 3z"/><path d="M12 21a4 4 0 004-4c0-2-4-5-4-5s-4 3-4 5a4 4 0 004 4z"/></svg>인기
  </button>
  <button class="tab" role="tab" data-t="new" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg>신규
  </button>
  <button class="tab" role="tab" data-t="event" aria-selected="false">
    <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M3 12h18M12 8v13"/><path d="M12 8S9.5 3.5 7.5 5.2 9.6 8 12 8zM12 8s2.5-4.5 4.5-2.8S14.4 8 12 8z"/></svg>이벤트
  </button>
  <button class="tab" role="tab" data-t="my" aria-selected="false">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20.5a7.5 7.5 0 0115 0"/></svg>마이
  </button>
</nav>

<script type="module">
const CFG = window.DILGUN || {};
const sb = (CFG.SUPABASE_URL && !CFG.SUPABASE_URL.includes("YOUR-PROJECT"))
  ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY) : null;

const $ = id => document.getElementById(id);
const won = n => (n ?? 0).toLocaleString("ko-KR");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TODAY = new Date().toISOString().slice(0, 10);
const days = d => d ? Math.floor((new Date(TODAY) - new Date(d)) / 864e5) : 999;
const CHEV = `<svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>`;

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};
let SAVED = new Set(store.get("dilgun.saved", []));
let LIKED = new Set(store.get("dilgun.liked", []));
let THRESH = store.get("dilgun.thresh", 5);
let ITEMS = [], TAB = "hot", DETAIL = null, SEARCH = false, cat = "전체", term = "";

/* ═══ 판정 ═══════════════════════════════════════════════ */
function judge(it){
  const q = Number(it.q), rq = Number(it.rq);
  const mart = it.mart == null ? null : Number(it.mart);
  const ref  = it.ref  == null ? null : Number(it.ref);
  const unit = q > 0 && rq > 0 && it.u && it.ru && it.u === it.ru;
  const a = unit ? mart / q : mart, b = unit ? ref / rq : ref;
  if(a == null || b == null || !b) return { v:"unknown", basis:null };
  const pct = ((a - b) / b) * 100;
  const v = pct <= -20 ? "win2" : pct <= -THRESH ? "win" : pct >= THRESH ? "lose" : "same";
  return { v, pct, a, b, basis: unit ? "unit" : "total" };
}
const LABEL = { win2:"확실히 이득", win:"거의 이득", same:"비슷", lose:"비추천", unknown:"판정 대기" };
const fmtU = n => n >= 100 ? won(Math.round(n)) : n >= 10 ? n.toFixed(1) : n.toFixed(2);
const isNew = it => it.added ? days(it.added) <= 30 : false;
const onPromo = it => !!(it.promo_ends && days(it.promo_ends) <= 0);
const vol = it => (it.q && it.u) ? `${it.q}${it.u}` : (it.cat || "");
const pic = (it, cls) => `<span class="${cls}">${it.img
  ? `<img src="${esc(it.img)}" alt="" loading="lazy" onerror="this.remove()">`
  : (it.emoji || "📦")}</span>`;
/* ▼70% 처럼 방향을 붙여 눈에 띄게 */
const pctTxt = p => `${p < 0 ? "▼" : "▲"}${Math.abs(p).toFixed(0)}%`;

/* ═══ 불러오기 ═══════════════════════════════════════════ */
async function load(){
  if(!sb){
    $("stage").innerHTML = `<div class="blank"><b>설정이 아직 끝나지 않았습니다</b>
      config.js 파일에 Supabase 주소와 키를 넣어주세요.</div>`;
    return;
  }
  try{
    const { data, error } = await sb.from("products").select("*").eq("hidden", false).order("name");
    if(error) throw error;
    ITEMS = data || [];
    buildChips(); badges(); render();
  }catch(e){
    $("stage").innerHTML = `<div class="blank"><b>목록을 불러오지 못했습니다</b>
      ${esc(e.message || e)}<br>연결 상태를 확인해 주세요.
      <br><button class="retry" onclick="location.reload()">다시 시도</button></div>`;
  }
}
function buildChips(){
  const cats = ["전체", ...new Set(ITEMS.map(i => i.cat).filter(Boolean))];
  $("chips").innerHTML = cats.map(c =>
    `<button class="chip" data-c="${esc(c)}" aria-pressed="${c === cat}">${esc(c)}</button>`).join("");
  $("chips").querySelectorAll("[data-c]").forEach(b =>
    b.onclick = () => { cat = b.dataset.c; render(); });
}
function badges(){
  const n = ITEMS.filter(isNew).length, e = ITEMS.filter(onPromo).length;
  [["new", n], ["event", e]].forEach(([t, c]) => {
    const btn = $("tabs").querySelector(`[data-t="${t}"]`);
    btn.querySelector(".dot")?.remove();
    if(c) btn.insertAdjacentHTML("beforeend", `<span class="dot">${c > 99 ? "99+" : c}</span>`);
  });
}

/* ═══ 조각 ═══════════════════════════════════════════════ */
function vsBlock(it, j){
  const unit = j.basis === "unit";
  const refAt = unit ? j.b * Number(it.q) : Number(it.ref);
  const diff = Math.round(Math.abs(Number(it.mart) - refAt));
  const cheap = j.pct < 0;
  return `<span class="vs">
      <span class="vs-c"><span class="k">PX 가격</span>
        <span class="p num">${won(it.mart)}원</span>
        <span class="u">${unit ? `${esc(it.u)}당 ${fmtU(j.a)}원` : "&nbsp;"}</span></span>
      <span class="vs-mid">VS</span>
      <span class="vs-c rt"><span class="k">시중 최저가</span>
        <span class="p num">${won(it.ref)}원</span>
        <span class="u">${unit ? `${esc(it.u)}당 ${fmtU(j.b)}원` : "&nbsp;"}</span></span>
    </span>
    <span class="save-line ${cheap ? "" : "bad"}">${cheap ? "💰 " : "⚠️ "}${
      unit && Number(it.q) !== Number(it.rq) ? "같은 양이면 " : ""}${won(diff)}원 ${cheap ? "절약" : "더 냄"}</span>`;
}
function miniCard(s, tag){
  const up = s.j.pct < 0;
  return `<button class="mini" data-id="${esc(s.it.id)}">
    ${tag ? `<span class="mini-tag ${tag.k}">${tag.t}</span>` : ""}
    ${pic(s.it, "mini-img")}
    <span class="mini-name">${esc(s.it.name)}</span>
    <span class="mini-vol">${esc(vol(s.it))}</span>
    <span class="mini-pct ${up ? "up" : ""}">${pctTxt(s.j.pct)}</span>
    <span class="mini-price num">${won(s.it.mart)}원</span>
    <span class="mini-ref">${won(s.it.ref)}원</span></button>`;
}
function rankRow(s, i){
  const up = s.j.pct < 0;
  const medal = i === 0 ? "m1" : i === 1 ? "m2" : i === 2 ? "m3" : "";
  const likes = Number(s.it.likes) || 0;
  return `<button class="rrow" data-id="${esc(s.it.id)}">
    ${i != null ? `<span class="rno ${medal}">${i + 1}</span>` : ""}
    ${pic(s.it, "rimg")}
    <span class="rtx"><span class="rname">${esc(s.it.name)}</span>
      <span class="rvol">${esc(vol(s.it))}
        ${likes ? `<span class="rlike">👍 ${won(likes)}</span>` : ""}</span></span>
    <span class="rrt"><span class="rpct ${up ? "up" : ""}">${pctTxt(s.j.pct)}</span>
      <span class="rprice num">${won(s.it.mart)}원</span></span>${CHEV}</button>`;
}
function bindRows(){
  $("stage").querySelectorAll("[data-id]").forEach(b => b.onclick = () => openDetail(b.dataset.id));
  $("stage").querySelectorAll("[data-go]").forEach(b => b.onclick = () => switchTab(b.dataset.go));
}
const sponsorCard = () => `<div class="spon">
    <span class="hi">♥</span>
    <span class="tx"><span class="t1">도움이 되셨다면 후원으로 응원해주세요.</span>
      <span class="t2">협찬 대신 후원을 받습니다. 판정은 팔지 않습니다.</span></span>
    <button class="go" data-go="my">후원하기</button>
  </div>`;

/* ═══ 인기 ═══════════════════════════════════════════════ */
function hot(){
  const scored = ITEMS.map(it => ({ it, j: judge(it) }));
  const known = scored.filter(s => s.j.v !== "unknown");
  const pend = scored.length - known.length;
  known.sort((x, y) => x.j.pct - y.j.pct);
  const wins = known.filter(s => s.j.pct < 0);
  const bad = known.filter(s => s.j.v === "lose" || s.j.v === "same");

  const byCat = {};
  wins.forEach(s => { const c = s.it.cat || "기타"; (byCat[c] = byCat[c] || []).push(Math.abs(s.j.pct)); });
  let best = null;
  Object.entries(byCat).forEach(([c, a]) => {
    if(a.length < 2) return;
    const avg = a.reduce((x, y) => x + y, 0) / a.length;
    if(!best || avg > best.avg) best = { c, avg };
  });
  const newN = ITEMS.filter(isNew).length;
  const last = ITEMS.map(i => i.ref_date).filter(Boolean).sort().pop();

  let h = `<div class="pull">
    <button class="tip" data-go="hot">
      <span class="ic">💡</span>
      <span class="tx">
        <span class="t1">${best ? `이번엔 <b>${esc(best.c)}</b>이 특히 저렴합니다`
                                : `시중가를 더 채우면 분류별 이득을 알려드립니다`}</span>
        <span class="t2">${newN ? `신규 상품 ${won(newN)}개가 등록됐어요 🔥`
                                : `상품 ${won(ITEMS.length)}개를 지켜보는 중`}</span>
      </span>
      <span class="rt"><span class="k">시중가 확인일</span>
        <span class="v">${last ? esc(last) : "-"}</span>
        <span class="a">${last ? `${days(last)}일 전` : "확인 전"}</span></span>
    </button>
  </div>`;

  if(!known.length){
    $("stage").innerHTML = h + `<div class="blank"><b>아직 비교할 상품이 없습니다</b>
      관리자 화면에서 시중가를 넣으면 여기에 나타납니다.</div>` + sponsorCard();
    bindRows(); return;
  }

  const top = known[0];
  if(top.j.pct < 0){
    h += `<div class="sec"><span class="em">🔥</span><h2>오늘의 MUST BUY</h2></div>
      <button class="mb" data-id="${esc(top.it.id)}">
        <span class="mb-top">${pic(top.it, "mb-img")}
          <span class="mb-tx"><span class="mb-badge">MUST BUY</span>
            <span class="mb-name">${esc(top.it.name)}</span>
            <span class="mb-vol">${esc(vol(top.it))}</span></span>${CHEV}</span>
        <span class="mb-hl">
          <span class="mb-pct">${Math.abs(top.j.pct).toFixed(0)}<s>% 저렴</s></span>
          <span class="mb-ok">✓ ${LABEL[top.j.v]}</span></span>
        ${vsBlock(top.it, top.j)}
      </button>`;
  }
  if(wins.length){
    h += `<div class="sec"><span class="em">👑</span><h2>인기 상품 TOP${Math.min(wins.length, 10)}</h2>
        <button class="more" data-go="hot">더보기 ${CHEV}</button></div>
      <div class="ranks">${wins.slice(0, 10).map((s, i) => rankRow(s, i)).join("")}</div>`;
  }
  if(bad.length){
    h += `<div class="sec alert"><span class="em">⚠️</span><h2>비추천 상품</h2>
        <span class="more">${won(bad.length)}개</span></div>
      <div class="ranks">${bad.slice(0, 5).map(s => rankRow(s, null)).join("")}</div>`;
  }
  if(pend) h += `<div class="pending">시중가 확인 전 ${won(pend)}개는 판정에서 빠졌습니다</div>`;
  h += sponsorCard() + `<div class="end"></div>`;
  $("stage").innerHTML = h;
  bindRows();
}

/* ═══ 신규 ═══════════════════════════════════════════════ */
function newTab(){
  const list = ITEMS.filter(isNew)
    .filter(it => cat === "전체" || it.cat === cat)
    .filter(it => !term || it.name.toLowerCase().includes(term));
  const scored = list.map(it => ({ it, j: judge(it) }));
  scored.sort((x, y) => String(y.it.added).localeCompare(String(x.it.added)));
  if(!scored.length){
    $("stage").innerHTML = `<div class="blank"><b>최근 30일 안에 들어온 상품이 없습니다</b>
      새 상품이 등록되면 여기에 먼저 보여드립니다.</div>`;
    return;
  }
  const cheap = scored.filter(s => s.j.pct < 0);
  let h = "";
  if(cheap.length){
    h += `<div class="sec"><span class="nb">NEW</span><h2>새로 들어왔는데 싸요</h2>
        <span class="more">${won(cheap.length)}개</span></div>
      <div class="rail">${cheap.slice(0, 12).map(s => miniCard(s, { k:"new", t:"NEW" })).join("")}</div>`;
  }
  h += `<div class="sec"><span class="em">🆕</span><h2>신규 상품 전체</h2>
      <span class="more">${won(scored.length)}개</span></div>
    <div class="ranks">${scored.map(s => rankRow(s, null)).join("")}</div>
    ${sponsorCard()}<div class="end"></div>`;
  $("stage").innerHTML = h;
  bindRows();
}

/* ═══ 이벤트 ═════════════════════════════════════════════ */
function eventTab(){
  const list = ITEMS.filter(onPromo)
    .filter(it => cat === "전체" || it.cat === cat)
    .filter(it => !term || it.name.toLowerCase().includes(term));
  const scored = list.map(it => ({ it, j: judge(it) }));
  scored.sort((x, y) => (x.j.pct ?? 0) - (y.j.pct ?? 0));
  if(!scored.length){
    $("stage").innerHTML = `<div class="blank"><b>지금 진행 중인 행사가 없습니다</b>
      관리자 화면에서 상품의 <b>행사 종료일</b>을 넣으면 여기 모입니다.</div>` + sponsorCard();
    bindRows(); return;
  }
  $("stage").innerHTML = `<div class="sec"><span class="em">🎉</span><h2>진행 중인 행사</h2>
      <span class="more">${won(scored.length)}개</span></div>
    <div class="rail">${scored.slice(0, 12).map(s => miniCard(s, { k:"promo", t:"행사중" })).join("")}</div>
    <div class="sec"><h2>행사 상품 전체</h2></div>
    <div class="ranks">${scored.map(s => rankRow(s, null)).join("")}</div>
    <div class="pending">행사가는 기간이 끝나면 원래 가격으로 돌아갑니다</div>
    ${sponsorCard()}<div class="end"></div>`;
  bindRows();
}

/* ═══ 마이 ═══════════════════════════════════════════════ */
function myTab(){
  const saved = ITEMS.filter(it => SAVED.has(it.id)).map(it => ({ it, j: judge(it) }));
  const withRef = ITEMS.filter(i => i.ref != null).length;
  const last = ITEMS.map(i => i.ref_date).filter(Boolean).sort().pop();

  let h = `<div class="sec"><span class="em">🔖</span><h2>저장한 상품</h2>
      <span class="more">${won(saved.length)}개</span></div>`;
  h += saved.length ? `<div class="ranks">${saved.map(s => rankRow(s, null)).join("")}</div>`
                    : `<div class="pending">상품을 열어 하트를 누르면 여기 모입니다</div>`;
  h += `<div class="spon" style="margin-top:22px">
      <span class="hi">♥</span>
      <span class="tx"><span class="t1">도움이 되셨다면 후원으로 응원해주세요.</span>
        <span class="t2">준비 중입니다. 열리면 이 자리에서 바로 하실 수 있습니다.</span></span>
      <button class="go" disabled>준비 중</button>
    </div>
    <div class="pledge">
      <span class="stamp">협찬 없음 · 판정은 팔지 않습니다</span>
      <h3>돈 받고 순위를 바꾸지 않습니다</h3>
      <p>판정은 오직 단가 계산으로만 나옵니다. 광고가 붙더라도 순위와 판정에는
         손대지 않고, 광고 영역은 눈에 보이게 따로 표시합니다.</p>
      <p>수익이 생기면 그중 10%를 군 관련 단체에 기부하고 영수증을 이 화면에 공개합니다.</p>
    </div>
    <div class="panel">
      <div class="block"><h2>판정 기준</h2>
        <p style="margin-bottom:12px">단가가 이 비율보다 싸면 이득, 비싸면 비추천으로 봅니다.</p>
        <div class="row"><span class="k">기준 차이</span>
          <div class="seg" id="seg">${[3,5,10].map(v =>
            `<button data-v="${v}" aria-pressed="${v === THRESH}">${v}%</button>`).join("")}</div></div>
      </div>
      <div class="block"><h2>담긴 자료</h2>
        <div class="row"><span class="k">전체 상품</span><span class="v num">${won(ITEMS.length)}개</span></div>
        <div class="row"><span class="k">시중가 있는 상품</span><span class="v num">${won(withRef)}개</span></div>
        <div class="row"><span class="k">가장 최근 시중가</span><span class="v num">${last ? esc(last) : "없음"}</span></div>
      </div>
      <div class="block"><h2>판정 방법</h2>
        <p>총액이 아니라 <b>단가</b>로 비교합니다. 100g에 5,000원과 200g에 9,000원이면
           뒤쪽이 총액은 비싸도 단가는 쌉니다.</p>
        <p>용량 단위가 다르거나 비어 있으면 총액으로 비교하고, 상세 화면에 적어둡니다.</p>
        <p>배송비는 판정에 넣지 않습니다. 사람마다 조건이 달라서입니다.</p>
      </div>
      <div class="block"><h2>화면이 어둡게 보인다면</h2>
        <p>삼성 인터넷 등 일부 브라우저는 웹 화면을 강제로 어둡게 바꿉니다.
           브라우저 설정에서 “웹페이지 어둡게”를 끄면 원래 색으로 보입니다.</p>
      </div>
      <div class="block"><h2>저장 위치</h2>
        <p>저장한 상품·추천 기록·판정 기준은 이 기기에만 남습니다.</p>
      </div>
    </div><div class="end"></div>`;
  $("stage").innerHTML = h;
  bindRows();
  $("seg").querySelectorAll("[data-v]").forEach(b => b.onclick = () => {
    THRESH = Number(b.dataset.v); store.set("dilgun.thresh", THRESH); render();
  });
}

/* ═══ 검색 ═══════════════════════════════════════════════ */
function searchView(){
  const scored = ITEMS
    .filter(it => cat === "전체" || it.cat === cat)
    .filter(it => !term || it.name.toLowerCase().includes(term))
    .map(it => ({ it, j: judge(it) }));
  scored.sort((x, y) => x.it.name.localeCompare(y.it.name, "ko"));
  if(!scored.length){
    $("stage").innerHTML = `<div class="blank">${term
      ? `<b>“${esc(term)}”에 맞는 상품이 없습니다</b>다른 이름으로 찾아보세요.`
      : `<b>상품을 검색해 보세요</b>이름 일부만 넣어도 찾아줍니다.`}</div>`;
    return;
  }
  $("stage").innerHTML = `<div class="sec"><h2>검색 결과</h2>
      <span class="more">${won(scored.length)}개</span></div>
    <div class="ranks">${scored.map(s => rankRow(s, null)).join("")}</div><div class="end"></div>`;
  bindRows();
}

/* ═══ 가격 변동 그래프 ═══════════════════════════════════
   hist 형식: [{d:"2026-08-03", m:2570, r:8600}, ...]      */
function chart(it){
  let hist = [];
  try{ hist = Array.isArray(it.hist) ? it.hist : JSON.parse(it.hist || "[]"); }catch{}
  hist = hist.filter(p => p && p.d && p.m != null);

  const head = `<h3>📈 가격 변동
      <span class="leg"><span class="lg-px"><i></i>PX</span>
        <span class="lg-rf"><i></i>시중</span></span></h3>`;

  if(hist.length < 2){
    return `<div class="d-chart">${head}
      <div class="empty">아직 기록이 한 번뿐입니다.<br>
        시중가를 다시 확인할 때마다 여기에 선이 그려집니다.</div></div>`;
  }

  const W = 300, H = 100, PAD = 6;
  const ms = hist.map(p => Number(p.m));
  const rs = hist.map(p => p.r == null ? null : Number(p.r));
  const all = [...ms, ...rs.filter(v => v != null)];
  const lo = Math.min(...all), hi = Math.max(...all);
  const span = (hi - lo) || 1;
  const X = i => PAD + i * (W - PAD * 2) / (hist.length - 1);
  const Y = v => PAD + (1 - (v - lo) / span) * (H - PAD * 2);

  const line = arr => arr.map((v, i) => v == null ? null : `${X(i).toFixed(1)},${Y(v).toFixed(1)}`)
                         .filter(Boolean).join(" ");
  const areaPts = line(ms);
  const lastM = ms[ms.length - 1], firstM = ms[0];
  const dir = lastM === firstM ? "그대로" : lastM < firstM ? "내림" : "오름";
  const dirPct = firstM ? Math.abs((lastM - firstM) / firstM * 100).toFixed(0) : "0";

  return `<div class="d-chart">${head}
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
         aria-label="가격 변동 그래프">
      <defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2E3B28" stop-opacity=".16"/>
        <stop offset="100%" stop-color="#2E3B28" stop-opacity="0"/>
      </linearGradient></defs>
      <polygon points="${PAD},${H - PAD} ${areaPts} ${W - PAD},${H - PAD}" fill="url(#gA)"/>
      ${rs.some(v => v != null) ? `<polyline points="${line(rs)}" fill="none" stroke="#C4BCA8"
        stroke-width="2.2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/>` : ""}
      <polyline points="${areaPts}" fill="none" stroke="#2E3B28" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
      ${ms.map((v, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${
        i === ms.length - 1 ? 4 : 2.6}" fill="${i === ms.length - 1 ? "#D2A55C" : "#2E3B28"}"
        stroke="#fff" stroke-width="${i === ms.length - 1 ? 2 : 1}"/>`).join("")}
    </svg>
    <div class="foot"><span>${esc(hist[0].d)}</span>
      <span>PX가 ${dirPct}% ${dir}</span>
      <span>${esc(hist[hist.length - 1].d)}</span></div>
  </div>`;
}

/* ═══ 상세 ═══════════════════════════════════════════════ */
function detail(){
  const it = ITEMS.find(x => String(x.id) === String(DETAIL));
  if(!it){ DETAIL = null; return render(); }
  const j = judge(it);
  const known = j.v !== "unknown";
  const tone = !known ? "" : j.v === "lose" ? "bad" : j.v === "same" ? "mid" : "";
  const unit = j.basis === "unit";
  const cheap = known && j.pct < 0;
  const likes = Number(it.likes) || 0;
  const didLike = LIKED.has(it.id);

  const why = [];
  if(known){
    why.push(unit ? `${esc(it.u)} 단위로 환산해 비교했습니다 (PX ${fmtU(j.a)}원 · 시중 ${fmtU(j.b)}원)`
                  : `용량 정보가 없어 총액으로만 비교했습니다`);
    if(unit && Number(it.q) !== Number(it.rq))
      why.push(`판매 단위가 서로 달라(PX ${it.q}${esc(it.u)} · 시중 ${it.rq}${esc(it.ru)}) 같은 양 기준으로 맞췄습니다`);
    why.push(`시중가는 온라인 최저가 기준이며, 배송비는 넣지 않았습니다`);
    if(onPromo(it)) why.push(`지금은 행사가입니다. 행사가 끝나면 판정이 달라질 수 있습니다`);
  } else why.push(`시중가가 아직 등록되지 않아 비교할 수 없습니다`);

  $("stage").innerHTML = `<div class="dv">
    <div class="d-card">
      <div class="d-top">${pic(it, "d-img")}
        <div style="flex:1;min-width:0">
          ${known && j.v === "win2" ? `<span class="mb-badge">MUST BUY</span>` : ""}
          <div class="d-name">${esc(it.name)}</div>
          <div class="d-vol">${esc(vol(it))}${it.cat ? ` · ${esc(it.cat)}` : ""}</div>
        </div></div>
      ${known ? `<div class="d-hl ${tone}">
        <span class="pct">${Math.abs(j.pct).toFixed(0)}<s>% ${cheap ? "저렴" : "비쌈"}</s></span>
        <span class="ok">${LABEL[j.v]}</span></div>${vsBlock(it, j)}`
      : `<div class="d-hl mid"><span class="ok" style="margin:0">판정 대기</span></div>`}
    </div>

    ${chart(it)}

    <div class="d-like">
      <span class="n num">${won(likes)}</span>
      <span class="tx"><span class="t1">${didLike ? "추천해 주셨습니다" : "이 상품 추천할 만한가요?"}</span>
        <span class="t2">추천이 많은 상품은 목록에서 눈에 띄게 보여집니다</span></span>
      <button class="btn" id="dLike" ${didLike ? "disabled" : ""}>${didLike ? "✓ 추천함" : "👍 추천"}</button>
    </div>

    <div class="d-meta">
      <div class="d-row"><span class="k">최근 시중가 확인</span>
        <span class="v">${it.ref_date ? esc(it.ref_date) : "없음"}
          ${it.ref_date ? `<small>${days(it.ref_date)}일 전</small>` : ""}</span></div>
      <div class="d-row"><span class="k">등록일</span>
        <span class="v">${it.added ? esc(it.added) : "-"}</span></div>
      <div class="d-row"><span class="k">비교 기준</span>
        <span class="v">${unit ? "동일 용량 환산" : "총액"}<small>배송비 제외</small></span></div>
      ${it.pick && it.pick_note ? `<div class="d-row"><span class="k">한마디</span>
        <span class="v" style="font-weight:600;color:var(--dim)">${esc(it.pick_note)}</span></div>` : ""}
    </div>

    <div class="d-why ${cheap || !known ? "" : "bad"}">
      <h3>${cheap ? "✓ 이 상품이 저렴한 이유" : known ? "! 이 판정이 나온 이유" : "· 판정을 못 하는 이유"}</h3>
      <ul>${why.map(w => `<li>${w}</li>`).join("")}</ul>
    </div>

    <div class="d-acts">
      <button class="d-btn ghost" id="dFav" aria-pressed="${SAVED.has(it.id)}"
              aria-label="저장">${SAVED.has(it.id) ? "❤️" : "🤍"}</button>
      <button class="d-btn" id="dShare">공유하기</button>
    </div><div class="end"></div></div>`;

  $("dFav").onclick = () => {
    if(SAVED.has(it.id)) SAVED.delete(it.id); else SAVED.add(it.id);
    store.set("dilgun.saved", [...SAVED]);
    $("dFav").setAttribute("aria-pressed", SAVED.has(it.id));
    $("dFav").textContent = SAVED.has(it.id) ? "❤️" : "🤍";
  };
  $("dShare").onclick = () => shareUrl(
    `${it.name} — PX ${won(it.mart)}원${known ? ` (시중 대비 ${Math.abs(j.pct).toFixed(0)}% ${cheap ? "저렴" : "비쌈"})` : ""}`);
  $("dLike").onclick = () => like(it);
}

async function like(it){
  if(LIKED.has(it.id) || !sb) return;
  const btn = $("dLike");
  btn.disabled = true;
  const { data, error } = await sb.rpc("bump_like", { pid: String(it.id) });
  if(error){
    btn.disabled = false;
    toast("추천을 저장하지 못했습니다");
    return;
  }
  it.likes = data ?? (Number(it.likes) || 0) + 1;
  LIKED.add(it.id);
  store.set("dilgun.liked", [...LIKED]);
  render();
  toast("추천했습니다");
}

function openDetail(id){ DETAIL = id; window.scrollTo({ top:0 }); render(); }

/* ═══ 화면 전환 ═════════════════════════════════════════ */
const TITLE = {
  hot:["딜군","오늘 PX에서 사면 좋은 것"],
  new:["신규 상품","최근 30일 안에 들어온 것"],
  event:["이벤트","지금 행사 중인 상품"],
  my:["마이","저장한 상품과 앱 설정"],
};
function render(){
  const big = TAB === "hot" && !DETAIL && !SEARCH;
  const [t, s] = DETAIL ? ["상품 정보", ""] : SEARCH ? ["검색", "찾는 상품이 있나요"] : TITLE[TAB];
  $("hTitle").textContent = t;
  $("hSub").textContent = s;
  $("hSub").style.display = s ? "" : "none";
  $("hero").classList.toggle("compact", !big);
  $("hLeft").hidden = !(DETAIL || SEARCH);
  $("hRight").hidden = !!DETAIL;
  $("bar").hidden = !!DETAIL || !(SEARCH || TAB === "new" || TAB === "event");
  $("chips").querySelectorAll("[data-c]").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.c === cat));
  $("tabs").querySelectorAll("[data-t]").forEach(b =>
    b.setAttribute("aria-selected", !DETAIL && !SEARCH && b.dataset.t === TAB));

  if(DETAIL) return detail();
  if(SEARCH) return searchView();
  if(TAB === "hot")   return hot();
  if(TAB === "new")   return newTab();
  if(TAB === "event") return eventTab();
  myTab();
}
function switchTab(t){
  DETAIL = null; SEARCH = false; TAB = t; term = ""; $("q").value = "";
  window.scrollTo({ top:0 }); render();
}
$("hLeft").onclick = () => {
  if(DETAIL) DETAIL = null; else { SEARCH = false; term = ""; $("q").value = ""; }
  render();
};
$("hRight").onclick = () => { if(SEARCH) return shareUrl(); SEARCH = true; render(); $("q").focus(); };
$("q").addEventListener("input", e => { term = e.target.value.trim().toLowerCase(); render(); });
$("tabs").querySelectorAll("[data-t]").forEach(b => b.onclick = () => switchTab(b.dataset.t));
addEventListener("scroll", () => $("bar").classList.toggle("stuck", scrollY > 8), { passive:true });

/* ═══ 공유 ═══════════════════════════════════════════════ */
function toast(m){
  let el = $("toast");
  if(!el){
    el = document.createElement("div"); el.id = "toast";
    el.style.cssText = "position:fixed;left:50%;bottom:-60px;transform:translateX(-50%);"
      + "background:#212A1C;color:#fff;padding:11px 20px;border-radius:99px;font-size:13px;"
      + "font-weight:600;transition:bottom .25s;z-index:60";
    document.body.appendChild(el);
  }
  el.textContent = m;
  requestAnimationFrame(() => el.style.bottom = "22px");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.style.bottom = "-60px", 1800);
}
async function shareUrl(text){
  const url = location.origin + location.pathname;
  const body = text || "PX 가격, 진짜 싼지 확인해보세요";
  if(navigator.share){ try{ await navigator.share({ title:"딜군", text:body, url }); }catch{} }
  else { try{ await navigator.clipboard.writeText(`${body}\n${url}`); toast("링크를 복사했습니다"); }
         catch{ toast(url); } }
}

/* ═══ 홈 화면에 추가 ═══════════════════════════════════ */
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
let deferred = null;
function showInstall(txt, withBtn){
  const d = document.createElement("div");
  d.className = "install"; d.id = "install";
  d.innerHTML = `<span>${txt}</span>${withBtn ? `<button id="insGo">추가하기</button>` : ""}
                 <button id="insX" aria-label="닫기">✕</button>`;
  $("stage").parentElement.insertBefore(d, $("stage"));
  $("insX").onclick = () => { d.remove(); store.set("dilgun.insHide", true); };
  const g = $("insGo");
  if(g) g.onclick = async () => { if(!deferred) return;
    deferred.prompt(); await deferred.userChoice; deferred = null; d.remove(); };
}
if(!standalone && !store.get("dilgun.insHide", false)){
  if(ios) showInstall("공유 버튼을 누르고 “홈 화면에 추가”를 선택하세요", false);
  else addEventListener("beforeinstallprompt", e => {
    e.preventDefault(); deferred = e;
    if(!$("install")) showInstall("홈 화면에 추가하면 앱처럼 바로 열립니다", true);
  });
}
addEventListener("appinstalled", () => $("install")?.remove());
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

load();
</script>
