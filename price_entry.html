<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#EDE1C7">
<title>딜군 · 시중가 입력</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --ink:#4E6144; --deep:#2E3B28;
  --rule:#E2DCCF; --wash:#F7F4EC; --paper:#fff;
  --win:#2F7D4F; --win-bg:#E7F3EA;
  --lose:#B4432A; --lose-bg:#FBEEE8;
  --hold:#8A6A20; --hold-bg:#FBF2DC;
  --dim:#6E7166; --faint:#9C9E8F;
  --gold:#D2A55C;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,"Roboto Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--wash);color:#1F241C;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:60px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.board{background:var(--deep);color:#fff;padding:18px}
.board .mark{font-size:16px;font-weight:800}
.board .mark span{color:#AEB59D;font-weight:600;margin-left:4px}
.board p{color:#D5CFBE;font-size:12px;margin-top:3px}

main{max-width:520px;margin:0 auto;padding:16px}

/* 진행률 */
.progress-wrap{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.progress-track{flex:1;height:6px;background:var(--rule);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:var(--ink);border-radius:99px;transition:width .25s}
.progress-num{font-size:12px;color:var(--dim);white-space:nowrap}
.progress-num b{color:#1F241C;font-family:var(--mono)}

.sheet{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:20px;margin-bottom:14px}

.item-name{font-size:19px;font-weight:800;letter-spacing:-.2px;margin-bottom:2px}
.item-brand{font-size:13px;color:var(--faint);margin-bottom:16px}

.px-row{display:flex;align-items:baseline;gap:8px;padding:12px 14px;background:var(--wash);border-radius:10px;margin-bottom:16px}
.px-row .label{font-size:11.5px;color:var(--dim);font-weight:700}
.px-row .price{font-family:var(--mono);font-size:20px;font-weight:800}
.px-row .qty{font-size:12.5px;color:var(--dim);margin-left:auto}
.px-row .qty.warn{color:var(--hold);font-weight:700}

.fld{margin-bottom:14px}
.fld label{font-size:11.5px;color:var(--dim);font-weight:700;display:block;margin-bottom:5px}
.fld input,.fld select{width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;font-size:14px;font-family:inherit}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--ink)}
.fld.price input{font-family:var(--mono);font-size:22px;font-weight:800;padding:12px 14px}

.qty-pair{display:grid;grid-template-columns:1fr 84px;gap:8px}

.toggle-link{font-size:12px;color:var(--ink);font-weight:700;cursor:pointer;display:inline-block;margin-bottom:14px;user-select:none}
.detail{display:none}
.detail.on{display:block}

.btn{appearance:none;border:none;background:var(--ink);color:#fff;font-weight:700;font-size:14.5px;padding:13px 18px;border-radius:9px;cursor:pointer;width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--dim);border:1px solid var(--rule)}
.row-btns{display:flex;gap:8px}
.row-btns .btn.ghost{flex:0 0 96px}
.row-btns .btn.primary{flex:1}

.empty{padding:60px 20px;text-align:center;color:var(--dim);font-size:13.5px}
.empty b{display:block;color:#1F241C;font-size:16px;margin-bottom:6px}

.toast{position:fixed;left:50%;bottom:-60px;transform:translateX(-50%);background:var(--deep);color:#fff;padding:11px 20px;border-radius:99px;font-size:13px;font-weight:600;transition:bottom .25s;z-index:50}
.toast.on{bottom:22px}
</style>
</head>
<body>

<div class="board">
  <div class="mark">딜군<span>시중가 입력</span></div>
  <p>PX가는 이미 있습니다. 시중가만 넣으면 판정이 완성됩니다.</p>
</div>

<main>
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="pfill" style="width:0%"></div></div>
    <div class="progress-num"><b id="pdone">0</b> / <b id="ptotal">0</b></div>
  </div>

  <div id="stage"></div>
</main>

<div class="toast" id="toast"></div>

<script type="module">
const SUPABASE_URL = "https://zxbiwyjlnkiyglbxxsof.supabase.co/";
const SUPABASE_ANON_KEY = "sb_publishable_BtUydzGa1D7zX-dYpaQ_7Q_aRusBj56";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);
const won = n => (n ?? 0).toLocaleString("ko-KR");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CATS = ["화장품","식품","음료","생활용품","건강","의류","전자","유아동","반려동물","기타"];
const today = () => new Date().toISOString().slice(0,10);

let QUEUE = [];
let TOTAL = 0;

function toast(msg){
  $("toast").textContent = msg;
  $("toast").classList.add("on");
  setTimeout(() => $("toast").classList.remove("on"), 1800);
}

/* ═══ 시작 : catalog_items 중 products에 아직 없는 것만 큐에 담기 ═══ */
async function boot(){
  const [{ data: cat, error: e1 }, { data: prod, error: e2 }] = await Promise.all([
    sb.from("catalog_items").select("name,brand,price,category,q,u").order("created_at"),
    sb.from("products").select("name")
  ]);

  if(e1 || e2){
    $("stage").innerHTML = `<div class="empty"><b>불러오지 못했습니다</b>${esc((e1||e2).message)}</div>`;
    return;
  }

  const done = new Set(prod.map(p => String(p.name).replace(/\s/g,"").toLowerCase()));
  QUEUE = cat.filter(c => !done.has(String(c.name).replace(/\s/g,"").toLowerCase()));
  TOTAL = cat.length;
  $("ptotal").textContent = won(TOTAL);
  render();
}

function updateProgress(){
  const doneCount = TOTAL - QUEUE.length;
  $("pdone").textContent = won(doneCount);
  $("pfill").style.width = TOTAL ? `${doneCount / TOTAL * 100}%` : "0%";
}

function render(){
  updateProgress();

  if(!QUEUE.length){
    $("stage").innerHTML = `<div class="empty"><b>전부 끝났습니다</b>시중가 입력할 상품이 더 없습니다.</div>`;
    return;
  }

  const it = QUEUE[0];
  const hasQty = it.q && it.u;
  const catOk = CATS.includes(it.category);

  $("stage").innerHTML = `
    <div class="sheet">
      <div class="item-name">${esc(it.name)}</div>
      <div class="item-brand">${esc(it.brand) || "브랜드 정보 없음"}</div>

      <div class="px-row">
        <span class="label">PX가</span>
        <span class="price num">${won(it.price)}원</span>
        <span class="qty ${hasQty ? "" : "warn"}">${hasQty ? esc(it.q) + esc(it.u) : "용량 미확인 · 아래서 입력"}</span>
      </div>

      <div class="fld price">
        <label>시중가 (네이버쇼핑·쿠팡 최저가)</label>
        <input type="number" id="refPrice" inputmode="numeric" placeholder="숫자만 입력">
      </div>

      <span class="toggle-link" id="toggleDetail">용량 · 카테고리 확인 ${hasQty && catOk ? "" : "⚠️"}</span>

      <div class="detail ${hasQty && catOk ? "" : "on"}" id="detailBox">
        <div class="fld">
          <label>카테고리</label>
          <select id="fCat">
            ${CATS.map(c => `<option ${c === it.category ? "selected" : ""}>${c}</option>`).join("")}
          </select>
        </div>
        <div class="fld">
          <label>PX가 기준 용량</label>
          <div class="qty-pair">
            <input type="number" id="fQ" step="any" value="${it.q ?? ""}" placeholder="수량">
            <input type="text" id="fU" value="${it.u ?? ""}" placeholder="단위(g/ml)">
          </div>
        </div>
        <div class="fld">
          <label>시중가 기준 용량 (다르면 수정)</label>
          <div class="qty-pair">
            <input type="number" id="fRQ" step="any" value="${it.q ?? ""}" placeholder="수량">
            <input type="text" id="fRU" value="${it.u ?? ""}" placeholder="단위(g/ml)">
          </div>
        </div>
      </div>

      <div class="row-btns">
        <button class="btn ghost" id="btnSkip">건너뛰기</button>
        <button class="btn primary" id="btnSave">등록하고 다음</button>
      </div>
    </div>`;

  $("toggleDetail").onclick = () => $("detailBox").classList.toggle("on");
  $("btnSkip").onclick = () => { QUEUE.shift(); render(); };
  $("btnSave").onclick = save;

  const priceInput = $("refPrice");
  priceInput.focus();
  priceInput.onkeydown = e => { if(e.key === "Enter") save(); };
}

async function save(){
  const it = QUEUE[0];
  const ref = Number($("refPrice").value);
  if(!ref){ toast("시중가를 입력하세요"); $("refPrice").focus(); return; }

  const cat = $("fCat").value;
  const q  = Number($("fQ").value)  || null;
  const u  = $("fU").value.trim()   || null;
  const rq = Number($("fRQ").value) || q;
  const ru = $("fRU").value.trim()  || u;

  $("btnSave").disabled = true;
  const { error } = await sb.from("products").insert({
    name: it.name, cat, mart: it.price, q, u,
    ref, rq, ru, ref_date: today(), added: today(), hidden: false
  });
  $("btnSave").disabled = false;

  if(error){ toast("저장 실패: " + error.message); return; }
  QUEUE.shift();
  toast("등록됨");
  render();
}

boot();
</script>
</body>
</html>
