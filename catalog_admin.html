<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#EDE1C7">
<title>딜군 · 상품 등록</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --ink:#4E6144; --deep:#2E3B28;
  --rule:#E2DCCF; --wash:#F7F4EC; --paper:#fff;
  --win:#2F7D4F; --win-bg:#E7F3EA;
  --lose:#B4432A; --lose-bg:#FBEEE8;
  --hold:#8A6A20; --hold-bg:#FBF2DC;
  --dim:#6E7166; --faint:#9C9E8F;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,"Roboto Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--wash);color:#1F241C;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:60px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h2{font-size:16px;font-weight:800;letter-spacing:-.2px}

.board{background:var(--deep);color:#fff;padding:18px}
.board .mark{font-size:16px;font-weight:800}
.board .mark span{color:#A8B096;font-weight:600;margin-left:4px}
.board p{color:#AEB59D;font-size:12px;margin-top:3px}

main{max-width:820px;margin:0 auto;padding:16px}
.sheet{background:var(--paper);border:1px solid var(--rule);border-radius:12px;margin-bottom:16px;overflow:hidden}
.sheet-hd{padding:13px 16px;border-bottom:1px solid var(--rule);font-weight:800;font-size:13.5px;display:flex;align-items:center;justify-content:space-between}
.sheet-bd{padding:16px}

.drop{border:2px dashed var(--rule);border-radius:10px;padding:26px 16px;text-align:center;color:var(--dim);font-size:13px}
.drop.over{border-color:var(--ink);background:#F5F1E7}
input[type=file]{display:block;margin:0 auto 10px}

.btn{appearance:none;border:none;background:var(--ink);color:#fff;font-weight:700;font-size:13.5px;padding:11px 18px;border-radius:8px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--rule)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.danger{background:#fff;color:var(--lose);border:1px solid #EFD3C6}
.btn.block{width:100%}
.row-btns{display:flex;gap:8px;margin-top:12px}

.progress{font-size:12.5px;color:var(--dim);margin-top:10px;min-height:18px}

/* 검토 카드 */
.review{border:1px solid var(--rule);border-radius:10px;padding:12px;display:flex;gap:12px;margin-bottom:10px;position:relative}
.review.err{border-color:#EFD3C6;background:var(--lose-bg)}
.thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;flex-shrink:0;background:#F1EEE4}
.review-fields{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.review-fields .full{grid-column:1/-1}
.review label{font-size:10.5px;color:var(--faint);font-weight:700;display:block;margin-bottom:2px}
.review input,.review select{width:100%;padding:7px 9px;border:1px solid var(--rule);border-radius:6px;font-size:13px;font-family:inherit}
.review input:focus,.review select:focus{outline:none;border-color:var(--ink)}
.review-check{flex-shrink:0;display:flex;align-items:flex-start;padding-top:2px}
.review-check input{width:18px;height:18px}
.err-msg{font-size:11.5px;color:var(--lose);margin-top:4px;grid-column:1/-1}

/* 등록 목록 테이블 */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 10px;background:var(--wash);color:var(--dim);font-size:11.5px;font-weight:700;border-bottom:1px solid var(--rule)}
td{padding:9px 10px;border-bottom:1px solid var(--rule)}
tr:last-child td{border-bottom:none}
.r{text-align:right}
.c{text-align:center}
.cat-pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#F0E9D8;color:var(--ink);white-space:nowrap}
.brand{color:var(--faint);font-size:11.5px}

.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 4px}
.chip{flex-shrink:0;padding:5px 12px;border-radius:99px;border:1px solid var(--rule);background:#fff;font-size:12px;font-weight:700;color:var(--dim)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

.empty{padding:40px 20px;text-align:center;color:var(--dim);font-size:13px}
.empty b{display:block;color:#1F241C;margin-bottom:3px}

.toast{position:fixed;left:50%;bottom:-60px;transform:translateX(-50%);background:var(--deep);color:#fff;padding:11px 20px;border-radius:99px;font-size:13px;font-weight:600;transition:bottom .25s;z-index:50}
.toast.on{bottom:22px}

/* 편집 다이얼로그 */
.veil{position:fixed;inset:0;background:rgba(14,33,53,.4);display:none;z-index:60}
.veil.on{display:block}
.edit{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90vw,380px);background:#fff;border-radius:14px;padding:18px;display:none;z-index:61}
.edit.on{display:block}
.edit h3{font-size:14.5px;margin-bottom:12px}
.edit .fld{margin-bottom:10px}
.edit label{font-size:11.5px;color:var(--dim);font-weight:700;display:block;margin-bottom:3px}
.edit input,.edit select{width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:7px;font-size:13.5px}
.edit-ft{display:flex;gap:8px;margin-top:14px}
.edit-ft .btn{flex:1}
</style>
</head>
<body>

<div class="board">
  <div class="mark">딜군<span>상품 등록</span></div>
  <p>스크린샷 한 장 = 상품 하나. 이름·브랜드·가격·카테고리를 자동으로 채웁니다.</p>
</div>

<main>

  <!-- 업로드 & 분류 -->
  <div class="sheet">
    <div class="sheet-hd">스크린샷 업로드</div>
    <div class="sheet-bd">
      <div class="drop" id="drop">
        <input type="file" id="fileInput" accept="image/*" multiple>
        <div>상품 상세페이지 스크린샷을 선택하세요 (여러 장 가능)</div>
      </div>
      <div class="row-btns">
        <button class="btn block" id="btnClassify">🔍 자동 분류 시작</button>
      </div>
      <div class="progress" id="progress"></div>
    </div>
  </div>

  <!-- 검토 -->
  <div class="sheet" id="reviewSheet" style="display:none">
    <div class="sheet-hd">분류 결과 검토<span id="reviewCount" style="font-weight:600;color:var(--dim);font-size:12px"></span></div>
    <div class="sheet-bd" id="reviewBody"></div>
    <div class="sheet-bd" style="padding-top:0">
      <div class="row-btns">
        <button class="btn block" id="btnRegisterAll">선택한 항목 등록</button>
      </div>
    </div>
  </div>

  <!-- 등록된 상품 -->
  <div class="sheet">
    <div class="sheet-hd">등록된 상품<span id="totalCount" style="font-weight:600;color:var(--dim);font-size:12px"></span></div>
    <div class="chips" id="chips"></div>
    <div id="listBody"></div>
  </div>

</main>

<div class="veil" id="veil"></div>
<div class="edit" id="edit">
  <h3>상품 수정</h3>
  <div class="fld"><label>이름</label><input id="edName"></div>
  <div class="fld"><label>브랜드</label><input id="edBrand"></div>
  <div class="fld"><label>가격</label><input id="edPrice" inputmode="numeric"></div>
  <div class="fld"><label>카테고리</label><select id="edCategory"></select></div>
  <div class="edit-ft">
    <button class="btn ghost" id="edCancel">취소</button>
    <button class="btn" id="edSave">저장</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
/* ── Supabase 설정 : admin_supabase.html과 같은 프로젝트 값 사용 ── */
const SUPABASE_URL = (window.DILGUN||{}).SUPABASE_URL;
const SUPABASE_ANON_KEY = (window.DILGUN||{}).SUPABASE_ANON_KEY;
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ── Anthropic Claude Vision API 설정 ── */
const ANTHROPIC_API_KEY = "sk-ant-YOUR-API-KEY";
const VISION_MODEL = "claude-sonnet-5";   // 정확한 분류가 우선이면 claude-opus-4-8 로 교체 가능

const $ = id => document.getElementById(id);
const won = n => (n ?? 0).toLocaleString("ko-KR");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* 카테고리 목록 — 필요에 맞게 여기만 수정하면 전체 반영됩니다 */
const CATS = ["화장품","식품","음료","생활용품","건강","의류","전자","유아동","반려동물","기타"];

let QUEUE = [];      // 업로드된 파일 + 분류 결과 (검토 대기)
let ITEMS = [];      // Supabase에서 불러온 등록 상품
let activeCat = "전체";

/* ═══ Vision으로 이미지 1장 분류 ═══════════════════════════ */
async function classifyOne(file){
  const base64 = await fileToBase64(file);
  const thumb = `data:${file.type};base64,${base64}`;

  try{
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "x-api-key": ANTHROPIC_API_KEY, "content-type": "application/json" },
      body: JSON.stringify({
        model: VISION_MODEL,
        max_tokens: 300,
        messages: [{
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: file.type, data: base64 } },
            { type: "text", text:
`이 이미지는 쇼핑몰 상품 화면입니다. 아래 JSON 형식으로만 답하세요. 다른 설명은 넣지 마세요.

{"name":"상품명 (용량·옵션 포함 가능)","brand":"브랜드명, 확실하지 않으면 빈 문자열","price":숫자만(원 단위, 쉼표·원 제거),"category":"다음 중 하나 → ${CATS.join("/")}"}` }
          ]
        }]
      })
    });

    if(!resp.ok){
      const e = await resp.json().catch(() => ({}));
      return { thumb, name:"", brand:"", price:0, category:CATS[CATS.length-1], ok:false, err: e.error?.message || `API 오류 (${resp.status})` };
    }

    const data = await resp.json();
    const text = (data.content || []).map(b => b.text || "").join("");
    const clean = text.replace(/```json\n?|```/g, "").trim();
    const j = JSON.parse(clean);

    return {
      thumb,
      name: j.name || "",
      brand: j.brand || "",
      price: parseInt(String(j.price).replace(/[^\d]/g, "")) || 0,
      category: CATS.includes(j.category) ? j.category : CATS[CATS.length-1],
      ok: !!(j.name && j.price),
      err: (!j.name || !j.price) ? "이름 또는 가격을 찾지 못했습니다" : null,
    };
  } catch(e){
    return { thumb, name:"", brand:"", price:0, category:CATS[CATS.length-1], ok:false, err:"분류 실패: " + e.message };
  }
}

function fileToBase64(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(",")[1]);
    r.onerror = () => rej(new Error("파일 읽기 실패"));
    r.readAsDataURL(file);
  });
}

async function runClassify(){
  const files = [...$("fileInput").files];
  if(!files.length){ toast("먼저 스크린샷을 선택해주세요"); return; }

  $("btnClassify").disabled = true;
  QUEUE = [];

  for(let i = 0; i < files.length; i++){
    $("progress").textContent = `${i+1}/${files.length}번째 이미지 분석 중...`;
    const result = await classifyOne(files[i]);
    QUEUE.push({ ...result, pick: result.ok });
    renderReview();
  }

  $("progress").textContent = `완료: ${QUEUE.filter(q=>q.ok).length}/${files.length}건 인식`;
  $("btnClassify").disabled = false;
}

function renderReview(){
  if(!QUEUE.length){ $("reviewSheet").style.display = "none"; return; }
  $("reviewSheet").style.display = "block";
  $("reviewCount").textContent = `${QUEUE.length}건`;

  $("reviewBody").innerHTML = QUEUE.map((q, i) => `
    <div class="review ${q.ok ? "" : "err"}">
      <div class="review-check"><input type="checkbox" data-pick="${i}" ${q.pick ? "checked" : ""}></div>
      <img class="thumb" src="${q.thumb}">
      <div class="review-fields">
        <div class="full">
          <label>상품명</label>
          <input data-f="name" data-i="${i}" value="${esc(q.name)}">
        </div>
        <div>
          <label>브랜드</label>
          <input data-f="brand" data-i="${i}" value="${esc(q.brand)}">
        </div>
        <div>
          <label>가격</label>
          <input data-f="price" data-i="${i}" inputmode="numeric" value="${q.price || ""}">
        </div>
        <div class="full">
          <label>카테고리</label>
          <select data-f="category" data-i="${i}">
            ${CATS.map(c => `<option ${c === q.category ? "selected" : ""}>${c}</option>`).join("")}
          </select>
        </div>
        ${q.err ? `<div class="err-msg">⚠ ${esc(q.err)} — 직접 입력해주세요</div>` : ""}
      </div>
    </div>`).join("");

  $("reviewBody").querySelectorAll("[data-pick]").forEach(cb => {
    cb.onchange = () => { QUEUE[+cb.dataset.pick].pick = cb.checked; };
  });
  $("reviewBody").querySelectorAll("[data-f]").forEach(el => {
    el.onchange = () => {
      const i = +el.dataset.i, f = el.dataset.f;
      QUEUE[i][f] = f === "price" ? (parseInt(el.value.replace(/[^\d]/g,"")) || 0) : el.value;
    };
  });
}

async function registerAll(){
  const picked = QUEUE.filter(q => q.pick);
  if(!picked.length){ toast("선택된 항목이 없습니다"); return; }
  $("btnRegisterAll").disabled = true;

  let ok = 0;
  for(const q of picked){
    if(!q.name || !q.price){ continue; }
    const { error } = await sb.from("catalog_items").insert({
      name: q.name, brand: q.brand || "", price: q.price, category: q.category
    });
    if(!error) ok++;
  }

  toast(`${ok}건 등록했습니다`);
  QUEUE = [];
  $("reviewSheet").style.display = "none";
  $("fileInput").value = "";
  $("progress").textContent = "";
  $("btnRegisterAll").disabled = false;
  await loadItems();
}

/* ═══ 등록된 상품 목록 ═══════════════════════════════════════ */
async function loadItems(){
  const { data, error } = await sb.from("catalog_items").select("*").order("created_at", { ascending:false });
  if(error){ $("listBody").innerHTML = `<div class="empty"><b>불러오지 못했습니다</b>${esc(error.message)}</div>`; return; }
  ITEMS = data;
  buildChips();
  renderList();
}

function buildChips(){
  const cats = ["전체", ...CATS.filter(c => ITEMS.some(it => it.category === c))];
  $("chips").innerHTML = cats.map(c =>
    `<button class="chip" data-c="${esc(c)}" aria-pressed="${c === activeCat}">${esc(c)}</button>`).join("");
  $("chips").querySelectorAll("[data-c]").forEach(b => {
    b.onclick = () => { activeCat = b.dataset.c; buildChips(); renderList(); };
  });
}

function renderList(){
  const list = ITEMS.filter(it => activeCat === "전체" || it.category === activeCat);
  $("totalCount").textContent = `${ITEMS.length}건`;

  if(!list.length){
    $("listBody").innerHTML = `<div class="empty"><b>등록된 상품이 없습니다</b>위에서 스크린샷을 올려 시작하세요.</div>`;
    return;
  }

  $("listBody").innerHTML = `<table><thead><tr>
      <th>상품</th><th style="width:76px">카테고리</th><th class="r" style="width:90px">가격</th><th style="width:70px"></th>
    </tr></thead><tbody>${list.map(it => `
      <tr>
        <td><div>${esc(it.name)}</div>${it.brand ? `<div class="brand">${esc(it.brand)}</div>` : ""}</td>
        <td><span class="cat-pill">${esc(it.category)}</span></td>
        <td class="r num">${won(it.price)}</td>
        <td class="c">
          <button class="btn ghost sm" data-edit="${it.id}">수정</button>
        </td>
      </tr>`).join("")}</tbody></table>`;

  $("listBody").querySelectorAll("[data-edit]").forEach(b => {
    b.onclick = () => openEdit(b.dataset.edit);
  });
}

/* ═══ 편집 ═══ */
let editingId = null;

function openEdit(id){
  const it = ITEMS.find(x => x.id === id);
  if(!it) return;
  editingId = id;
  $("edName").value = it.name;
  $("edBrand").value = it.brand || "";
  $("edPrice").value = it.price;
  $("edCategory").innerHTML = CATS.map(c => `<option ${c === it.category ? "selected" : ""}>${c}</option>`).join("");
  $("veil").classList.add("on");
  $("edit").classList.add("on");
}
function closeEdit(){
  editingId = null;
  $("veil").classList.remove("on");
  $("edit").classList.remove("on");
}
async function saveEdit(){
  if(!editingId) return;
  const { error } = await sb.from("catalog_items").update({
    name: $("edName").value.trim(),
    brand: $("edBrand").value.trim(),
    price: parseInt($("edPrice").value.replace(/[^\d]/g,"")) || 0,
    category: $("edCategory").value,
  }).eq("id", editingId);
  if(error){ toast("저장 실패: " + error.message); return; }
  closeEdit();
  toast("저장했습니다");
  await loadItems();
}

/* ═══ 토스트 ═══ */
let toastTimer;
function toast(msg){
  $("toast").textContent = msg;
  $("toast").classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("on"), 2400);
}

/* ═══ 드래그&드롭 ═══ */
const drop = $("drop");
["dragover","dragleave","drop"].forEach(evt => {
  drop.addEventListener(evt, e => {
    e.preventDefault();
    drop.classList.toggle("over", evt === "dragover");
    if(evt === "drop" && e.dataTransfer.files.length){
      $("fileInput").files = e.dataTransfer.files;
    }
  });
});

/* ═══ 기동 ═══ */
$("btnClassify").onclick = runClassify;
$("btnRegisterAll").onclick = registerAll;
$("edCancel").onclick = closeEdit;
$("edSave").onclick = saveEdit;
$("veil").onclick = closeEdit;
document.addEventListener("keydown", e => { if(e.key === "Escape") closeEdit(); });

loadItems();
</script>
</body>
</html>
